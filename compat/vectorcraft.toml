# VectorCraft versions the compatibility gate currently pins, per track
# (docs/src/design/compatibility-gate.md). Changed only by reviewed PRs — usually the gate's bot PR.

repository = "https://github.com/storytold/vectorcraft"

[tracks.stable]
tag = "v0.23.0"
# The SHA-256 of the release's Linux x86_64 archive, whose app the window probe runs (`cargo xtask compat
# window`). A new tag needs its own, which the release lists in its `SHA256SUMS.txt`.
linux-x86_64-sha256 = "07c24a6094fb457c665b95848d55bfbd05460354bc0eac9b4ec9f9467a8b1e31"

# The release whose source the browser demo's editor is built from (`web/build.py`,
# docs/src/design/vectorcraft-integration.md › Browser distribution), and the commit its tag names. It is
# newer than the stable track's while that release lacks the page calls the demo uses (`uiInspect` and
# `docInspect`, from 0.24). It is never older (`web/test_site.py`), and once the stable track reaches it, both
# name the same release.
[web]
tag = "v0.24.1"
revision = "f4922aa7ac99a4f6d56fc68a83a44945207ec610"

[tracks.prerelease]
# None newer than stable (VectorCraft's release workflow supports SemVer pre-releases such as 0.8.0-rc.1).
tag = ""

[tracks.release-branch]
branch = "release"

[tracks.main]
branch = "main"
