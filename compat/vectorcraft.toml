# VectorCraft versions the compatibility gate currently pins, per track
# (docs/src/design/compatibility-gate.md). Changed only by reviewed PRs — usually the gate's bot PR.

repository = "https://github.com/storytold/vectorcraft"

[tracks.stable]
tag = "v0.12.0"
# The SHA-256 of the release's Linux x86_64 archive, whose app the window probe runs (`cargo xtask compat
# window`). A new tag needs its own, which the release lists in its `SHA256SUMS.txt`.
linux-x86_64-sha256 = "6750db109d3a253c51c82975af650f42384ba27a768f72529431edfb58508269"

[tracks.prerelease]
# None newer than stable (VectorCraft's release workflow supports SemVer pre-releases such as 0.8.0-rc.1).
tag = ""

[tracks.release-branch]
branch = "release"

[tracks.main]
branch = "main"
