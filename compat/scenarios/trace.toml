# Level B: from a picture to a machine file, VectorCraft traces and StitchCraft embroiders
# (docs/src/design/image-to-embroidery.md › The flow). The reference machine's threads, as `stitch palette`
# writes them, are loaded as a swatch library. A badge drawn flat in 3 of them on white is placed and traced
# in colour with that library's colours, as they are, by the Abutting method, and its paths kept. Read with
# `--auto`, the document sews digitized automatically: the white round the badge, traced lowest, is left
# out as the picture's background, and the badge sews its 3 threads (xtask/src/compat/scenario/trace.rs).
description = "A picture traced by Image Trace in the threads `stitch palette` writes sews in them, digitized automatically, its background left out."
requirements = ["REQ-CLI-011", "REQ-AUTO-001", "REQ-AUTO-009"]

[[run]]
steps = [
  { cmd = "swatch.library.load", params = { name = "threads.gpl", data = { stitchcraft = "palette" } } },
  { cmd = "file.place", params = { name = "badge.png", dataBase64 = { stitchcraft = "badge.png" } } },
  { cmd = "imageTrace.make", params = { params = { mode = "color", palette = "documentLibrary", library = "loaded/threads.gpl", colors = 4, method = "abutting" } } },
  { cmd = "imageTrace.expand" },
  { export = "traced.vectorcraft" },
]

[expect]
traced = [{ file = "traced.vectorcraft", threads = ["#ed171f", "#0a55a3", "#e8a900"] }]
