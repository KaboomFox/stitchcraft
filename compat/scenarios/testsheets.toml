# Level B: each test sheet drawn as a design, drawn into a new document of its own by StitchCraft's Test
# Sheet filter, each object with its StitchCraft effect (docs/src/design/compatibility-gate.md). The document
# sews as the sheet's design moved by whole millimetres to the middle of the artboard, and StitchCraft's PES
# exporter writes it within an export's budget, as `stitch export` writes it.
description = "Each test sheet drawn as a design, drawn into a document by the Test Sheet filter, sews as its design moved, and exports as `stitch export` writes it."
requirements = ["REQ-VC-015"]

[[run]]
plugins = ["stroke", "satin", "fill", "testsheet", "pes"]
steps = [
  { cmd = "plugin.run", params = { id = "dev.stitchcraft.testsheet", params = { sheet = "TS-02B" } } },
  { export = "ts-02b.vectorcraft" },
  { export = "ts-02b.pes" },
]

