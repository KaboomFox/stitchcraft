# Level B: VectorCraft installs each of StitchCraft's modules and lists it as the plug-in it is: a stitch
# family's live effect, the Auto effect, a machine format's exporter, or a filter: Design Settings, Stroke to
# Satin, Auto-Route Satin Columns and Auto-Route Running Stitch, which ask for a heavy budget the run allows,
# Test Sheet and Tartan (docs/src/design/compatibility-gate.md).
description = "VectorCraft installs each of StitchCraft's modules, and lists each stitch family's live effect, the Auto effect, each machine format's exporter and each filter."
requirements = ["REQ-VC-002", "REQ-VC-011", "REQ-VC-013", "REQ-VC-014", "REQ-VC-015", "REQ-VC-016", "REQ-VC-018", "REQ-VC-020", "REQ-VC-021"]

[[run]]
plugins = ["stroke", "satin", "fill", "auto", "pes", "dst", "settings", "stroke-to-satin", "testsheet", "route-satins", "route-runs", "tartan"]
steps = [{ cmd = "plugin.list" }]

[expect]
listed = ["stroke", "satin", "fill", "auto", "pes", "dst", "settings", "stroke-to-satin", "testsheet", "route-satins", "route-runs", "tartan"]
