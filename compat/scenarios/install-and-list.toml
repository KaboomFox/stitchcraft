# Level B: VectorCraft installs each of StitchCraft's modules and lists it as the plug-in it is: a stitch
# family's live effect, a machine format's exporter, or the Design Settings filter
# (docs/src/design/compatibility-gate.md).
description = "VectorCraft installs each of StitchCraft's modules, and lists each stitch family's live effect, each machine format's exporter and the Design Settings filter."
requirements = ["REQ-VC-002", "REQ-VC-011", "REQ-VC-013"]

[[run]]
plugins = ["stroke", "satin", "fill", "pes", "dst", "settings"]
steps = [{ cmd = "plugin.list" }]

[expect]
listed = ["stroke", "satin", "fill", "pes", "dst", "settings"]
