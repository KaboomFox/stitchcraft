[package]
name = "stitchcraft-vc-contract"
description = "ABI contract tests: StitchCraft plug-ins inside VectorCraft's real plug-in host"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace: `cargo xtask compat contract` copies this crate and points the VectorCraft
# dependencies at the ref under test (a tag for releases, a commit for branch tracks).
[workspace]

[dependencies]
vectorcraft-plugins = { git = "https://github.com/storytold/vectorcraft", tag = "v0.19.0" }
vectorcraft-geom = { git = "https://github.com/storytold/vectorcraft", tag = "v0.19.0" }
# The appearance of an object whose fills and strokes a live effect is given (from VectorCraft 0.14).
vectorcraft-doc = { git = "https://github.com/storytold/vectorcraft", tag = "v0.19.0" }
serde_json = "1"
