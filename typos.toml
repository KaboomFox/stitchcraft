# https://github.com/crate-ci/typos — run in CI.
[files]
extend-exclude = [
  "conformance/golden/", "conformance/fixtures/", "*.svg", "*.pes", "*.dst",
  # VectorCraft templates contain binary PDF preview streams, not prose.
  "*.vctemplate",
  # Third-party prose-lint rules, kept as their authors wrote them (vale-ai-tells, MIT).
  ".vale/styles/ai-tells/",
]

[default.extend-words]
# Embroidery and format vocabulary.
PEC = "PEC"
JEF = "JEF"
DSB = "DSB"
DSZ = "DSZ"
Ellageo = "Ellageo"
# German words in a cited paper title (Hilbert).
ein = "ein"
# The gzip crate, flate2.
flate = "flate"
# Creative Commons licence names, CC BY-ND and CC BY-NC-ND (the fonts corpus, M8.6).
ND = "ND"
nd = "nd"
# Font names in Ink/Stitch's library: AGS Garamond, Apex simple AGS (the fonts corpus, M8.6).
AGS = "AGS"
ags = "ags"
