[package]
name = "stitchcraft-xtask"
description = "StitchCraft repository automation: every gate, generator and check (cargo xtask ...)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The conformance runner draws test sheets, encodes them and previews changed machine files in-process,
# and the docs generator renders reference pages from the registries (xtask is exempt from layering).
clap = { workspace = true }
stitchcraft-cli = { path = "../apps/stitchcraft-cli" }
stitchcraft-core = { workspace = true }
stitchcraft-engine = { workspace = true }
stitchcraft-formats = { workspace = true }
stitchcraft-params = { workspace = true }
stitchcraft-plan = { workspace = true }
stitchcraft-render = { workspace = true }
stitchcraft-svg = { workspace = true }
stitchcraft-vectorcraft = { workspace = true }
stitchcraft-testkit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
