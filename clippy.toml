# Tests may unwrap, expect, panic, index and print: a failing assertion is the point of a test. Shipped
# code may not (workspace lints in Cargo.toml; AGENTS.md › Non-negotiables).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Determinism by construction (docs/src/design/determinism.md). Binaries that legitimately need one of
# these (timing a benchmark, say) allow the lint at the use site with a comment.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; use BTreeMap (docs/src/design/determinism.md)" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; use BTreeSet (docs/src/design/determinism.md)" },
    { path = "std::hash::RandomState", reason = "its keys come from the OS's randomness (docs/src/design/determinism.md)" },
    { path = "std::time::SystemTime", reason = "library output must not depend on time" },
    { path = "std::time::Instant", reason = "budgets count work units, not time (docs/src/design/data-model.md#budgets)" },
]
