[[shot]]
id = "vectorcraft-patch"
kind = "vectorcraft-render"
plugins = ["stroke", "satin", "fill"]
scale = 4.0
document = "docs/fixtures/round-patch.vectorcraft"
# The tutorial's patch (docs/src/user/tutorials/vectorcraft-patch.md), step by step, each shape where a
# click would put it. VectorCraft shows a fill's rows up to about 31 mm across, and its outline beyond.
# The document is kept for the tutorial's export and the picture of what it sews.
steps = [
  { cmd = "file.new", params = { width = 108, height = 108 } },
  # 1. The disc, a fill.
  { cmd = "shape.ellipse", params = { x = 14, y = 14, width = 80, height = 80 } },
  { cmd = "paint.setFill", params = { color = "#1f4e9c" } },
  { cmd = "paint.setStroke", params = { none = true } },
  { apply = "fill", params = { angle = 45 } },
  # 2. The star, a line of running stitch.
  { cmd = "shape.star", params = { cx = 54, cy = 54, radius1 = 26, radius2 = 11, points = 5 } },
  { cmd = "paint.setFill", params = { none = true } },
  { cmd = "paint.setStroke", params = { color = "#ffffff" } },
  { apply = "stroke" },
  # 3. The border's 2 rails, drawn while the rest is locked, aligned, joined and given the satin effect.
  { cmd = "select.all" },
  { cmd = "object.lock" },
  { cmd = "shape.ellipse", params = { x = 12, y = 12, width = 84, height = 84 } },
  { cmd = "shape.ellipse", params = { x = 19, y = 19, width = 70, height = 70 } },
  { cmd = "select.all" },
  { cmd = "object.align", params = { horizontal = "center" } },
  { cmd = "object.align", params = { vertical = "center" } },
  { cmd = "object.compoundPath.make" },
  { cmd = "paint.setFill", params = { none = true } },
  { cmd = "paint.setStroke", params = { color = "#d9a400" } },
  { apply = "satin" },
  # 4. Everything centred on the border.
  { cmd = "object.unlockAll" },
  { cmd = "select.all" },
  { cmd = "object.align", params = { horizontal = "center" } },
  { cmd = "object.align", params = { vertical = "center" } },
]
alt = "The patch in VectorCraft's canvas, as the plug-ins' previews show it. Rows at 45 degrees fill the blue disc, and a white star of running stitch lies on it, inside a gold satin border."
