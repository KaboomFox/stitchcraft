[[shot]]
id = "routing-letters"
kind = "stitch"
sheet = "TS-17C"
elements = ["ts17c:drawn:", "ts17c:routed:"]
allow = ["SC-I0504"]
style = "simple"
scale = 4.0
alt = "TS-17C's letters ROUTE drawn as thin lines, twice: at the top sewn column by column, and at the bottom as Auto-Route Satin Columns routes them. Dashed lines are jumps, which the reference machine leaves as threads to cut by hand, and orange rings mark lock stitches. The routed letters jump only from one letter to the next."

[[shot]]
id = "routing-lines"
kind = "stitch"
sheet = "TS-17C"
elements = ["ts17c:lines-"]
allow = ["SC-I0504"]
style = "simple"
scale = 6.0
alt = "TS-17C's network of 6 running stitches drawn as thin lines, twice: on the left sewn line by line, and on the right as Auto-Route Running Stitch routes them with Trim jump stitches on. A rail along the bottom, a post across it, a brace from the post down to the rail, a hook curving up from the rail, a line that crosses itself above them, and a tick beside the rail. Dashed lines are jumps, and orange rings mark lock stitches. Sewn line by line, the machine jumps from each line to the next. Routed, it jumps only out to the line apart and back, and trims before each of those jumps. It reaches the tick, 0.5 mm off the rail, with a stitch."

