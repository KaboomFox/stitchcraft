# Every image in the docs is declared here and regenerated by `cargo xtask shots`
# (see docs/src/design/docs-pipeline.md). An image under docs/src/images/ without a declaration,
# or a declaration without alt text, fails `cargo xtask docs --check`; pages that show a shot use
# its alt text.
#
# Kinds: "stitch" (our renderer, exact bytes), "picture" (drawn by xtask, exact bytes), "vectorcraft-render"
# (vectorcraft-cli export) and "vectorcraft-ui" (VectorCraft's window, driven through its accessibility
# tree), both compared within a tolerance, and "photo" (a real sew-out; never regenerated, needs a sew-out
# report link).
#
# A "stitch" shot names a style ("realistic" or "simple"), a scale in pixels per millimetre, and what to
# draw: a test sheet (`sheet = "TS-01"`), or a design that the engine plans for the reference machine as
# `stitch plan` does, an SVG file (`fixture = "docs/fixtures/wave.svg"`) or a VectorCraft document. It
# becomes docs/src/images/generated/<id>.png. A sheet's shot can show part of it, the elements whose ids
# start with one of `elements = ["ts17c:lines-"]`, planned alone, and their plan may then report only the
# codes `allow` lists. A design can have panels, each with a caption and parameters set on
# every element:
#   panels = [{ caption = "1.5 mm", params = { running_stitch_length_mm = "1.5" } }, …]
# and then makes <id>-1.png, <id>-2.png and so on. A page shows them side by side between the lines
# `<!-- shot: <id> -->` and `<!-- /shot -->`, which `cargo xtask docs` fills in. `layout = "rows"` shows
# them one under another instead, each as wide as the page, for pictures too wide to share it. The plan of
# a design may report only the diagnostic codes its shot lists in `allow = ["SC-W0402"]`. `auto = true` reads
# the design as `--auto` does, its shapes without settings digitized automatically.
#
# A "picture" shot shows a picture before it is digitized: a design's areas filled flat in their threads'
# colours (`fixture`, at `scale` pixels per millimetre), or a photo drawn in code (`picture = "pear"`).

