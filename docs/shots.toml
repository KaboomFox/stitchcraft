[[shot]]
id = "vectorcraft-satin-rails"
kind = "vectorcraft-render"
plugins = ["satin"]
scale = 4.0
# The how-to's satin column of 2 rails (docs/src/user/how-to/vectorcraft-columns-and-presets.md): 2 curves
# 3 mm apart, joined into a compound path and given StitchCraft Satin. Coordinates are points.
steps = [
  { cmd = "file.new", params = { width = 128, height = 72 } },
  { cmd = "path.create", params = { d = "M 14 46 C 40 12 88 12 114 46" } },
  { cmd = "path.create", params = { d = "M 14 54.5 C 40 20.5 88 20.5 114 54.5" } },
  { cmd = "select.all" },
  { cmd = "object.compoundPath.make" },
  { cmd = "paint.setFill", params = { none = true } },
  { cmd = "paint.setStroke", params = { color = "#d9a400" } },
  { apply = "satin" },
]
alt = "A gold satin column in VectorCraft's canvas, its stitches across the band between 2 curved rails that make one compound path, as StitchCraft Satin shows them."

