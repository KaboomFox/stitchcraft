# ── VectorCraft's own pictures (`cargo xtask shots --vectorcraft`, the shots-ui job) ──────────────────
# Made by the stable release compat/vectorcraft.toml pins. `vectorcraft-cli` installs the `plugins` and
# draws the document from `steps`, as a Level B scenario's (compat/scenarios/), in points, applying each
# stitch family once at most: VectorCraft keeps a module's last error only until its next success. A
# "vectorcraft-render" shot is that document's PNG export, `scale` pixels per point. A "vectorcraft-ui" shot
# opens it in VectorCraft's window, selects everything, and presses `menu`, the menu bar's title and then
# rows, through the accessibility tree. The picture shows the menus open, or with `dialog = "<family>"` the
# dialog of that family's effect, in a window tall enough for it, which must show a row for each of the
# module's parameters: its label, and the control of its type.

[[shot]]
id = "vectorcraft-plugins-menu"
kind = "vectorcraft-ui"
plugins = ["stroke", "satin", "fill"]
steps = [
  { cmd = "file.new", params = { width = 144, height = 144 } },
  { cmd = "shape.ellipse", params = { x = 12, y = 12, width = 120, height = 120 } },
  { cmd = "paint.setFill", params = { color = "#1f4e9c" } },
]
menu = ["Effect", "Plug-ins"]
alt = "VectorCraft's Effect menu, open at Plug-ins, which lists StitchCraft Fill, StitchCraft Satin and StitchCraft Stroke."

[[shot]]
id = "vectorcraft-fill-dialog"
kind = "vectorcraft-ui"
plugins = ["stroke", "satin", "fill"]
steps = [
  { cmd = "file.new", params = { width = 144, height = 144 } },
  { cmd = "shape.ellipse", params = { x = 12, y = 12, width = 120, height = 120 } },
  { cmd = "paint.setFill", params = { color = "#1f4e9c" } },
]
menu = ["Effect", "Plug-ins"]
dialog = "fill"
alt = "The StitchCraft Fill dialog in VectorCraft, with a row for each setting under its Ink/Stitch name, from Fill and Fill_method at the top to Max_stitch_length_mm and Preview_level at the bottom. Under them are the Preview checkbox, checked, and the Cancel and OK buttons."

