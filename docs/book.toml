[book]
title = "StitchCraft"
authors = ["StitchCraft contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
# A link in SUMMARY.md to a missing file is an error, never a silently created empty page.
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/KaboomFox/stitchcraft"
# Every page gets a "suggest an edit" link straight to its source. mdBook puts the page's path from this
# folder for `{path}`, `src/` included; `cargo xtask book` checks that each link names a file.
edit-url-template = "https://github.com/KaboomFox/stitchcraft/edit/main/docs/{path}"
smart-punctuation = true

[output.html.search]
enable = true

[output.html.print]
# print.html is the printable manual.
enable = true
