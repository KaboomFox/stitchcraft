# Command-line examples shown in the docs. `cargo xtask docs` runs each one with the `stitch` binary in an
# empty directory and writes what it prints to docs/src/user/reference/generated/<id>.txt, which pages
# include. `cargo xtask docs --check` fails when an example prints something else.
#
# `files` are copied from the repository into the directory first. `setup` commands run without being
# shown. Each command of `run` is shown after `$ `, with its output and, when it is not 0, its exit
# status. A command is split into words at spaces, and double quotes keep spaces in one word.

[[example]]
id = "testsheet-ts-01"
run = ["stitch testsheet TS-01 -o TS-01.pes"]

[[example]]
id = "preview-ts-01"
setup = ["stitch testsheet TS-01 -o TS-01.pes"]
run = ["stitch preview TS-01.pes -o TS-01.png"]

[[example]]
id = "inspect-ts-02"
setup = ["stitch testsheet TS-02 -o TS-02.pes"]
run = ["stitch inspect TS-02.pes --profile brother-pe800-5x7"]

[[example]]
id = "preview-ts-02"
setup = ["stitch testsheet TS-02 -o TS-02.pes"]
run = ["stitch preview TS-02.pes -o TS-02.png --style simple"]

[[example]]
id = "convert-ts-02-dst"
setup = ["stitch testsheet TS-02 -o TS-02.pes"]
run = ["stitch convert TS-02.pes -o TS-02.dst", "stitch inspect TS-02.dst"]

[[example]]
id = "testsheet-ts-10b-4x4"
run = ["stitch testsheet TS-10B --profile brother-pe800-4x4 -o TS-10B.pes"]

[[example]]
id = "explain-sc-w0702"
run = ["stitch explain SC-W0702"]

[[example]]
id = "plan-too-wide"
files = ["docs/fixtures/wide.svg"]
run = ["stitch plan wide.svg -o wide.pes"]

[[example]]
id = "plan-strokes"
files = ["conformance/fixtures/svg/strokes.svg"]
run = ["stitch plan strokes.svg -o strokes.pes --preview strokes.png --report strokes.json"]

[[example]]
id = "plan-badge"
files = ["docs/fixtures/badge.svg"]
run = ["stitch plan badge.svg -o badge.pes --preview badge.png"]

[[example]]
id = "export-round-patch"
files = ["docs/fixtures/round-patch.vectorcraft"]
run = ["stitch export round-patch.vectorcraft -o round-patch.pes --preview round-patch.png"]

[[example]]
id = "export-patch"
files = ["conformance/fixtures/vectorcraft/patch.vectorcraft"]
run = ["stitch export patch.vectorcraft -o patch.pes --preview patch.png"]
