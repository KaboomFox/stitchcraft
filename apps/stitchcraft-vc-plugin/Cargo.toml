[package]
name = "stitchcraft-vc-plugin"
description = "StitchCraft plug-ins for VectorCraft (WebAssembly plug-in ABI v1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
# `cdylib` is the .wasm VectorCraft installs; `rlib` lets native tests exercise the same code.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
# Which plug-in the module is (`docs/src/design/vectorcraft-integration.md`, `src/lib.rs`): the live effect of
# one stitch family, or without any, the M0.6 *hello* effect the contract tests measure. Given more than
# one, the module is the first of fill, satin and stroke.
stroke = []
satin = []
fill = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
stitchcraft-core = { workspace = true }
stitchcraft-params = { workspace = true }
stitchcraft-plan = { workspace = true }
stitchcraft-engine = { workspace = true }
stitchcraft-vectorcraft = { workspace = true }
