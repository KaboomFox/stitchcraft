[package]
name = "stitchcraft-cli"
description = "stitch: the StitchCraft command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "stitchcraft_cli"
path = "src/lib.rs"

[[bin]]
name = "stitch"
path = "src/main.rs"

# Stands in for VectorCraft's command line in its own tests, so it starts as that program does, without the
# standard test harness (`tests/picture.rs`).
[[test]]
name = "picture"
harness = false

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
# Bug-report bundles are JSON (`commands::bug_report`).
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
stitchcraft-core = { workspace = true }
stitchcraft-engine = { workspace = true }
stitchcraft-formats = { workspace = true }
stitchcraft-plan = { workspace = true }
stitchcraft-render = { workspace = true }
stitchcraft-svg = { workspace = true }
stitchcraft-vectorcraft = { workspace = true }

[dev-dependencies]
stitchcraft-testkit = { workspace = true }
