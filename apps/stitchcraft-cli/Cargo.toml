[package]
name = "stitchcraft-cli"
description = "stitch: the StitchCraft command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "stitchcraft_cli"
path = "src/lib.rs"

[[bin]]
name = "stitch"
path = "src/main.rs"

# Stands in for VectorCraft's command line in its own tests, so it starts as that program does, without the
# standard test harness (`tests/picture.rs`).
[[test]]
name = "picture"
harness = false

[lints]
workspace = true

[features]
default = ["cutout"]
# The subject cut-out of `--subject` and `stitch cutout` (ADR-0019): photos decoded and the models run, which
# brings tract and `image` into `stitch`. A build without it, such as the WASI one that makes the golden
# files, says so with SC-E1207 when asked for a cut-out.
cutout = ["stitchcraft-cutout/models"]

[dependencies]
clap = { workspace = true }
# Bug-report bundles are JSON (`commands::bug_report`).
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
stitchcraft-core = { workspace = true }
# The subject cut-out of `--subject` and `stitch cutout`, which only `stitch` depends on (ADR-0019).
stitchcraft-cutout = { workspace = true }
stitchcraft-engine = { workspace = true }
stitchcraft-formats = { workspace = true }
stitchcraft-plan = { workspace = true }
stitchcraft-render = { workspace = true }
stitchcraft-svg = { workspace = true }
stitchcraft-vectorcraft = { workspace = true }

[dev-dependencies]
# The cut-out's tests draw pictures and read the cut-outs back.
image = { workspace = true }
stitchcraft-testkit = { workspace = true }
