version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    # The workflows, and the composite actions they share: .github/actions/tools pins the tools' installer.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
