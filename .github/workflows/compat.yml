# VectorCraft compatibility gate (docs/src/design/compatibility-gate.md).
#
# Daily: find VectorCraft's latest stable release, latest pre-release (alpha/beta/rc), and the heads of its
# `release` and `main` branches, and run both levels against each (`cargo xtask compat track`). Level A loads
# our freshly built plug-ins into VectorCraft's real plug-in host. Level B runs the scenarios of
# compat/scenarios with VectorCraft's own command line, from the release's Linux archive, or built from the
# branch. The report job then opens, updates or closes one issue per track, and adopts a new release that
# passes both levels with a pull request, which pins it and adds it to the generated supported-versions page.
# Pull requests that touch the plug-in or the gate test the pinned stable version.
# The move rehearsal puts this repository into VectorCraft's latest release and `main` as a folder, both
# ways ADR-0011 describes, and runs StitchCraft's gates there; pull requests that touch manifests or
# tooling rehearse against the pinned stable version.
# The window probe runs the pinned stable release's app without a screen: two screenshots alike, and xa11y
# driving the window through its accessibility tree (spike M0.8, docs/src/design/docs-pipeline.md).
name: compat

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/stitchcraft-vc-plugin/**"
      - "crates/stitchcraft-vectorcraft/**"
      - "compat/**"
      - "xtask/**"
      - "**/Cargo.toml"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - ".github/actions/**"
      - ".github/workflows/compat.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      report: ${{ steps.discover.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - id: discover
        name: Discover VectorCraft releases, pre-releases and branch heads
        run: |
          # A discovery that fails fails the step: inside `echo "report=$(…)"` its exit status would be lost,
          # and every track would test nothing.
          report=$(cargo xtask compat discover --json)
          echo "report=$report" >> "$GITHUB_OUTPUT"
          { echo '```'; cargo xtask compat discover; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  track:
    name: track (${{ matrix.track }})
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON('["stable","prerelease","release-branch","main"]') }}
    runs-on: ubuntu-24.04
    # A branch's vectorcraft-cli is built from source, which takes the longest.
    timeout-minutes: 120
    env:
      TRACK: ${{ matrix.track }}
      BRANCH: ${{ matrix.track == 'release-branch' || matrix.track == 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Resolve the VectorCraft ref for this track
        id: ref
        uses: ./.github/actions/vectorcraft-ref
        with:
          report: ${{ needs.discover.outputs.report }}
          track: ${{ matrix.track }}
      # A release's vectorcraft-cli comes from its Linux archive; a branch's is built here.
      - name: Check out VectorCraft ${{ steps.ref.outputs.ref }}, to build its vectorcraft-cli
        if: steps.ref.outputs.ref != '' && env.BRANCH == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/vectorcraft
          ref: ${{ steps.ref.outputs.ref }}
          path: vectorcraft
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.ref.outputs.ref != '' && env.BRANCH == 'true'
        with:
          workspaces: vectorcraft -> target
      - name: Build vectorcraft-cli
        if: steps.ref.outputs.ref != '' && env.BRANCH == 'true'
        # A build that fails is recorded: Level B finds no vectorcraft-cli, and says so.
        continue-on-error: true
        working-directory: vectorcraft
        run: cargo build --release --locked -p vectorcraft-cli
      # Builds the plug-in's modules for wasm32, hello and one for each stitch family, notes their sizes, and
      # writes the track's result in target/compat/results for the report.
      - name: Both levels against VectorCraft ${{ steps.ref.outputs.ref }}
        if: steps.ref.outputs.ref != ''
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          if [ "$BRANCH" = true ]; then
            cargo xtask compat track "$TRACK" --ref "$REF" --cli vectorcraft/target/release/vectorcraft-cli
          else
            cargo xtask compat track "$TRACK" --ref "$REF"
          fi
      - name: Nothing to test on this track
        if: steps.ref.outputs.ref == ''
        run: echo "VectorCraft has no ${{ matrix.track }} build right now." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the result, for the report
        if: always() && steps.ref.outputs.ref != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-result-${{ matrix.track }}
          path: target/compat/results/${{ matrix.track }}.json
          if-no-files-found: ignore
      - name: Keep what VectorCraft wrote and said in Level B
        if: always() && steps.ref.outputs.ref != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-e2e-${{ matrix.track }}
          path: target/compat/e2e/
          if-no-files-found: ignore

  move:
    name: moves into VectorCraft (${{ matrix.track }})
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        track: ${{ github.event_name == 'pull_request' && fromJSON('["stable"]') || fromJSON('["stable","main"]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the VectorCraft ref for this track
        id: ref
        uses: ./.github/actions/vectorcraft-ref
        with:
          report: ${{ needs.discover.outputs.report }}
          track: ${{ matrix.track }}
      - name: Check out VectorCraft ${{ steps.ref.outputs.ref }}
        if: steps.ref.outputs.ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/vectorcraft
          ref: ${{ steps.ref.outputs.ref }}
          path: vectorcraft
          persist-credentials: false
      - name: Put StitchCraft into VectorCraft as the folder stitchcraft/
        if: steps.ref.outputs.ref != ''
        run: |
          mkdir vectorcraft/stitchcraft
          git archive HEAD | tar -x -C vectorcraft/stitchcraft
      - name: Install StitchCraft's pinned toolchain
        if: steps.ref.outputs.ref != ''
        working-directory: vectorcraft/stitchcraft
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.ref.outputs.ref != ''
        with:
          workspaces: |
            vectorcraft -> target
            vectorcraft/stitchcraft -> target
      - uses: ./.github/actions/oracle
        if: steps.ref.outputs.ref != ''
        with:
          directory: vectorcraft/stitchcraft
      - name: "Nested: a VectorCraft crate depends on StitchCraft's engine by path"
        if: steps.ref.outputs.ref != ''
        working-directory: vectorcraft
        run: |
          (cd stitchcraft && cargo xtask compat join --nested ..)
          mkdir -p apps/stitchcraft-probe/src
          printf '%s\n' '[package]' 'name = "stitchcraft-probe"' 'version.workspace = true' 'edition.workspace = true' \
            'license.workspace = true' 'publish = false' '' '[dependencies]' \
            'stitchcraft-engine = { path = "../../stitchcraft/crates/stitchcraft-engine" }' > apps/stitchcraft-probe/Cargo.toml
          printf '%s\n' '//! VectorCraft depending on StitchCraft by path (ADR-0011, nested).' 'fn main() {' \
            '    println!("{} parameter groups", stitchcraft_engine::registry::PARAMETERS.len());' '}' > apps/stitchcraft-probe/src/main.rs
          cargo run --quiet -p stitchcraft-probe
          rm -r apps/stitchcraft-probe
      - name: "Joined: StitchCraft's crates join VectorCraft's workspace"
        if: steps.ref.outputs.ref != ''
        working-directory: vectorcraft/stitchcraft
        run: cargo xtask compat join ..
      - name: StitchCraft's gates, inside VectorCraft's workspace
        if: steps.ref.outputs.ref != ''
        working-directory: vectorcraft/stitchcraft
        run: cargo xtask ci
      - name: Nothing to rehearse on this track
        if: steps.ref.outputs.ref == ''
        run: echo "VectorCraft has no ${{ matrix.track }} build right now." >> "$GITHUB_STEP_SUMMARY"

  window:
    name: window (pinned stable, headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: A desktop without a screen (Xvfb, Mesa, D-Bus, AT-SPI)
        # libxkbcommon-dev links xa11y's keyboard maps; the rest is what VectorCraft's window loads.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth dbus at-spi2-core libxkbcommon-dev \
            libegl1 libegl-mesa0 libgl1-mesa-dri libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
      - name: VectorCraft's window, photographed and driven through its accessibility tree
        run: cargo xtask compat window
      - name: Keep the screenshots, the tree and the app's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: window
          path: |
            target/compat/window/*.png
            target/compat/window/*.txt
            target/compat/window/*.log
            target/compat/window/*.jsonl
          if-no-files-found: ignore

  report:
    needs: [discover, track, move]
    # Also when a track failed, and never for a cancelled run, whose tracks wrote no results.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    permissions:
      # The adopting pull request's branch, the pull request, the issues, and dispatching the pull request's
      # checks, which GitHub doesn't start for a push made with this workflow's token.
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compat-result-*
          path: results
          merge-multiple: true
      - name: Decide, and write the adoption of a new release that passed
        env:
          # Empty when discovery failed.
          REPORT: ${{ needs.discover.outputs.report }}
          MOVE: ${{ needs.move.result }}
        run: |
          mkdir -p results
          # The record and the pins change only for an adoption, which the last step commits.
          cargo xtask compat report --results results --discovered "$REPORT" --move "$MOVE" --date "$(date -u +%F)" \
            --run-url "$RUN_URL" --write > decisions.json
          jq . decisions.json
      - name: Open, comment on or close each issue
        # `cargo xtask compat issue` comments on the open issue with the title, if there is one, and opens
        # one only if there isn't. An issue that can't be filed doesn't stop the others.
        run: |
          jq -c '.issues[]' decisions.json > issues.jsonl
          failed=0
          while read -r issue; do
            cargo xtask compat issue "$issue" || failed=1
          done < issues.jsonl
          exit "$failed"
      - name: Adopt a new release with a pull request
        run: |
          if [ "$(jq -r '.adopt != null' decisions.json)" != true ]; then
            echo "No new release to adopt." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch=$(jq -r .adopt.branch decisions.json)
          title=$(jq -r .adopt.title decisions.json)
          body=$(jq -r .adopt.body decisions.json)
          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "$branch already has an open pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo xtask docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add compat docs
          git commit -m "$title" -m "Adopted by the compatibility gate's scheduled run: $RUN_URL"
          git push --force origin "HEAD:refs/heads/$branch"
          if gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --title "$title" --body "$body"; then
            # GitHub starts no workflow for a push made with this workflow's token, except dispatched ones.
            for workflow in ci.yml docs.yml goldens.yml compat.yml; do
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$branch"
            done
          else
            # The repository doesn't let GitHub Actions open pull requests (Settings › Actions › General): one
            # issue says so, under the same title every time, until the release is adopted.
            echo "::warning::GitHub Actions may not open pull requests here, so $branch waits for one."
            cargo xtask compat issue "$(jq -c .adopt.waiting decisions.json)"
          fi
