# Golden files are promises about exact bytes: the machine files sewn at machine checkpoints, the
# canonical format outputs and the preview images (docs/src/design/conformance.md). A pull request that
# changes one must say so — the `golden-change` label — and record it in CHANGELOG.md. Runs on label changes too, so adding the label
# re-checks without a new push.
name: goldens

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # docs-refresh.yml dispatches this for the commit it pushes to a pull request.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  goldens:
    name: changed golden files have a reason
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the label and the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          # The base branch as it is now. GitHub leaves `pull_request.base.sha` at the commit the base had
          # when the pull request was opened, and a diff from there counts the golden files that pull
          # requests merged since have changed.
          BASE: origin/${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Dispatched for a branch: take the base and the labels from its open pull request.
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME&state=open" \
              --jq '.[0] // empty | {base: .base.ref, labels: [.labels[].name]}')
            if [ -z "$pr" ]; then
              echo "::error::$GITHUB_REF_NAME has no open pull request to check."
              exit 1
            fi
            BASE="origin/$(echo "$pr" | jq -r .base)"
            LABELS=$(echo "$pr" | jq -c .labels)
          fi
          changed=$(git diff --name-only "$BASE"...HEAD -- conformance/golden)
          if [ -z "$changed" ]; then
            echo "No golden files changed."
            exit 0
          fi
          echo "Golden files changed:"
          echo "$changed"
          case "$LABELS" in
            *'"golden-change"'*) ;;
            *) echo "::error::Golden files changed. Add the golden-change label and explain in the PR why they must change."; exit 1 ;;
          esac
          if ! git diff --name-only "$BASE"...HEAD | grep -qx CHANGELOG.md; then
            echo "::error::Golden files changed. Add a line to CHANGELOG.md saying what sews or looks different."
            exit 1
          fi
          echo "Labelled and recorded in CHANGELOG.md."
