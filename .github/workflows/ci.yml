# Every gate on every pull request (docs/src/design/guardrails.md). `gates` runs exactly what
# contributors run locally — `cargo xtask ci` — with the optional tools installed, so nothing is skipped.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # docs-refresh.yml dispatches this for the commit it pushes to a pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  gates:
    name: gates (cargo xtask ci)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned toolchain (rust-toolchain.toml) and the wasm target
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          # cargo-public-api's version is the one the API snapshots are made with (xtask/src/api.rs).
          tool: cargo-deny,typos,mdbook,cargo-public-api@0.52.0
      - name: The independent reader for REQ-FMT-005 (pyembroidery, pinned by hash)
        uses: ./.github/actions/oracle
      - run: cargo xtask ci
      - name: Keep new previews and conformance diffs when something differs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differences-gates
          path: |
            target/tmp/*.png
            target/conformance/diffs/
            target/shots/
          if-no-files-found: ignore

  coverage:
    # The ratchet: no crate's line coverage below its floor in conformance/coverage.toml. The table goes
    # to the job summary.
    name: coverage (no crate below its floor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned toolchain with the LLVM tools
        run: |
          rustup toolchain install --profile minimal
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: .github/scripts/annotated.sh "coverage" cargo xtask coverage

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      - name: Keep new previews when one differs from its golden file
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differences-${{ matrix.os }}
          path: target/tmp/*.png
          if-no-files-found: ignore

  msrv:
    name: msrv (Rust 1.95, same floor as VectorCraft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.95.0 check --workspace --locked
