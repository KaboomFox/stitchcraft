# Every gate on every pull request (docs/src/design/guardrails.md). `gates` runs exactly what
# contributors run locally — `cargo xtask ci` — with the optional tools installed, so nothing is skipped.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # docs-refresh.yml dispatches this for the commit it pushes to a pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  gates:
    name: gates (cargo xtask ci)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `cargo xtask prose` lints the lines added since the merge base with origin/main.
          fetch-depth: 0
      - name: Pinned toolchain (rust-toolchain.toml) and the wasm targets
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/tools
        with:
          tools: cargo-deny,typos,mdbook,cargo-public-api
      - name: wasmtime, which runs `stitch` as WebAssembly for `cargo xtask wasm --goldens` (pinned by hash)
        env:
          VERSION: "49.0.3"
          SHA256: 4001225413f208345b980525f31c4080e1873808b38d0ddc7918497340667fbb
        run: |
          archive="wasmtime-v$VERSION-x86_64-linux"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive.tar.xz" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v$VERSION/$archive.tar.xz"
          echo "$SHA256  $RUNNER_TEMP/$archive.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "$RUNNER_TEMP/$archive.tar.xz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: The independent reader for REQ-FMT-005 (pyembroidery, pinned by hash)
        uses: ./.github/actions/oracle
      - name: Vale for `cargo xtask prose`, built from its tagged source (Go's checksum database checks it)
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/vale-cli/vale/v3/cmd/vale@v3.23.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: cargo xtask ci
      - name: Keep new previews and conformance diffs when something differs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differences-gates
          path: |
            target/tmp/*.png
            target/conformance/diffs/
            target/shots/
          if-no-files-found: ignore

  coverage:
    # The ratchet: no crate's line coverage below its floor in conformance/coverage.toml. The table goes
    # to the job summary.
    name: coverage (no crate below its floor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned toolchain with the LLVM tools
        run: |
          rustup toolchain install --profile minimal
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/tools
        with:
          tools: cargo-llvm-cov
      - run: .github/scripts/annotated.sh "coverage" cargo xtask coverage

  perf:
    # The performance budget: one plan of the reference hoop's whole field takes no more instructions than
    # conformance/perf.toml records, counted by valgrind's callgrind; its time goes to the job summary.
    name: perf (the hoop's whole field within its record)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Valgrind, whose callgrind counts the instructions
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      - run: .github/scripts/annotated.sh "perf" cargo xtask perf

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      - name: Keep new previews when one differs from its golden file
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differences-${{ matrix.os }}
          path: target/tmp/*.png
          if-no-files-found: ignore

  msrv:
    name: msrv (Rust 1.95, same floor as VectorCraft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +1.95.0 check --workspace --locked
