# Every gate on every pull request (docs/src/design/guardrails.md). `gates` runs exactly what
# contributors run locally — `cargo xtask ci` — with the optional tools installed, so nothing is skipped.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # docs-refresh.yml dispatches this for the commit it pushes to a pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  gates:
    name: gates (cargo xtask ci)
    runs-on: ubuntu-24.04
    env:
      # wasmtime, which runs `stitch` as WebAssembly for `cargo xtask wasm --goldens`: its version, and the
      # SHA-256 of its Linux archive.
      WASMTIME_VERSION: "49.0.3"
      WASMTIME_SHA256: 4001225413f208345b980525f31c4080e1873808b38d0ddc7918497340667fbb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `cargo xtask prose` lints the lines added since the merge base with origin/main.
          fetch-depth: 0
      - name: Pinned toolchain (rust-toolchain.toml) and the wasm targets
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/tools
        with:
          tools: cargo-deny,typos,mdbook,cargo-public-api
      # A pull request restores the archive a run on main kept, under its version and SHA-256, so an outage
      # of GitHub's release downloads doesn't fail it. The next step checks the SHA-256 of whatever the cache
      # gives, and fetches the archive again when the sums differ.
      - name: wasmtime's archive, from the Actions cache when a run kept it
        id: wasmtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wasmtime-v${{ env.WASMTIME_VERSION }}-x86_64-linux.tar.xz
          key: wasmtime-v${{ env.WASMTIME_VERSION }}-x86_64-linux-${{ env.WASMTIME_SHA256 }}
      - name: wasmtime, which runs `stitch` as WebAssembly for `cargo xtask wasm --goldens` (pinned by hash)
        run: |
          archive="wasmtime-v$WASMTIME_VERSION-x86_64-linux"
          file="$RUNNER_TEMP/$archive.tar.xz"
          if ! echo "$WASMTIME_SHA256  $file" | sha256sum --check --status 2>/dev/null; then
            # curl tries again after any error, every 10 seconds for a minute, as xtask's downloads of
            # VectorCraft's releases do (xtask/src/compat/release.rs, whose test checks the options here).
            curl --fail --location --retry-all-errors --retry 6 --retry-delay 10 --retry-max-time 60 --connect-timeout 20 --speed-time 20 \
              --no-progress-meter --output "$file" \
              "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/$archive.tar.xz"
          fi
          echo "$WASMTIME_SHA256  $file" | sha256sum --check --strict
          tar --extract --xz --file "$file" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      # After the step above, which fails unless the archive's SHA-256 is the pinned one.
      - name: Keep wasmtime's archive in the Actions cache
        if: steps.wasmtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/wasmtime-v${{ env.WASMTIME_VERSION }}-x86_64-linux.tar.xz
          key: wasmtime-v${{ env.WASMTIME_VERSION }}-x86_64-linux-${{ env.WASMTIME_SHA256 }}
      - name: The independent reader for REQ-FMT-005 (pyembroidery, pinned by hash)
        uses: ./.github/actions/oracle
      - name: Ink/Stitch's fonts for REQ-FONT-008 (pinned by SHA-256)
        uses: ./.github/actions/fonts
      - name: Vale for `cargo xtask prose`, built from its tagged source (Go's checksum database checks it)
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/vale-cli/vale/v3/cmd/vale@v3.23.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: cargo xtask ci
      - name: Keep new previews and conformance diffs when something differs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differences-gates
          path: |
            target/tmp/*.png
            target/conformance/diffs/
            target/shots/
          if-no-files-found: ignore

  coverage:
    # The ratchet: no crate's line coverage below its floor in conformance/coverage.toml. The table goes
    # to the job summary.
    name: coverage (no crate below its floor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned toolchain with the LLVM tools
        run: |
          rustup toolchain install --profile minimal
          rustup component add llvm-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/tools
        with:
          tools: cargo-llvm-cov
      - run: .github/scripts/annotated.sh "coverage" cargo xtask coverage

  perf:
    # The performance budget: one plan of the reference hoop's whole field, and 300 insets of a region 150 mm
    # across, take no more instructions than conformance/perf.toml records, counted by valgrind's callgrind;
    # their times go to the job summary. The job keeps its name, a check main's ruleset requires.
    name: perf (the hoop's whole field within its record)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Valgrind, whose callgrind counts the instructions
        run: sudo apt-get update && sudo apt-get install --yes valgrind
      - run: .github/scripts/annotated.sh "perf" cargo xtask perf
      - name: The release build plans as the tests' build does (docs/src/design/guardrails.md)
        run: .github/scripts/annotated.sh "release build" cargo test --release --locked -p stitchcraft-engine --test release
      - name: The traced dogs' cases, too slow for the tests' debug build (docs/src/design/conformance.md)
        run: .github/scripts/annotated.sh "traced dogs" cargo test --release --locked -p stitchcraft-engine --test auto_photos

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      - name: Keep new previews when one differs from its golden file
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: differences-${{ matrix.os }}
          path: target/tmp/*.png
          if-no-files-found: ignore

  msrv:
    name: msrv (Rust 1.95, same floor as VectorCraft)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo +1.95.0 check --workspace --locked
