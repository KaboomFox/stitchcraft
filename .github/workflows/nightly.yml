# Nightly checks that are too slow or too noisy for every pull request: the newest Rust, property tests
# with fresh seeds, an hour of coverage-guided fuzzing, external links. Mutation testing, coverage and the
# Ink/Stitch differential run are added with their roadmap steps (M2.8, M8).
name: nightly

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  newest-rust:
    name: gates on the newest stable Rust (catches new lints early)
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown --toolchain stable
      - uses: ./.github/actions/tools
        with:
          tools: cargo-deny,typos,mdbook
      - name: The independent reader for REQ-FMT-005 (pyembroidery, pinned by hash)
        uses: ./.github/actions/oracle
      # The API snapshots are the pinned toolchain's rustdoc output, and the prose lint is Vale's, so neither
      # says anything about the newest compiler (xtask/src/ci.rs).
      - run: cargo xtask ci --skip api,prose

  fresh-seeds:
    name: property tests with fresh seeds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Round trips through every format, 20,000 random plans
        # PR runs use a fixed seed (stitchcraft-testkit::strategies); here every night explores new plans.
        # A failure prints the seed and the shrunk plan: add it as a regression case.
        run: |
          seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
          echo "PROPTEST_RNG_SEED=$seed"
          PROPTEST_RNG_SEED=$seed PROPTEST_CASES=10000 cargo test --locked -p stitchcraft-formats --test round_trip
      - name: Previews match PES read-backs, and fuzz bodies survive random bytes, with fresh seeds
        run: |
          seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
          echo "PROPTEST_RNG_SEED=$seed"
          PROPTEST_RNG_SEED=$seed PROPTEST_CASES=5000 cargo test --locked -p stitchcraft-render --test preview
          PROPTEST_RNG_SEED=$seed PROPTEST_CASES=20000 cargo test --locked -p stitchcraft-testkit fuzz

  fuzz:
    # REQ-FMT-006 and REQ-SVG-002: coverage-guided fuzzing every night, 20 minutes per target. The bodies
    # are in stitchcraft-testkit::fuzz; each corpus starts from its seeds (the golden machine files, or the
    # SVG fixtures) and grows from night to night in the Actions cache. A crash fails the job, puts the end of the output in an annotation and
    # keeps the input as an artifact: reproduce it with `cargo +nightly fuzz run <target> <file>`, then
    # add it as a regression test.
    name: fuzz ${{ matrix.target }} (20 minutes)
    runs-on: ubuntu-24.04
    env:
      # Every cargo and rustc that cargo-fuzz starts must be nightly, whatever rust-toolchain.toml says.
      RUSTUP_TOOLCHAIN: nightly
      # cargo-fuzz builds for the target it was itself built for unless told otherwise, and the installed
      # binary is a static musl build: name the runner's own target.
      TARGET: x86_64-unknown-linux-gnu
    strategy:
      fail-fast: false
      matrix:
        # The machine-file readers start from the golden files; the SVG reader from the SVG fixtures, with
        # a dictionary of SVG's keywords so that mutations stay near valid SVG.
        include:
          - { target: read_pes, seeds: "conformance/golden/formats/* conformance/golden/testsheets/*", options: "" }
          - { target: read_dst, seeds: "conformance/golden/formats/* conformance/golden/testsheets/*", options: "" }
          - { target: read_write_preview, seeds: "conformance/golden/formats/* conformance/golden/testsheets/*", options: "" }
          - { target: read_svg, seeds: "conformance/fixtures/svg/*", options: "-dict=fuzz/svg.dict" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: ./.github/actions/tools
        with:
          tools: cargo-fuzz
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed it
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cp ${{ matrix.seeds }} "fuzz/corpus/${{ matrix.target }}/"
      - name: Fuzz for 20 minutes (10 s and 2 GB at most per input)
        run: >
          .github/scripts/annotated.sh "fuzz ${{ matrix.target }}"
          cargo fuzz run --target "$TARGET" ${{ matrix.target }} --
          -max_total_time=1200 -timeout=10 -rss_limit_mb=2048 -max_len=65536 -print_final_stats=1 ${{ matrix.options }}
      - name: Keep the smallest corpus that covers the same code
        if: success()
        run: .github/scripts/annotated.sh "fuzz cmin ${{ matrix.target }}" cargo fuzz cmin --target "$TARGET" ${{ matrix.target }}
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Keep the input that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  external-links:
    name: external links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/tools
        with:
          tools: lychee
      - run: lychee --no-progress --max-concurrency 4 --accept 200,429 './*.md' 'docs/src/**/*.md' 'crates/*/README.md' 'apps/*/README.md'
