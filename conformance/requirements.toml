# StitchCraft conformance requirements.
#
# Each requirement is a testable statement with a stable id (never reused). `cargo xtask conformance
# --check` enforces: unique ids; `active` requirements have at least one passing case; ids mentioned in
# the docs exist here. See docs/src/design/conformance.md.
#
# status: planned | active | retired      level: L0 invariants · L1 formats · L2 generators ·
#                                                L3 Ink/Stitch differential · L4 physical

# ── Plan invariants (L0) ───────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-PLAN-001"
area = "plan"
level = "L0"
statement = "All stitch coordinates are finite and inside the profile's hoop."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-002"
area = "plan"
level = "L0"
statement = "While sewing (the previous movement was a Normal stitch, with no trim since), every stitch is no longer than the profile maximum and no shorter than the profile minimum, except lock stitches — into or out of a lock point — which are at least 0.2 mm."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-003"
area = "plan"
level = "L0"
statement = "Every colour block sews at least one stitch, and trims and stops happen where the needle is. Colour changes and the end are implied by the block structure; encoders write exactly one colour change between blocks and exactly one end."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-004"
area = "plan"
level = "L0"
statement = "A Trim is preceded by a tie-off and followed by a tie-in before the next Normal stitch when lock settings request them."
rationale = "Retired: whether a tie-off and a tie-in belong round a trim depends on the elements' lock settings, which a plan does not carry, so the plan checker cannot check it. Assembly's cases check it with the settings: REQ-ASM-003 and REQ-LCK-001."
milestone = "M3"
status = "retired"

[[req]]
id = "REQ-PLAN-005"
area = "plan"
level = "L0"
statement = "While sewing (the previous movement was a Normal stitch, with no trim since), no stitch lands where the needle already is."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-006"
area = "plan"
level = "L0"
statement = "The number of colour changes does not exceed the target format's maximum."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PLAN-007"
area = "plan"
level = "L0"
statement = "Every Normal and Jump entry names the element it came from, one the plan lists. A trim or a stop may name none."
milestone = "M3"
status = "active"

# ── Machine profiles ───────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-PRF-001"
area = "profile"
level = "L2"
statement = "Built-in profiles validate (positive hoop, comfort zone inside hoop, min stitch < max stitch) and are listed by `stitch profiles`."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-PRF-002"
area = "profile"
level = "L2"
statement = "A design larger than the hoop is an error (SC-E0701); larger than the comfort zone, a warning (SC-W0702) with a rotate-to-fit hint when rotating 90 degrees would fit."
rationale = "A design that does not fit the hoop must be caught before sewing, not at the machine."
milestone = "M1"
status = "active"

# ── Formats (L1) ───────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-FMT-001"
area = "formats"
level = "L1"
statement = "Canonical plans encode to the committed golden files byte for byte, for every writer."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-FMT-002"
area = "formats"
level = "L1"
statement = "For every writer/reader pair, decode(encode(plan)) makes the machine do what the plan does: the needle goes down at the same positions (absolute positions quantized to 0.1 mm, round half to even), and the thread is cut and the machine pauses at the same places (stitchcraft-testkit::equivalence), on random plans with fixed seeds per PR and fresh seeds nightly. A DST file cuts the thread wherever DST machines do (REQ-FMT-008), and a PES file asks for a cut before every jump (REQ-FMT-010): both can be more places than the plan's trims."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-FMT-003"
area = "formats"
level = "L1"
statement = "Every command kind (jump, trim, stop, colour change, end) survives every writer/reader pair: read back, the file sews, cuts and pauses where the plan does, and cuts where its format adds cuts (REQ-FMT-008 for DST, REQ-FMT-010 for PES)."
rationale = "Machines that ignore trims or miss stops are a common complaint about embroidery files."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-FMT-004"
area = "formats"
level = "L1"
statement = "Readers decode a valid file without stitches to an empty plan, and report empty or truncated files as a typed error (SC-E0603), never a crash; writers refuse to write an empty plan (SC-E0010)."
rationale = "Empty and damaged files are ordinary input, not a reason to crash."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-FMT-005"
area = "formats"
level = "L1"
statement = "A pinned pyembroidery reads every golden machine file to the same needle-downs, cuts and pauses as StitchCraft's own reader (compared from the first needle-down, since readers differ in where a design starts)."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-FMT-006"
area = "formats"
level = "L1"
statement = "Fuzzed readers never panic, never allocate beyond their caps, and always terminate."
rationale = "Every reader parses bytes from the internet; fuzzing runs nightly, its bodies on every PR (conformance.md, Fuzzing)."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-FMT-007"
area = "formats"
level = "L1"
statement = "Moves longer than a format's per-record limit are split into several records within the limit."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-FMT-008"
area = "formats"
level = "L1"
statement = "DST files are read as DST machines sew them: three or more jump records in a row cut the thread before them where something was sewn since it was last cut or changed, and nothing else is a cut; writing a DST file reports (SC-I0605) every place where its machines will cut the thread and the plan does not."
rationale = "DST has no trim command. Machines count jump records in a row — a machine setting (1 to 8 on Brother's PR machines), commonly 3, which is also pyembroidery's default — so a jump longer than two records (24.2 mm) is a trim too (formats.md, DST)."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-FMT-009"
area = "formats"
level = "L2"
statement = "The PEC reader reads stitch data with or without the 4-byte origin field: the 4 bytes are the field when they are shaped like one (a long-form jump on both axes) and the design read after them fits the box the header's width and height give from the corner the field puts it at; otherwise they are the first record, and a warning says that Brother machines expect the field."
rationale = "pyembroidery 1.4.32 to 1.5.1, used by Ink/Stitch before pystitch, wrote PEC without the field; reading every file as if it had one lost their first record or failed."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-FMT-010"
area = "formats"
level = "L1"
statement = "PES files flag every jump after the stitch data's first record as a trim (`0x20`), as pystitch writes them, so the first record is the only one that can carry the plain jump flag (`0x10`). A jump that goes nowhere has no record unless a trim rides on it. Whether a trim-flagged jump is cut is the machine's choice."
rationale = "Ink/Stitch's PES files, written by pystitch, never have a plain jump after their first move, so with the same flags a machine treats StitchCraft's files as it treats Ink/Stitch's (formats.md, PES and PEC). At MC-1 the reference PE800 cut no jump of either flag and sewed test sheet TS-02 the same with both."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-FMT-011"
area = "formats"
level = "L1"
statement = "PES files record the start as seen from the design's top-left corner in 12 bits, −204.8 to 204.7 mm on each axis. A design whose corner lies farther from the start is refused (SC-E0602), not written with the field wrapped round."
rationale = "A wrapped field puts the design elsewhere for every reader, StitchCraft's own included. Large frames sew DST designs that far from their start, and `stitch convert` reads them."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-FMT-012"
area = "formats"
level = "L1"
statement = "PEC thumbnails draw stitches only inside their frames: no thread is drawn before the needle first goes down. So the first byte after the stitch data's end mark, the start of the first picture's blank top row, is 0x00."
rationale = "pyembroidery's and pystitch's readers, Ink/Stitch's importer among them, end the stitch data only at `FF 00`, and read on into the pictures otherwise."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-THREAD-001"
area = "threads"
level = "L1"
statement = "Palette tables match their published source at spot-checked entries; nearest-colour matching is deterministic (CIEDE2000 via libm)."
rationale = "Thread colours that change between the screen and the machine confuse users."
milestone = "M1"
status = "active"

[[req]]
id = "REQ-THREAD-002"
area = "threads"
level = "L1"
statement = "A format that names threads by palette entries writes a thread that is an entry, by colour and name as a file read with the palette gives it, as that entry, machine-special entries included. It gives the other threads the entries matching may pick: different threads different entries while they last, the nearest pairs first by CIEDE2000, and equal threads one entry. Once the entries run out, each thread left shares its nearest, and the writer says how many (SC-W0606). Reports name each thread by the entry the file has."
rationale = "A machine knows threads only by their entries. 2 threads written as one are one thread to it: it shows the same colour for both, and a change between them reads as a stop. Ink/Stitch's PES files, written by pystitch, give different threads different entries."
milestone = "M3"
status = "active"

# ── Rendering ──────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-RND-001"
area = "render"
level = "L2"
statement = "Previews render the plan after quantization, so what is shown is what sews."
rationale = "A preview drawn before rounding shows stitches that move once the file is saved."
milestone = "M2"
status = "active"

[[req]]
id = "REQ-RND-002"
area = "render"
level = "L2"
statement = "The same plan and settings give the same preview PNG, byte for byte, on every platform."
rationale = "Documentation images are compared byte for byte on every pull request (docs-pipeline.md)."
milestone = "M2"
status = "active"

# ── Parameters ─────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-PRM-001"
area = "params"
level = "L2"
statement = "Every registered parameter has a label, help text, kind, default, range or options, group and applicability."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-PRM-002"
area = "params"
level = "L2"
statement = "Invalid parameter values produce SC-E0101 or SC-W0102 with the key, the value and the accepted range; they never fall back silently to defaults. A value is stripped of the white space round it, as in Ink/Stitch, text included, and empty or blank text is not set, and the parameter takes its default. Spaces separate the values of a list or a pair, and text with a comma does not read, and gets a hint, but for one comma at the end of an angle of a list. A unit follows its number with no space. A toggle reads Ink/Stitch's words for on, their opposites and off, and nothing else. A length below 0 that leaves an optional length unset is named (SC-W0102), and a value longer than 4,096 bytes does not read, its message quoting its start."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-PRM-004"
area = "params"
level = "L2"
statement = "An element reads only the parameters its stitch type uses. A parameter that does not apply to its stitch type, or that a settings window shows only while another parameter has other values, takes its default, and its text is kept and not checked."
rationale = "Ink/Stitch reads a setting only where its stitch type uses it, and a path keeps a satin's settings when its stroke goes back to running stitch: it must still be sewn, and nothing need be said of settings it does not use."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-PRM-003"
area = "params"
level = "L2"
statement = "Parameters round-trip unchanged through every adapter (SVG attributes, VectorCraft effect records)."
rationale = "Settings that change or vanish after saving lose the user's work."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-PRM-005"
area = "params"
level = "L2"
statement = "A key may be declared once for each family of stitch types, strokes, satin columns and fills, each declaration with its own kind, range and default. An element reads the key as its family's declaration says. A key declared twice for one family is a fault in the registry. The reference pages, the JSON Schema, the plug-ins' settings and the compatibility contract give each family its own declaration."
rationale = "Ink/Stitch declares some attributes once for each kind of element, each with its own type: zigzag_spacing_mm is a list of lengths for a zigzag stroke and one length for a satin column, and a meander fill reads it as a length that is 0 by default. A file sews the same in both only if each element reads the attribute as Ink/Stitch's declaration for it does."
milestone = "M7"
status = "active"

# ── SVG adapter ────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-SVG-001"
area = "svg"
level = "L2"
statement = "Paths, basic shapes, groups, transforms, viewBox units, colours and visibility map to the Design exactly (positions within 1 micrometre), each shape's fill before its stroke, as Ink/Stitch sews them. Arcs are cut into cubic curves as inkex, which Ink/Stitch reads files with, cuts them: in equal pieces, one more than the whole quarter turns an arc makes. Circles and ellipses start at their top and turn left on screen, as inkex draws them."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-SVG-002"
area = "svg"
level = "L2"
statement = "Any SVG path data, including degenerate arcs, is handled per the SVG specification without failing the adapter; fuzzed."
rationale = "Degenerate arcs are valid SVG; dividing by their zero radius must not fail the import."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-SVG-003"
area = "svg"
level = "L2"
statement = "Ink/Stitch's own objects are not stitched: command symbols and the connectors that tie them to objects, lines drawn with Inkscape's connector tool, and paths that Ink/Stitch's guide-line, anchor-line or pattern start marker makes helpers. Its trim and stop commands set the shape's trim_after and stop_after, and a command that is not applied is noted."
rationale = "Read as plain SVG, every command would add a stray line and a colour change to the sew-out, and every guide line would be stitched."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-SVG-004"
area = "svg"
level = "L2"
statement = "The width of a stroke is its inherited stroke-width, 1 user unit when none is set, scaled by the average of how much the shape's transform stretches the x and y axes, in millimetres. The join is round or bevel when stroke-linejoin says so. When it says miter, the miter limit is stroke-miterlimit, 4 when none is set. Any other join, or none, is a miter limited at 5. SC-W0804 names each value that does not read, and the value is ignored, as a viewer ignores it."
rationale = "A satin column drawn as one path takes its width and corners from its stroke. Ink/Stitch reads them this way, and a file then sews alike in both. DEV-SVG-001 lists the differences."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SVG-005"
area = "svg"
level = "L2"
statement = "Ink/Stitch's design settings collapse_len_mm, min_stitch_len_mm and min_satin_stroke_width_mm, kept in the first metadata element of the file, are the design's settings. The first element of each name counts. SC-W0802 names a value that is not a number of 0 or more, and the design keeps its default."
rationale = "A file that changes them sews as Ink/Stitch sews it, and a setting that is not applied is never silent."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SVG-006"
area = "svg"
level = "L2"
statement = "The rules of a file's style sheets set the properties of the elements they select, as in a viewer: rules whose selectors are an element name or *, classes and ids, and lists of them, in the order CSS's cascade gives them. An !important declaration wins, then the style attribute, then the more specific rule, then the later, and every rule wins over a presentation attribute. SC-W0802 names the selectors and at-rules that are not read."
rationale = "Illustrator and CorelDRAW write a drawing's colours as classes in a style sheet. Read without it, a file would sew black fills where the drawing shows outlines, and sew what the sheet hides."
milestone = "M3"
status = "active"

# ── Generators: shared ─────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-GEN-001"
area = "generators"
level = "L2"
statement = "Every generator honours start and end hints: the first and last stitch lie within 0.1 mm of the shape point nearest each hint."
rationale = "Where stitching starts and ends decides the jumps and trims between elements."
milestone = "M8"
status = "planned"

[[req]]
id = "REQ-GEN-002"
area = "generators"
level = "L2"
statement = "An element that cannot be sewn — a stitch type StitchCraft does not sew yet (SC-W0011), parameters it cannot read (SC-E0101), or its work budget spent (SC-E0004) — is skipped with its diagnostic, and the rest of the design still plans; with nothing left to sew, planning stops with SC-E0010."
rationale = "One bad element must not cost the user the whole design."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-GEN-003"
area = "generators"
level = "L2"
statement = "Elements are generated in sewing order. Each is given the last needle point of the elements before it that sew any, whatever their thread, and what the next element offers to end near: its first point, a satin column's rails when it starts at its own nearest point, or a tatami fill's area. The offer depends on the next element's shape and settings only. An element ends near its next stitch, as Ink/Stitch's geometry library finds it: the first of the next element's points, then of its own, that lies in the other's area, each tested against every part, and otherwise its point nearest the offer. Polylines are tested by their starts, and an area by its parts' outline starts."
rationale = "Ink/Stitch starts and ends elements by their neighbours, so a file sews alike in both only when the engine sees them too (ADR 0014)."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-GEN-004"
area = "generators"
level = "L2"
statement = "A generator spends a stitch of the design's limit for each needle point as it makes it, and for each one a later pass or bean stitch sews again. What it lays out before sewing it, such as a satin column's pairs or a fill's row segments, must fit in the stitches left. Once done, it has spent exactly a stitch for each needle point it gives. Each element is given the stitches the elements before it left, and the first that needs more ends planning there, with SC-E0004 naming it, before more is made."
rationale = "Work bounds time, not memory, and a few settings multiply needle points: 10 mm of zigzag at the smallest spacing with 100 repeats and bean stitch 10 is 4.2 million, and a metre of it 420 million, gigabytes. The stitch limit must stop them before they are made, not refuse them after."
milestone = "M7"
status = "active"

# ── Running stitch family ──────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-RUN-001"
area = "strokes/running"
level = "L2"
statement = "Stitches are spread evenly between corners, in more of them where they stray by more than nine tenths of running_stitch_tolerance_mm from the points of the path flattened within the other tenth, as long as that takes no more stitches than splitting the stray ones. Every stitch, measured straight, is at most the longest running_stitch_length_mm (raised to twice the shortest stitch) times (1 + jitter) and at least the shortest stitch; a part of the path too small for that (shorter than the shortest stitch, or all within it of its ends) is not stitched and is reported (SC-W0401)."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-002"
area = "strokes/running"
level = "L2"
statement = "The stitches deviate from the source path by at most running_stitch_tolerance_mm, both ways (every point of the path is that close to a stitch, and every stitch that close to the path), except where that would take a stitch outside the lengths of REQ-RUN-001."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-003"
area = "strokes/running"
level = "L2"
statement = "Corners (where the path turns by more than 30 degrees from one segment to the next) are needle penetrations, except where a penetration there would make a stitch shorter than the shortest stitch."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-004"
area = "strokes/running"
level = "L2"
statement = "Bean stitch sews each stitch from A to B as A to B, then b times back to A and on to B (2b + 1 times over it). b comes from bean_stitch_repeats, a list taken in turn along the stitches and running on across repeats, each turnaround taking one step; so a run of n stitches with b throughout has exactly n x (2b + 1) stitches."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-005"
area = "strokes/running"
level = "L2"
statement = "Repeats sew a run k times, alternating direction, each pass starting where the last one ended (no stitch in place): an odd count ends at the far end, an even count at the start."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-007"
area = "strokes/running"
level = "L2"
statement = "With random stitch length, the stitches between corners differ in length; the same element and seed give the same stitches on every platform, and another seed gives other stitches. A random_seed replaces the element's id as the seed, as in Ink/Stitch: elements given one seed draw the same lengths, and 0 is a seed like any other. Each span between corners draws from its own stream, keyed by its subpath's place in the path and its own place in the subpath: a change to one span leaves the lengths of the others as they were, and subpaths drawn alike draw different lengths."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-006"
area = "strokes/manual"
level = "L2"
statement = "Manual stitch puts a needle point on every node of the path, in order (a curve gives only its end node, and a node where the needle already is sews no stitch), plus only the documented splits: a stitch longer than max_stitch_length_mm, when it is above 0, is split into the fewest equal parts no longer than it, none shorter than the shortest stitch, and SC-W0404 names the stitches that stay longer for that. A bean stitch list takes a step for every node Ink/Stitch lists, as Ink/Stitch's does: a node drawn twice, a node left out for the shortest stitch, and a split stitch's end, twice."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-008"
area = "strokes/manual"
level = "L2"
statement = "No hand-placed stitch is shorter than the shortest stitch: a node closer than that to the needle point before it is left out (a part's last node is kept, the one before it left out instead), and SC-W0403 reports it."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-RUN-009"
area = "strokes/zigzag"
level = "L2"
statement = "A zigzag stroke sews each part of its path, one per subpath, as n + 1 needle points spread at equal distances along the part, its ends included, before repeats. The part is flattened within a tenth of a CSS pixel, and n is its length divided by half the first zigzag_spacing_mm, rounded half to even, at least 2, and one more if odd."
rationale = "Ink/Stitch's zig-zag stitch, read at d59c9ab: a file sews the same zigzag in both."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-RUN-010"
area = "strokes/zigzag"
level = "L2"
statement = "Each needle point of a zigzag stroke moves square to its direction, turned by zigzag_angle, positive clockwise as the drawing shows it. The ends' directions are the lines to and from their neighbours. Every other point's direction lies halfway between the line from the point before and the line to the point after, each taken with length 1. Points 0, 2, 4 and on move right of the path's way by half the stroke's width plus the second stroke_pull_compensation_mm, and points 1, 3, 5 and on left by half the width plus the first. A point whose direction has no length stays where it is."
rationale = "Ink/Stitch's zig-zag stitch, read at d59c9ab: a file sews the same zigzag in both."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-RUN-011"
area = "strokes/zigzag"
level = "L2"
statement = "A zigzag stroke whose only subpath that moves has its ends nearer each other than 0.05 CSS pixels ends on its first needle point. A subpath of one point does not count."
rationale = "Ink/Stitch's zig-zag stitch, read at d59c9ab: a file sews the same zigzag in both."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-RUN-012"
area = "strokes/zigzag"
level = "L2"
statement = "A zigzag stroke's repeats sew it again, every other pass backwards, and each pass after the first starts with the needle point after the one the last pass ended at. Bean stitch then sews each stitch 2b + 1 times, b taken from its list one step per needle point of the passes, and a turn takes no step."
rationale = "Ink/Stitch's zig-zag stitch, read at d59c9ab: a file sews the same zigzag in both."
milestone = "M7"
status = "active"

# ── Lock stitches and assembly ─────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-LCK-001"
area = "plan/locks"
level = "L2"
statement = "Lock stitches appear where `ties` says (both, before, after, neither) and only there: a tie-in where the needle jumps to a group, a tie-off where a jump, trim, stop, thread change or the end follows one, none between groups sewn on from one to the next. `force_lock_stitches` adds the tie-off; manual stitch has none unless forced."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-LCK-002"
area = "plan/locks"
level = "L2"
statement = "Every lock id is accepted and sews a lock that joins the stitching where it starts or ends, with no stitch shorter than 0.2 mm; drawn locks scale with `lock_*_scale_percent`, locks made of steps with `lock_*_scale_mm`, and the half stitch with the first stitch."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-LCK-004"
area = "plan/locks"
level = "L2"
statement = "A custom lock written as numbers sews them as steps along the stitching, round its corners, in sizes of `lock_*_scale_mm`, positive into the stitching: a tie-in's steps end where the stitching starts and a tie-off's begin where it ends, as Ink/Stitch reads them."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-LCK-003"
area = "plan/locks"
level = "L4"
statement = "Default locks hold when the tail is pulled (machine test TS-04)."
milestone = "M3"
status = "planned"

[[req]]
id = "REQ-ASM-001"
area = "plan/assembly"
level = "L2"
statement = "Elements are stitched in document order; a change of thread colour starts a new colour block, and threads are compared by colour alone, as in Ink/Stitch."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-ASM-002"
area = "plan/assembly"
level = "L2"
statement = "Between groups of the same thread, a move no longer than the earlier element's `min_jump_stitch_length_mm`, or the design's collapse length when it sets none, is sewn on without locks; a longer one, or any after an element that forces locks, ties off, jumps and ties in."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-ASM-003"
area = "plan/assembly"
level = "L2"
statement = "`trim_after` and `stop_after` put a trim or a stop after the element's last group, its tie-off before and the next group's tie-in after, as their `ties` allow."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-ASM-004"
area = "plan/assembly"
level = "L2"
statement = "Ignored elements are dropped and listed in the report."
rationale = "Ink/Stitch's ignore commands and its ignore_object setting keep templates and placement lines in a drawing but out of the sew-out; the SVG adapter leaves them out and lists each (SC-I0805)."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-ASM-005"
area = "plan/assembly"
level = "L2"
statement = "The design's origin, or without one the centre of the box around the finished plan's stitches, as Ink/Stitch centres them, becomes the hoop's centre; a stop position adds a jump to it before each stop."
milestone = "M3"
status = "active"

# ── Finalize and check ─────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-FIN-001"
area = "plan/finalize"
level = "L2"
statement = "Finalizing fits every stitch to the machine: one longer than its longest is split into the fewest equal parts no longer than it (SC-I0703), and a needle point less than its element's shortest stitch (the one its generator used) from the one before is left out (SC-I0504). The ends of each run of stitches and lock points stay, and the points before them go instead; but a run's last point or a lock point still too near one that stays before it goes itself, and a trim or stop after it happens where the needle is. A run's first point always stays."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-FIN-002"
area = "plan/finalize"
level = "L2"
statement = "A design the machine cannot take — larger than the hoop, reaching past its edge from the origin, or with its stop position past the edge (SC-E0701), or with more colour changes and stops than its format records (SC-E0601) — gives no plan; one larger than the comfort zone is planned, with SC-W0702."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-FIN-003"
area = "plan/finalize"
level = "L2"
statement = "Every plan the engine returns passes the plan invariants for its machine profile; one that would not is a StitchCraft bug, reported as SC-E0009 instead of returned."
milestone = "M3"
status = "active"

# ── Satin ──────────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-SAT-001"
area = "satin"
level = "L2"
statement = "Pull compensation moves both ends of every top stitch outward along the stitch, each by pull_compensation_mm plus pull_compensation_percent of the stitch's width (within 0.01 mm). Negative values move them inward, and ends that would cross meet instead, where their moves divide the stitch."
rationale = "Thread pulls the fabric in across a satin column, so a column sews narrower than drawn. Ink/Stitch compensates this way, so a file sews the same in both."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-002"
area = "satin"
level = "L2"
statement = "A satin column's needle points pair across it, one on each rail at the same fraction of their section, and consecutive pairs are the zigzag spacing apart, measured across the previous pair at its farther end, exactly so between straight parallel rails and within 5 percent on curves. The last pair is at most one spacing on."
rationale = "Ink/Stitch places satin stitches this way, so a file sews the same in both, and an even spacing is what makes a satin column look smooth."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-003"
area = "satin"
level = "L2"
statement = "Where max_stitch_length_mm is set, a top stitch longer than it is split as split_method says, as Ink/Stitch splits it. The default method splits it into the fewest equal parts no longer than it, each split moved by up to random_split_jitter_percent of a part, and the stitch back after it into as many parts as the stitch across before. With random_split_phase the splits start at a random share of the length and follow at the length. Simple splits at whole multiples of the length from the stitch's start, and staggered from a start that moves along by a split_staggers-th of it from one stitch to the next. Splits lie strictly between the stitch's insets."
rationale = "Long satin stitches snag and lie loose. Splitting them as Ink/Stitch does sews a file the same in both."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-004"
area = "satin"
level = "L2"
statement = "A satin column's underlays are sewn before its top stitches, in one run with them, as Ink/Stitch sews them. The centre walk comes first, then the contour and the zigzag, each one that is on. From where one ends to where the next starts, the needle goes straight, in equal stitches no longer than running_stitch_length_mm (raised to twice the shortest stitch, with SC-W0402). Where a part starts within the shortest stitch of the needle, the needle points before it that only route the needle are left out, and an underlay's last needle point, or the column's start, moves to the part's first. A top stitch's point stays, and the part's points within the shortest stitch of it are left out instead. No stitch is shorter than the shortest stitch, and no top stitch moves. A centre walk with an odd number of repeats ends at the column's end, and the contour, the zigzag and the top stitches then go from the end to the start. Underlays change no top stitch."
rationale = "Underlay holds the fabric still and lifts the top stitches off it. Sewn in Ink/Stitch's order and directions, a file sews the same in both programs."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-005"
area = "satin"
level = "L2"
statement = "A satin column's rails and rungs are told apart as Ink/Stitch tells them, whatever order they are drawn in: by which subpaths meet, else the two longest (SC-W0202). A path with no subpath longer than a point produces SC-E0201 and no stitches. A rung that misses a rail joins the rail's nearest point (SC-W0203), of points as near the one shapely's nearest points give. A column whose rungs or push compensation leave no section with length on both rails produces SC-E0216 and no stitches."
rationale = "A file must sew the same in both programs, and odd satin geometry, such as a rung that misses a rail or a stray node, must be a diagnostic, never a crash."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-006"
area = "satin"
level = "L2"
statement = "A parameter given 2 values, one for each side, changes only its own side: the first or the second rail's stitch ends, or the column's start or end."
rationale = "Fabric pulls more one way than the other, and a column can sit against another element on one side only."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-007"
area = "satin"
level = "L2"
statement = "Random satin widths and spacing are reproducible: the same element and seed sew the same stitches and another seed others, and each width and step stays within the range its parameters give."
rationale = "The same design must give the same file every time (docs/src/design/determinism.md)."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-008"
area = "satin"
level = "L2"
statement = "Push compensation shortens a satin column's rails by push_compensation_mm at its start and its end before they are cut into sections, or lengthens them along their end segments where negative. A rail it would leave shorter than half a CSS pixel keeps its length, with SC-W0211."
rationale = "Satin stitches push the fabric out at a column's ends, so a column sews longer than drawn. Ink/Stitch compensates this way, so a file sews the same in both."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-009"
area = "satin"
level = "L2"
statement = "On each rail, a top stitch end closer than short_stitch_distance_mm to the last end left in place there moves in along its stitch by the next of the short_stitch_inset percentages of the stitch's width, taking turns with them. Any other end stays, and the next ends are measured from it."
rationale = "On the inside of a tight curve, needle points crowd together and the thread piles up there. Ink/Stitch insets them this way, by default, so a file sews the same in both."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-010"
area = "satin"
level = "L2"
statement = "A centre walk underlay runs along the line center_walk_underlay_position percent of the way from the first rail to the second, as a running stitch of center_walk_underlay_stitch_length_mm that keeps within center_walk_underlay_stitch_tolerance_mm of the line. It is sewn center_walk_underlay_repeats times, there and back."
rationale = "A centre walk anchors the middle of a column. Ink/Stitch walks it along the same line, so a file sews the same in both."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-011"
area = "satin"
level = "L2"
statement = "A contour underlay runs along each rail, inset by contour_underlay_inset_mm plus contour_underlay_inset_percent of the column's width on that rail's side, as a running stitch of contour_underlay_stitch_length_mm within contour_underlay_stitch_tolerance_mm. Each side stops short of the column's start by the first rail's inset in millimetres, and of its end by the second's. The first rail's side is sewn towards the column's end, and the second's back. A side too short to stop short of both keeps its length, with SC-W0206."
rationale = "A contour holds the column's edges still under the top stitches, inside them, where it does not show. Ink/Stitch sews it this way, so a file sews the same in both."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-012"
area = "satin"
level = "L2"
statement = "A zigzag underlay places pairs of points across the column every half zigzag_underlay_spacing_mm, each end inset by zigzag_underlay_inset_mm and zigzag_underlay_inset_percent, which are half the contour's insets when empty. It zigzags to the column's end through one end of each pair, on either rail in turn, and back through the other ends. A stitch longer than zigzag_underlay_max_stitch_length_mm is split into equal parts no longer than it."
rationale = "A sparse zigzag lifts the top stitches and makes a wide column look fuller. Ink/Stitch sews it this way, so a file sews the same in both."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-013"
area = "satin"
level = "L2"
statement = "With start_at_nearest_point and a needle point before it, a satin column starts at the point of the line running_stitch_position percent of the way between its rails nearest the needle, or at its compensated outline's nearest point when the line is farther than the jump length and the outline is not. From there it follows the line to its first stitch, and is sewn as before."
rationale = "Starting where the needle is saves a jump and a trim, and the way to the first stitch is hidden under the column. Ink/Stitch starts a column this way by default, so a file sews alike in both."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-014"
area = "satin"
level = "L2"
statement = "With end_at_nearest_point and an element after it, a satin column ends at its compensated outline's point nearest the next stitch (REQ-GEN-003), unless that is within 5 CSS pixels of the line's end. Every part is cut where the end's cut crosses it, and a stitch along the cut where sides along one line meet: widened by pull compensation, at the cut's first rail point, and narrowed, at its own start. A part with a needle point of its own within the element's shortest stitch of that place, as finalize measures it, is cut at that needle point. The column sews the first halves, follows the line to its end, sews the second halves and stitches the end last. After an odd centre walk the passes run from the column's end and from its start."
rationale = "Ending near the next element saves a jump and a trim. Ink/Stitch ends a column this way by default, so a file sews alike in both."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-015"
area = "satin"
level = "L2"
statement = "A satin column drawn as one subpath whose stroke is no wider than the design's min_satin_stroke_width_mm (1 mm unless the design sets it) is sewn as a stroke, by its stroke settings, and SC-W0212 says so. It offers the element before it its first point, as a stroke does."
rationale = "Ink/Stitch sews a satin too narrow to stitch across as a running stitch, and a file then sews alike in both."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-016"
area = "satin"
level = "L2"
statement = "A satin column drawn as one subpath and wider than the design's narrowest satin stroke is sewn between 2 rails. Each rail is its centre line offset by half the stroke's width, one to each side, with the stroke's join. The offsets are shapely's offset_curve."
rationale = "Ink/Stitch makes the rails of such a column with shapely, and the same rails sew the same column."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-017"
area = "satin"
level = "L2"
statement = "Its rungs are Ink/Stitch's. They lie at the lows of the line's blurred corner scores and at its nodes, 1 mm apart or more. A rung is kept only when it crosses each rail once, and pairs those 2 points; with none kept, the rails are one section. Offsets that split into several curves, or ends within a CSS pixel of each other, get the line cut in half, up to 20 times, and a rung pairs the halves' rails where they meet. Parts whose offsets still split, or whose offset vanishes to one side, are left out, and SC-W0213 counts them. A line whose own subpath is closed (Z) first starts at the first segment whose rung crosses the stroke's edge twice. SC-E0214 says when no rails can be made. The rails made stay the rails (DEV-SAT-007)."
rationale = "The rungs set the angle of every stitch, and the start and the cuts set the order of sewing. Ink/Stitch places them this way."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-018"
area = "satin"
level = "L2"
statement = "A satin column whose needle points all lie within its element's shortest stitch of its first sews nothing, and SC-W0215 says so (DEV-SAT-008). So does a zigzag satin with no stitch across, which places a single pair, its underlays with it. The rest of the design is planned as if it were not there."
rationale = "Every stitch of such a speck is shorter than the machine sews well; sewn, it hammers one spot, and a plan of it fails the machine's limits."
milestone = "M4"
status = "active"

[[req]]
id = "REQ-SAT-019"
area = "satin"
level = "L2"
statement = "Of a satin column whose 2 rails are rings, each ending where it starts, closed with Z or drawn back to its start, the second rail starts at its node nearest the first rail's first node before the rails are turned. Without rungs, its nodes start there too, and each ring's start counts once at each end of its nodes (DEV-SAT-009). The stitches go straight across 2 rings whatever node each was drawn from, whichever way it turns and however it is closed. Rings that start together as drawn keep their starts, and a rung across them."
rationale = "A drawing program starts a ring where it chooses. VectorCraft's Make Compound Path, from 0.10.0, turns the front of 2 rings round, which starts it at what was its last node, a quarter of the way round a circle. Sewn from their own starts, such rings get stitches across the column."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-SAT-020"
area = "satin/e-stitch"
level = "L2"
statement = "An E-stitch sews each pair a satin column places, compensates and insets as a spike: from the first rail's inset point across to the second rail's, and back through the same needle holes. The stitch across splits as a top stitch across does, and by the default method into the fewest equal parts, with no count taken from a stitch before."
rationale = "Ink/Stitch's E stitch, read at d59c9ab: a file sews the same appliqué edge in both."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-SAT-021"
area = "satin/e-stitch"
level = "L2"
statement = "Between spikes, an E-stitch goes along the first rail in one stitch, from a spike's inset point to the next spike's. Where the zigzag spacing is longer than the longest stitch, that stitch splits with no randomness, as a stitch to the next pair's compensated point would: into the fewest equal parts no longer than the longest stitch by the default method, and at whole multiples of it from its start by the simple and staggered methods."
rationale = "Ink/Stitch's E stitch, read at d59c9ab, splits its spine so: the spine sews the same in both."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-SAT-022"
area = "satin"
level = "L2"
statement = "Every satin method gives one SC-W0208 for each stretch of pairs in a row whose stitches lean more than 45° from square to the column, to a tenth of a degree, at the middle of the stretch's middle pair. The pairs are those placed at the zigzag spacing with no compensation and nothing random. At each, the column runs halfway between its 2 rails, each running from the pair before's point to the pair after's. Stitches square to a rail where the other steps out, stitches at 45°, pairs shorter than the shortest stitch and pairs whose rails both stand still give none."
rationale = "Rails drawn without enough rungs pair their points by length alone, and their stitches can lean far along the column. A rung at the place named sets them straight."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-SAT-023"
area = "satin"
level = "L2"
statement = "Every satin method gives one SC-W0209 when its longest top stitch, sewn with its splits and insets, is longer than 12 mm, at the middle of that stitch. The stitches are measured as the column sews them, a stitch its end cuts in 2 as 2 stitches. A longest stitch that splits them leaves none, and the underlays and travel do not count."
rationale = "A stitch longer than 12 mm floats loose over the fabric, where it snags and sags."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-SAT-024"
area = "satin/s-stitch"
level = "L2"
statement = "An S-stitch sews each pair a satin column places, compensates and insets once, as a stitch across the column: the first pair from the second rail's inset point to the first rail's, the next from the first rail's to the second's, and on in turn. The stitch splits as a stitch from the pair's first rail to its second would, and is sewn the way its pair goes. By the default method it splits into the fewest equal parts, with no count taken from a stitch before. By the simple and staggered methods it is the column's stitch of the same number as its pair, the first numbered 0."
rationale = "Ink/Stitch's S stitch, read at 6555892: a file sews the same column of S's in both."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-SAT-025"
area = "satin/s-stitch"
level = "L2"
statement = "From one pair to the next, an S-stitch goes along the rail its stitch ended on in one stitch, from that inset point to the next pair's, and never splits it, whatever the zigzag spacing and the longest stitch."
rationale = "Ink/Stitch's S stitch, read at 6555892, works out splits for that stitch when the zigzag spacing is longer than the longest stitch, and sews none of them (lib/elements/satin_column/stitches.py, _do_s_stitch): the steps sew the same in both."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-SAT-026"
area = "satin/zigzag"
level = "L2"
statement = "A zigzag satin places a satin column's pairs at half its zigzag spacing, compensated and varied at random as a satin column's are, and takes one point of each in turn: the first rail's of the first pair, the second rail's of the next, and on. Each 2 of those points in a row make a pair, from the first rail to the second, and a point left over at the end is left out. The pairs are inset where their points crowd, each along its own stitch, and sewn as a satin column's are: across each pair from its first inset point to its second, then back to the next pair's first. The outline the column starts and ends on runs through pairs placed and compensated as a satin column's are, at the full zigzag spacing."
rationale = "Ink/Stitch's zigzag satin, read at 6555892 (lib/elements/satin_column/stitches.py, _do_zigzag): a file sews the same open zigzag between the rails in both."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-SAT-027"
area = "satin/zigzag"
level = "L2"
statement = "A zigzag satin splits its long stitches by the column's split method. By the simple and staggered methods the stitch back to its pair numbered i splits as a satin column's stitch numbered 2i would, measured from its end on the first rail, and the stitch across that pair as one numbered 2i + 1. By the default method each stitch splits into its own fewest equal parts: the stitch back takes no count from the stitch across before it, where a satin column's does."
rationale = "Ink/Stitch's zigzag satin, read at 6555892, gives its stitch back no count of parts, where a satin column's takes the count of the stitch across before it (lib/elements/satin_column/stitches.py, _do_zigzag and _do_satin): a stitch back longer or shorter than the one before it splits as its own length says in both."
milestone = "M7"
status = "active"

[[req]]
id = "REQ-SAT-028"
area = "satin/zigzag"
level = "L2"
statement = "Under a zigzag satin, each side of the contour underlay stops where the zigzag stops on its rail, before it stops short of the column's ends by the insets: the first rail's side where the zigzag's last point on the first rail meets it, and the second rail's where its first and last points on the second rail meet it, each point as inset. A cut that would leave less than half a CSS pixel of a side is not made. An odd centre walk moves none of these places (DEV-SAT-011)."
rationale = "Ink/Stitch's zigzag satin, read at 6555892, stops its contour underlay at the zigzag's peaks (lib/elements/satin_column/underlay.py, _do_contour_underlay): an underlay past the last top stitch on a rail would show, and a file sews alike in both."
milestone = "M7"
status = "active"

# ── Fill region ────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-FILL-001"
area = "fill"
level = "L2"
statement = "A fill's region is the area its subpaths bound under its fill rule: a point off the edges is in it when the subpaths wind round it a number of times that is not 0 (nonzero) or is odd (evenodd). Curves are flattened within 0.1 CSS px, each subpath is closed, and one of fewer than 3 distinct points bounds nothing. Subpaths are cut where they cross, touch or run along each other, on a grid of 2^-35 mm, as Ink/Stitch puts a fill's shape on a grid of 1e-10 CSS px: points a rounding error apart become one, and the edges between the cuts meet only at their ends. Outlines turn clockwise and holes counter-clockwise in y-up axes, each ring from its point the drawing reaches first, and parts and holes come in the order the drawing reaches them."
rationale = "A fill should sew the area the drawing shows, as an SVG renderer paints it, whatever way its subpaths were drawn."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-002"
area = "fill"
level = "L2"
statement = "A part of a fill's region of 3 square CSS pixels (0.21 mm²) or less is left out, and SC-W0303 counts the parts left out. A region under 20 square CSS pixels (1.4 mm²) gets SC-W0304, and one in more than one part SC-W0307."
rationale = "A row of stitches does not fit in a speck, and Ink/Stitch leaves such parts out, but without a word: a part of the drawing that sews nothing should be said."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-003"
area = "fill"
level = "L2"
statement = "A fill whose fill parameter is off sews nothing, and nothing is said of it. It is still the next element of the element before it, which ends near its area, as in Ink/Stitch."
rationale = "Ink/Stitch sews nothing for such a fill, and a path whose outline alone should sew keeps its fill colour on screen."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-004"
area = "fill"
level = "L2"
statement = "Building a fill's region charges the work budget for every point it walks to place each ring that bounds no face in the faces around it and to join each hole apart from every outline to the outline around it. Each ring's bounds are found once, and a ring is located only in the faces or outlines whose bounds cover its own."
rationale = "The work budget stands for the time planning takes, so that a design is refused for being too large rather than planned for minutes. A loop that does not charge for its work lets a fill of many parts with holes take far longer than its budget allows."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-005"
area = "fill"
level = "L2"
statement = "A fill whose fill_method is legacy_fill is sewn as a tatami fill with the same settings and fill_underlay off, and SC-W0314 says so. It is a tatami fill in every other way: its settings are read as a tatami fill's, and the element before it ends near its area. The VectorCraft plug-in's fill dialog does not offer the method."
rationale = "Ink/Stitch keeps legacy fill, its first fill method, for its older files, and gives it to a fill whose auto_fill is off. StitchCraft does not build the method, and skipping such a fill would leave a hole in the design. A tatami fill without underlay lays the same rows, and sews no underlay either."
milestone = "M7"
status = "active"

# ── Tatami fill ────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-FILL-TAT-001"
area = "fill/tatami"
level = "L2"
statement = "Every row segment is sewn exactly once, in the order Ink/Stitch's routing takes them: one walk through the graph of the segments and the stretches of ring between their ends, every other stretch doubled, which takes a row wherever one is left and otherwise a node's first edge, in the order Ink/Stitch's graph library lists them in a copy of the graph. The route starts at the point of the rings nearest the needle and ends at the point nearest the fill's next stitch (REQ-GEN-003). With underpath, a needle inside the part first travels there under the rows from the node of the lines nearest it, as Ink/Stitch's does. Between rows the needle travels under the rows not sewn yet (REQ-FILL-TAT-005), or with underpath off along the outline, the shorter way round."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-002"
area = "fill/tatami"
level = "L2"
statement = "Rows run at the fill's angle, counter-clockwise from horizontal on screen. Measured across them from the design's origin, a part's first row lies the largest whole number of row spacings from the origin that does not pass the part, and the rows follow it row_spacing_mm apart, the nth n spacings past it, while they lie before the part's far side. A row within 1e-9 mm of the far side lies on it, and is left out. With end_row_spacing_mm, each step is the row spacing plus the difference to the end spacing times the distance from the first row over the part's height, and the end spacing once that distance passes the height. A row is cut where it crosses the part's rings, and where it crosses a side along x or along y, it ends on the side exactly, as GEOS cuts it."
rationale = "Rows a whole number of spacings from the origin line up across fills side by side, as Ink/Stitch lays them, and a fading fill changes its density steadily."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-003"
area = "fill/tatami"
level = "L2"
statement = "A row segment's needle points are its start, every point of the stagger grid past the start and before its end, and its end unless skip_last is on or the last point lies within 0.1 mm of it. The grid's points lie the longest stitch apart, measured along the rows from the design's origin at whole numbers of stitches plus the row's offset: the row's number (its distance across the rows from the origin over the row spacing, rounded, halves to even) over staggers, less its whole part, times the longest stitch. A staggers of 0 counts as 1, and a negative one staggers the rows the other way, as in Ink/Stitch. With random stitch lengths, the first point lies a random share of a stitch past the start and each next one a stitch on, longer or shorter by up to the jitter."
rationale = "Each row's points lie a staggers-th of a stitch along from the row before's, so neighbouring rows never line them up into furrows, and fills side by side share the grid, as Ink/Stitch places them."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-004"
area = "fill/tatami"
level = "L2"
statement = "Rasterized at 0.05 mm with a 0.4 mm thread, at least 98 percent of the region is covered at spacings from the machine's shortest stitch up to 0.4 mm. Rows nearer each other that meet an edge square on hand over along it in a stitch the machine does not sew, and the next row's first needle point is left out (DEV-FIN-001)."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-005"
area = "fill/tatami"
level = "L2"
statement = "With underpath, on by default, the needle travels between rows inside the part, as Ink/Stitch's does: the cheapest way along 3 gratings of lines at 45° either way and square to the rows, each line costing its length over its distance from the part's rings, each stretch of ring 3 times its length, and each line closed once a row sewn crosses it. The way is smoothed and lies inside the region (within 0.05 mm). Where it leaves the part, the ring takes it round to where it comes back in, unless the 2 points lie within 0.02 CSS px of each other along x and y together, where Ink/Stitch's diamonds of 0.01 px round them meet. Where no line joins the 2 points, the needle runs along the rings and rows, as with underpath off."
rationale = "Travel under rows sewn after it is hidden by them, and travel that keeps off the rings stays out of the fill's edge."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-006"
area = "fill/tatami"
level = "L2"
statement = "A tatami fill's top rows reach past each end of their segments by pull_compensation_mm plus pull_compensation_percent of the segment's length, the first value at the end the rows start from and the second at the other, as Ink/Stitch lengthens them. Where 2 segments of a row meet end to end, the row going on in the part, neither is lengthened, and the row is sewn once there, as through Ink/Stitch's rebuilt part. A fill reads a value below 0 as 0, as Ink/Stitch does, and SC-W0312 says so. The part keeps its holes and its pieces, and the travel between rows joins their lengthened ends. Underlay is not compensated."
rationale = "The thread pulls the fabric in along the rows, and lengthening them makes up for it. Rebuilding the shape round the lengthened rows, as Ink/Stitch does, closes holes and gaps the designer drew and can drop a piece of the fill."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-007"
area = "fill/tatami"
level = "L2"
statement = "Where a tatami fill's route leaves a stretch of more than 3 rows for another, gap_fill_rows more rows, rounded up to an even number, are sewn past the stretch's last row, back and forth, and the needle comes back to where that row ended, as Ink/Stitch sews them. The route leaves a stretch where Ink/Stitch's gap fill finds it does: where more than one edge of travel is left once loops back to a node the travel already reached are taken out, an edge pairing 2 nodes of odd degree counting as one where a row or a stretch of ring joins them. The gap-fill rows go on past the stretch's last row, away from the last row sewn before it in another row, and each is the next grid row's stretch beside the row before it. All rows, gap-fill rows included, and the stitches between them lie inside the part within its pull compensation, or within the running stitch's tolerance where travel cuts a corner of a ring. Underlay has no gap-fill rows."
rationale = "Rows that leave the shape sew stitches where the design has none."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-008"
area = "fill/tatami"
level = "L2"
statement = "A region in parts sews each part on its own, in order of its distance from the needle (with no needle, of how far left it reaches), and parts that tie in order of their point of least x and of least y among the points level with it, each part ending at its point nearest the next and the last nearest the next element, as Ink/Stitch sews them. Each part is a group of its own, joined to the next as assembly joins any 2 groups, and SC-W0307 says the fill is in parts."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-010"
area = "fill/tatami"
level = "L2"
statement = "A row's segments are the stretches of it in the part, the outline included, split at every point where the row meets the outline: where it crosses the outline, where the outline touches it from inside, and at both ends of a stretch along the outline. A row that only touches the part at a point has no segment. A point of the outline within 1e-9 mm of a row lies on it. The segments are the pieces GEOS finds when it cuts the row with the part."
rationale = "Where rows start and end decides every needle point at the edge of a fill, and Ink/Stitch takes them from GEOS, so a file sews alike in both."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-011"
area = "fill/tatami"
level = "L2"
statement = "With fill_underlay, on by default, each part sews its underlay before its top rows: a layer of rows for each angle of fill_underlay_angle in turn, or with none set, one at the fill's angle plus 90°. A layer's rows lie evenly fill_underlay_row_spacing_mm apart (empty: 3 times row_spacing_mm), and its needle points lie on the stagger grid of its rows fill_underlay_max_stitch_length_mm apart (empty: the fill's longest stitch), with the fill's staggers, fill_underlay_skip_last for skip_last and underlay_underpath for underpath. Each layer is routed as the top rows are, from the point of the part's rings nearest the needle back to that point, and the top rows start where the last layer ended, as Ink/Stitch sews them."
rationale = "Underlay holds the fabric still while the fill is sewn and lifts the top rows, so less fabric shows between them. Its rows cross the top rows, which hide them."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-012"
area = "fill/tatami"
level = "L2"
statement = "Each part's underlay is sewn on the part shrunk by fill_underlay_inset_mm, and its top rows on the part grown by expand_mm (shrunk where it is negative). A part is grown or shrunk with round corners, as GEOS buffers a polygon, and agrees with shapely's buffer within a nanometre. Where shrinking cuts a part into pieces, each piece is sewn on its own, starting nearest the needle, in order of least x: every layer of the underlay on one piece before the next, and the top rows of each piece ending nearest the next part or element. With forced locks, each piece's top rows are tied off and jumped from, as Ink/Stitch's groups are. Where it leaves nothing, the part itself is sewn, and SC-W0310 or SC-W0309 says so, as Ink/Stitch warns."
rationale = "An inset keeps the underlay from showing at the fill's edge, and growing a fill closes the gaps that open between fills side by side as the thread pulls them in."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-013"
area = "fill/tatami"
level = "L2"
statement = "Placing points on a fill's rings, weighing travel's lines by their distance from the rings, and keeping travel inside its part look only at the sides of the rings near each point, line and stitch, and answer as a look at every side would. The route finds the rings its rows reach with one charged look at each node. At the default settings, a 70 mm square with 14 x 14 round holes 3 mm across, and a 120 x 60 mm background with 60 holes of 200 points each, plan within a tenth of the default work budget."
rationale = "A fill's work should grow with its size, not with the square of its detail: a design should be refused for being huge, not for having detailed holes."
milestone = "M5"
status = "active"

[[req]]
id = "REQ-FILL-TAT-009"
area = "fill/tatami"
level = "L2"
statement = "A 130 x 180 mm rectangle at 0.4 mm spacing, the reference hoop's whole field, plans within the NFR-PERF-1 budget."
milestone = "M5"
status = "active"

# ── VectorCraft ────────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-VC-001"
area = "vectorcraft"
level = "L2"
statement = "The .vectorcraft adapter reads layers, groups, paths, compound paths, paints, visibility and our effect records from every VectorCraft version the compatibility gate lists as supported; untrusted input is capped and fuzzed."
rationale = "Formats 1 to 4, plain or compressed, with or without data after the JSON, hold the same drawing the same way; a file made to cost too much is refused before it does."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-002"
area = "vectorcraft"
level = "L2"
statement = "Every plug-in manifest is accepted by VectorCraft's host: id charset, kind, at most 64 parameters, 64 KiB. A stitch family's manifest declares the registry's parameters for the family that one value of VectorCraft's kinds can hold, the method's group first and the settings every element shares last, and a record of its defaults sews as an element without settings."
rationale = "VectorCraft refuses a module whose manifest breaks its rules, and stores every declared parameter, at its default when the user leaves it; a default that read otherwise would change what sews."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-003"
area = "vectorcraft"
level = "L2"
statement = "Each live-effect preview level completes within VectorCraft's v1 budget (5 s, fuel limit) for the largest fixture of that level: auto, rows and the outline on every shape the contract tests run, and a fill's exact preview on the small fills it fits. A level that needs more than its share of the budget gives way to a cheaper one, or, when the user picked it, names one."
rationale = "VectorCraft stops a live effect that runs past its instructions and draws the object as it is, so a preview must spend what it is given and show what fits; the engine's work units, priced in instructions, are how the plug-in tells."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-004"
area = "vectorcraft"
level = "L2"
statement = "A VectorCraft object with visible StitchCraft effects is sewn as they say and only so, in their order: a fill effect fills the object's shape, a stroke effect stitches along it and a satin effect makes a satin column of it, each with the record's parameters. A fill effect takes the colour of the topmost fill VectorCraft draws, and the others that of the topmost stroke, whose width and join they follow, falling back on the other kind. An opaque paint comes before one of opacity under 1. An object without them is sewn as an SVG shape is: the fills VectorCraft draws, then its strokes, each in its paint's colour."
rationale = "The effect is how a VectorCraft user sets an object's embroidery, and the plug-in previews what it sets; the file must sew what the previews show."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-005"
area = "vectorcraft"
level = "L2"
statement = "Nothing a VectorCraft document draws is left out silently: text, images, symbols, live objects, clipping, VectorCraft's own effects, brushes, the paints of groups and layers, gradients and patterns are named (SC-W0807), and so are template layers, layers that don't print and guides (SC-I0809). So is what VectorCraft draws of a stroke and its stitches don't follow: arrowheads, dashes, a stroke painted below a fill, and the alignment, width profile and caps of a stroke a satin column or a zigzag is made of. So are 2 or more StitchCraft effects on one object or group, each sewn on the shape as drawn where VectorCraft draws each on what the one before drew. Only what VectorCraft does not draw, such as a hidden object, is left out without a word."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-006"
area = "vectorcraft"
level = "L2"
statement = "A StitchCraft effect sews wherever VectorCraft draws it: on the object it is applied to, on each object a graphic style that holds it is applied to, and, on a group or a layer, on each path and compound path inside that VectorCraft paints. A path that no paint paints is left out. An effect's thread, and the stroke a stroke or a satin column follows, come from the topmost paint over the object, whichever level the effect comes from: the groups' paints over their contents, the outermost first, then the object's own, then the groups' paints under their contents. A clip group's clipping object, a path or a compound path, takes the group's effects and its own paints alone. A path that StitchCraft effects reach from more than one level, its own and those of the groups and layers around it, sews as the nearest say, and that is named (SC-W0807)."
rationale = "Graphic Styles are VectorCraft's presets: applying one copies its effects into each object, or into the group it is applied to. VectorCraft runs a group's geometry effects on each path inside, and paints what they draw with the path's paints and the group's, which go over the path's own unless the group's Contents row is moved up. Where levels stack, VectorCraft runs one effect on the stitches another drew, which no machine sews."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-007"
area = "vectorcraft"
level = "L2"
statement = "A satin column of 2 paths joined with VectorCraft's Make Compound Path sews as the column they draw, whichever way VectorCraft turns them, and a rung joined to it the same way sews as a rung, drawn either way."
rationale = "VectorCraft's own command makes a column of 2 paths and adds rungs, so the plug-ins need no tool for it. From 0.10.0 it reverses each path in front that winds the same way as the backmost one, a straight path counting as clockwise, and the column turns its second rail back (reverse_rails, automatic), as Ink/Stitch does."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-008"
area = "vectorcraft"
level = "L2"
statement = "`stitch plan` reads a VectorCraft document, `.vectorcraft`, `.drawcraft` or `.vctemplate`, and writes from it what it writes from an SVG file: the machine file, the picture and the report, with the reader's warnings among what is said. When it finds a bug in StitchCraft, its bug-report bundle holds the part of the document the reader reads, and a replay reproduces the run. `stitch export` is another name for `stitch plan`."
rationale = "The live effects show the stitches in the drawing, and the command line makes the machine file, as VectorCraft's own export does from 0.14 with StitchCraft's exporters (REQ-VC-011). One command and one way through the engine for every design keeps a VectorCraft document sewing as its SVG would."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-009"
area = "vectorcraft"
level = "L2"
statement = "An object or a layer named `stitch:ignore`, alone or followed by white space and a note, is left out with everything in it, and listed (SC-I0811). An object named `stitch:start` or `stitch:end` that is neither a group nor a layer marks where the fill or the satin column grouped with it starts or ends, and is never stitched. Until StitchCraft starts and ends shapes at such hints (REQ-GEN-001), each marker is named (SC-W0807). A group or a layer so named, and any other name that begins with `stitch:`, is named as well, and the name is otherwise ignored. The names are read after any white space, in any mix of upper and lower case."
rationale = "ABI v1 gives a plug-in no command objects of its own. The names VectorCraft's Layers panel edits can carry them, as Ink/Stitch's ignore commands and its start and end positions do."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-010"
area = "vectorcraft"
level = "L2"
statement = "From VectorCraft 0.14 a live effect reads the stroke it is given. A stroke or a satin effect on its object follows the topmost of the object's strokes that has a paint and a width: its width, and from 0.15 its join, cap and miter limit, as `stitch export` follows the topmost stroke VectorCraft draws. So a satin column drawn as one path and a zigzag stroke show their stitches as wide as their stroke. Given no such stroke, the effect leaves such an object as it is and says why (SC-I0810). An effect on one of the object's fills or strokes, which `stitch export` doesn't use, leaves the object as it is too (SC-I0810)."
rationale = "The previews show what the file sews (REQ-VC-004). VectorCraft gives a live effect its object's own fills and strokes, without their opacity or whether they show, and not the paints of the groups around it, so an effect can't follow a group's stroke over the object, which `stitch export` follows."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-011"
area = "vectorcraft"
level = "L2"
statement = "From VectorCraft 0.14, StitchCraft's exporters write PES and DST files from File › Export › Export As. An exporter writes the file `stitch export` writes of the document VectorCraft gives it: read as `stitch export` reads a `.vectorcraft` file, digitized automatically as with `--auto` when its `auto` parameter is on, planned for the machine its `profile` parameter names, and with the file's name as the design name. What `stitch export` says comes back as the export's warnings, one line each, naming its element, and at most 100, the last counting those left out. When anything said is an error, the exporter writes nothing and says the first error, as `stitch export` writes nothing (REQ-CLI-003)."
rationale = "A VectorCraft user exports the machine file where the design was drawn, without saving it and running the command line (REQ-VC-008). The same reader, engine and format writer, with the same budget, keep the file the same whichever makes it."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-012"
area = "vectorcraft"
level = "L2"
statement = "From VectorCraft 0.14, a plug-in's dialog shows each parameter as the parameter registry describes it: its label, the unit of its value, its help when the pointer rests on the label, with what each option of a choice means, and a button that opens its entry in the parameter reference. The registry's groups are the dialog's sections, each group's rows together, in the manifest's order. A parameter of some of a family's methods shows only while the method is one of them, and one the registry shows only while another setting has some values shows only then. A parameter is left out when nothing the dialog offers would show it. The plug-in's own parameters, the preview level and the exporters' options, are labelled and explained too. VectorCraft 0.13 and earlier ignore these keys, and the modules install there as before."
rationale = "A label says what a setting does where a key such as `zigzag_spacing_mm` only names it, and a dialog of up to 48 rows reads more easily when only the rows that apply show. VectorCraft's dialogs showed each parameter's key until 0.14 adopted labels, units, help, sections and conditions (the RFC's P2). VectorCraft passes a hidden parameter to the plug-in with its value, so what a dialog shows never changes what sews."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-013"
area = "vectorcraft"
level = "L2"
statement = "From VectorCraft 0.16, StitchCraft's Design Settings filter keeps a document's design settings and machine with it, as data VectorCraft keeps with a document for a filter: Ink/Stitch's 3 design settings, `collapse_len_mm`, `min_stitch_len_mm` and `min_satin_stroke_width_mm`, and the machine profile. It changes no object. `stitch export` and the exporters plan the document with its settings, and for its machine unless `--profile` or the export's dialog names another. A setting that does not read keeps its default, and a machine StitchCraft doesn't have leaves the reference machine, each with `SC-W0812`. A VectorCraft before 0.16 doesn't keep a filter's data, and there the filter declines with `SC-E0813`. A live effect is not given them, and its preview keeps the defaults and the reference machine."
rationale = "Ink/Stitch keeps its design settings in the SVG file, and a VectorCraft document had nowhere to keep them until 0.16 gave each filter data of its own in the document. A design is planned for one machine and hoop, which belongs with it as much as its settings do. So the file VectorCraft exports and the one `stitch export` writes of the saved document are the same, whoever exports it."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-014"
area = "vectorcraft"
level = "L2"
statement = "From VectorCraft 0.17, StitchCraft's Stroke to Satin filter, a heavy filter, makes each subpath of each selected path that has a stroke into a satin column drawn with rails and rungs: the rails and rungs the engine makes of a satin column drawn as one path, from the subpath as its centre line and the stroke's width and join (REQ-SAT-016, REQ-SAT-017), in a compound path with the stroke's paint and the satin effect. The column sews as the line with the satin effect sews. The satin effect keeps the line's satin settings, and replaces its other StitchCraft effects. An object the satin effect already reads as rails is left as it is. A selection that is empty or has a path without a stroke, a line that makes no rails or leaves parts out, or a column that would be read back otherwise, is refused with SC-E0814, and nothing changes. A VectorCraft before 0.15 keeps no effect record a filter gives, and there the filter declines with SC-E0813. A VectorCraft before 0.17 gives the filter a light run's budget, which most curved lines need more than."
rationale = "Ink/Stitch's Stroke to Satin, once Convert Line to Satin, turns a line into a column whose rails and rungs can then be edited. Making the rails of a curved line takes up to 162 million instructions in VectorCraft's host, and a light filter run gets about 52 million, so the filter asks for the heavy budget VectorCraft 0.17 gives a filter the user allows."
milestone = "M6"
status = "active"

[[req]]
id = "REQ-VC-015"
area = "vectorcraft"
level = "L2"
statement = "From VectorCraft 0.16, StitchCraft's Test Sheet filter draws one of `stitch testsheet`'s sheets drawn as designs, TS-02B to TS-09, into the document, moved by whole millimetres so that its middle is nearest the middle of the artboard. Each element is an object with its path, its thread as the paint its family sews with, and its settings as the record of its family's StitchCraft effect, each the value its dialog row takes. The document sews as the sheet's design sews, moved as the filter moved it, and exports within an export's budget. The objects selected stay as they are. A VectorCraft before 0.16 doesn't tell the filter that it keeps the effect records a filter gives, and there the filter declines with SC-E0813. The sheets drawn stitch by stitch, TS-01, TS-02 and TS-10A to TS-10C, are not designs, and only `stitch testsheet` writes them."
rationale = "A machine checkpoint can then start from VectorCraft: the sheet's objects show their stitches, the exporters write it, and the dialogs show its settings. The sheets are the same designs the command line plans, so a sew-out from either answers the same questions."
milestone = "M6"
status = "active"

# ── Command line ───────────────────────────────────────────────────────────────────────────────────

[[req]]
id = "REQ-CLI-001"
area = "cli"
level = "L1"
statement = "A bug-report bundle reproduces its plan byte for byte: `stitch bug-report --replay` plans the bundled design again with the bundled profile and format and, with the same version of StitchCraft, gets every entry of the plan bit for bit, the same machine file and the same diagnostics; a bundle whose design or results were changed does not reproduce, and says what differs. The bundle records the design name the run gave the machine file, and the replay uses it, whatever the design's file name and the platform. A replay reads the bundle's format first, and says a bundle of another format is one, whatever else it holds. A bundle records the commit StitchCraft was built from, when it was built from a git checkout."
rationale = "A bug that cannot be reproduced cannot be fixed. StitchCraft is deterministic (determinism.md), so the design, the profile, the format and the version are all it takes."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-CLI-002"
area = "cli"
level = "L1"
statement = "When `stitch plan` finds a bug in StitchCraft — a failed plan check (SC-E0009) or a panic — it writes no machine file, writes a bug-report bundle next to the file it was asked for, says where, and ends with exit status 4. A panic's bundle says where it came: while planning, which a replay reruns, while drawing the picture, which a replay draws too, or while writing, which a replay does not do, and then it holds the plan, planned again."
rationale = "The person who meets a bug should not have to know how to report it: the bundle is the report."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-CLI-003"
area = "cli"
level = "L1"
statement = "When anything said about a design is an error, an element left out with one included (SC-E0004, SC-E0101, SC-E0201, SC-E0214), `stitch plan` writes no machine file and no picture, writes the report when one is asked for, says that nothing was written, and ends with exit status 1."
rationale = "A machine file without one of the design's elements is not the design, and a script that checks the exit status should not sew it. Ink/Stitch writes no file when an element fails."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-CLI-004"
area = "cli"
level = "L1"
statement = "`stitch bug-report --replay` prints each string it takes from the bundle, the diagnostics and the names in its errors included, with every control character, line breaks among them, and every invisible format character written as an escape such as `\\u{1b}`."
rationale = "Anyone can attach a bundle to an issue, and maintainers replay them. Raw, a bundle could set the terminal's title, clear its screen, or print a `reproduced` line of its own."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-CLI-005"
area = "cli"
level = "L1"
statement = "`stitch` reads at most 64 MiB from any path it is given, and 192 MiB from a bug-report bundle it replays, which can hold a design of 64 MiB in hexadecimal and what was said of it. It counts what it reads, so a pipe or a device, which say nothing of their size, is refused past the cap too."
rationale = "A wrong path must not make `stitch` read a disk image or `/dev/zero` until memory runs out."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-CLI-006"
area = "cli"
level = "L1"
statement = "A command writes the files it was asked for all or none: each is written under a temporary name of its own first, created new, so that a file or a link already there is neither written through nor replaced, and synced, and renamed into place once every one is written. When one cannot be written, the command prints what was said about the design, the file and why, and which files were written (none, unless renaming failed), and ends with exit status 3."
rationale = "A machine file left behind by a command that failed may be sewn, and the warnings about it would be lost with the failure. A link planted in a shared folder must not steer a write to another file, and a stick pulled out once the command is done must hold the whole file."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-CLI-007"
area = "cli"
level = "L1"
statement = "A command refuses, with exit status 2 and before it reads anything, outputs that name the same file as each other or as a file it reads, the paths compared where they lead."
rationale = "The file written last would replace the other: a design, a machine file it was made from, or a machine file under the report's name, which a summary would still describe."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-CLI-008"
area = "cli"
level = "L1"
statement = "What `stitch plan`, `stitch testsheet` and `stitch convert` print of a machine file they wrote, its size and counts, and what `stitch plan` reports and draws of it, is the file read back as `stitch inspect` reads it, in the threads of the plan it was written from."
rationale = "A machine sews the file, not the plan: a DST machine cuts the thread before a long jump the plan leaves, a PES file flags its jumps as trims and has no record for a trim at its end, and its needle points lie on the 0.1 mm grid."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-CLI-009"
area = "cli"
level = "L1"
statement = "When standard output is a closed pipe, `stitch` ends with the command's own exit status. Any other error writing standard output or standard error is said on standard error, and `stitch` ends with exit status 3."
rationale = "A design refused while its output went to a reader that is gone is still refused, and a write that failed must not look like success."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-CLI-010"
area = "cli"
level = "L1"
statement = "Help and usage errors are coloured only when they go to a terminal, and not when NO_COLOR is set to anything or TERM is dumb."
rationale = "Colour codes in a pipe, a file or a terminal that cannot show them are noise, and NO_COLOR is how people ask for none."
milestone = "M3"
status = "active"

[[req]]
id = "REQ-AUTO-001"
area = "auto"
level = "L2"
statement = "With `--auto`, `stitch plan` and `stitch export` digitize automatically each shape that has no settings: a VectorCraft object with no StitchCraft effect on it or on a group or layer around it, and an SVG element with no `inkstitch:` attribute. StitchCraft chooses an automatic shape's stitches by its width. A shape with settings is not digitized automatically, and without the switch every shape sews as before. SC-I0901 counts the shapes digitized automatically by the stitches they sew as. A bug-report bundle records the switch, and its replay digitizes the same."
rationale = "A traced picture is many shapes without settings, and the stitches that suit each depend on its width. A shape set by hand keeps what its maker chose."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-002"
area = "auto"
level = "L2"
statement = "An automatic area sews as a tatami fill with the fill's defaults, apart from its narrow parts (REQ-AUTO-013). An automatic stroke no wider than the design's narrowest satin stroke (min_satin_stroke_width_mm, 1 mm unless the design sets it) sews as a running stitch along its path, with the running stitch's defaults, tripled from 0.5 mm wide (REQ-AUTO-015). Widths are compared to the micrometre, so a width written in another unit that converts to a bound give or take a rounding error sews as the bound does."
rationale = "A satin column no wider than that is too narrow to stitch across (REQ-SAT-015), and a line that narrow is a running stitch."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-003"
area = "auto"
level = "L2"
statement = "An automatic stroke wider than the design's narrowest satin stroke, and no wider than 7 mm, sews as a satin column as wide as the stroke, its path the column's centre line (REQ-SAT-016): one column for each of its subpaths, in order, the second and later named after the stroke with `#2`, `#3` and so on. An open end whose cap is round or square reaches past the path's end by half the stroke's width, as far as the cap does. A subpath a satin column cannot follow, because it turns more tightly than the stroke is wide or is shorter than a CSS pixel, and a dot that a round or square cap draws, sew as the area they paint, filled as REQ-AUTO-004 fills it, with SC-I0902; a dot with a butt cap draws nothing and is left out with SC-W0401. A trim or a stop after the stroke follows its last part."
rationale = "A line as wide as a satin column sews best as one, as wide as it is drawn. A line traced from a picture has round or square caps, which are part of the line drawn."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-004"
area = "auto"
level = "L2"
statement = "An automatic stroke wider than 7 mm sews the area it paints as a tatami fill: each of its segments widened by half the stroke's width to each side, its corners joined as the stroke's join joins them where the drawing draws them (an SVG join that is not set is a miter limited by stroke-miterlimit), and its open ends capped with the stroke's cap, within the shapes' tolerance. Parts of that area smaller than 1 mm² are specks, merged into the area they share the longest edge with or left out (REQ-AUTO-008). An area that would reach more than 10 m from the origin is left out with SC-W0903. A line a metre long fills within the default budget."
rationale = "Satin stitches longer than 7 mm are loose and snag, so a line wider than that is filled, as an area of the same outline would be."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-005"
area = "auto"
level = "L2"
statement = "What the drawing draws of an automatic stroke sewn across its width, as a satin column or a fill, and its stitches don't follow is named: of a VectorCraft stroke, its alignment inside or outside a closed path and its width profile (SC-W0807); of an SVG stroke, transforms that stretch it more one way than the other, which draw it wider one way (SC-W0802). Its caps are followed, and not named."
rationale = "Nothing a document draws is left out silently (REQ-VC-005), and a traced line's caps are part of it."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-006"
area = "auto"
level = "L2"
statement = "Digitizing automatically makes no error of its own: an automatic shape that its width's stitches cannot sew is sewn otherwise or left out with a warning, and one that paints nothing sews as it would without the switch, so the only errors `--auto` adds to a design's are a shape that needs more work than the budget allows (SC-E0004, REQ-GEN-002) and a design that then has nothing to stitch."
rationale = "A traced picture has hundreds of shapes, some of them specks and loops, and an error keeps the whole design from being written."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-007"
area = "auto"
level = "L2"
statement = "An automatic area reaches 0.4 mm under each shape sewn after it from where it touches that shape, where their edges meet within twice the shapes' tolerance: it grows 0.4 mm into an area, a satin column, a filled line or a narrow part's line (REQ-AUTO-013) sewn after it, and no further than that shape, nor along an edge where the shape runs on near it without touching it. A satin column covers the area between its rails as they are sewn, and a narrow part's line the part. Where an area sewn after it covers part of it, it is cut away under that area, 0.4 mm inside the area's edge, so a trace that stacks its colours sews the areas of one whose colours abut, and a part that the areas sewn after it cover whole sews nothing. A column or a line sewn after it goes over it, and it is sewn whole under them. Shapes with settings are sewn as drawn, and an automatic fill that bounds no area is left to its fill. SC-I0904 counts the areas that reach under shapes sewn after them and those cut away, and names, in the order they are sewn, an area cut away whole, which sews nothing, and one whose neighbours need more work to find than the budget allows it, which keeps its region."
rationale = "Thread pulls stitches in from the edges of their shape, so shapes that only meet show fabric between them. A trace that stacks its colours sews each covered area twice, stiff and thick, unless the covered part is cut away."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-008"
area = "auto"
level = "L2"
statement = "An automatic area, or a part of one, smaller than 1 mm² is a speck, too small to sew. It is merged into the automatic area it shares the longest edge with, its own included: the one around it when it fills a hole, so that no hole shows where it was, or the rest of its own area when rounding left a hair between them. On a tie, it goes into the area drawn first. A speck that shares no edge with an automatic area is left out, and so is one whose neighbours need more work to find than the budget allows it. SC-I0905 names each speck, by its area rounded to a hundredth of a square millimetre and kept under 1 mm², and where it went. Specks are merged after the background is left out, and before the order is chosen (REQ-AUTO-010) and areas reach under their neighbours."
rationale = "A trace leaves specks where the picture's pixels were noisy, and a fill smaller than 1 mm² sews a knot, while a hole where it was shows fabric."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-009"
area = "auto"
level = "L2"
statement = "The lowest shape of a design is the picture's background when it is an automatic area, other shapes are drawn on it, and its outlines, holes aside, cover the box around the paths of all the design's shapes to within 0.5 mm of each side. The background is left out with SC-W0906. A background with settings sews as they say. Finding the background has the budget's work to itself, and one that needs more is sewn, and SC-W0906 says so."
rationale = "A traced picture's background is usually the fabric's own colour, and sewing it doubles the stitches and stiffens the whole design."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-010"
area = "auto"
level = "L2"
statement = "Automatic elements sew in an order StitchCraft chooses, after specks are merged and before areas reach under their neighbours. Shapes whose paint overlaps by more than twice the shapes' tolerance keep their paint order, the lower first: an area paints its region, a satin column the area between its rails as they are sewn, a narrow part's line the part (REQ-AUTO-013), and any other line the area its stroke paints as drawn. Shapes that only meet may sew in either order. A satin column or a line that touches a fill without overlapping it sews after the fill, unless shapes that overlap hold it before. Within those rules the next element has the thread that is sewing while an element of that thread is free to sew, and otherwise the thread of the first free element in paint order; of those, the one whose box lies nearest the box of the one sewn last, then the one whose box's centre does, then the one drawn first. Threads are the same when their colours are. Elements with settings keep their order among themselves, so do the parts of a shape sewn as several elements, and nothing moves across an element with a stop after it. SC-I0907 says when the order is not paint order, with the thread changes of each."
rationale = "A picture traced shape by shape, as VectorCraft's Auto Grouping draws it, changes thread at nearly every shape, and each change is a stop to rethread a home machine. A lower shape sewn after an upper one would cover it, and a line sewn over a fill's edge hides the edge."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-011"
area = "auto"
level = "L2"
statement = "`--sort-colours` on `stitch plan` and `stitch export` sews the elements with settings in the order of REQ-AUTO-010 too, with `--auto` or without it. A bug-report bundle records the switch, and its replay orders the same."
rationale = "A design drawn by hand is often drawn in an order that suits drawing it, not sewing it, and sorting it by thread saves the same stops."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-012"
area = "auto"
level = "L2"
statement = "Each element has the work budget to itself to find how it lies beside the shapes drawn after it in the order of REQ-AUTO-010, and one that needs more keeps its place in paint order as an element with a stop after it does: nothing moves across it. A shape whose paint can't be found within the budget keeps its place beside the shapes near its path. Choosing the order from what was found has the budget once more, and an order that needs more sews the elements not placed by then in paint order, after the others. SC-I0907 says each. SC-I0904 says it of a satin column instead, whose area the areas sewn before it then don't reach under either, and a fill's generator, which needs the work of its region too, says it of a fill (SC-E0004)."
rationale = "One shape too complex to compare with its neighbours, or a design too large to order, must not cost the plan: the order falls back to the drawing's, and says so."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-013"
area = "auto"
level = "L2"
statement = "A part of an automatic area, as it is drawn, that is narrower than the design's narrowest satin stroke everywhere sews as a running stitch along its centre line (REQ-AUTO-014), with the running stitch's defaults, tripled from 0.5 mm wide (REQ-AUTO-015). A part is narrower than a width everywhere when, shrunk with the polygon buffer by half of the width taken half a micrometre wider, it leaves no area. A part smaller than 1 mm² stays in the area as a speck (REQ-AUTO-008), and so does a part whose centre line has no length. The rest of the area sews as a tatami fill. Each narrow part's line sews after it, in the order of the parts, named after the area with `#2`, `#3` and so on, or with the area's own name when nothing of it is filled. A trim or a stop after the area follows its last part. A narrow part's line paints the part: it sews after a fill it borders (REQ-AUTO-010), and an area sewn before it reaches under it as under a satin column (REQ-AUTO-007). One that the areas sewn after it cover whole sews nothing, as such an area doesn't, and one they cover in part sews whole. SC-I0901 counts an area as a running stitch when all of it runs. Finding a part's width and centre line is part of the work of digitizing the area, and a part whose width or centre line cannot be found (a bug, SC-E0009, naming the area) stays in the fill."
rationale = "A line traced from a picture is an area, and filled, an area that narrow sews rows no longer than it is wide wherever they cross it. A running stitch along its middle sews the line as the picture shows it."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-014"
area = "auto"
level = "L2"
statement = "A narrow part's centre line comes from a constrained Delaunay triangulation of its outline and holes, with points added along their edges so that no piece is longer than the part is wide on average, twice its area over its perimeter, or than 0.1 mm if that is longer. Each edge of a triangle that lies inside the part is a chord. A triangle with 1 chord is an end, one with 2 is part of a strip, and one with 3 is a junction. An end whose corner the circle on its chord holds is a cap, which grows across the chords while the circle on each holds every corner of the cap: through each strip triangle, and through a junction once caps reach 2 of its sides, across its third chord, the 2 growing on as one. The line ends at the middle of the last chord a cap grew across, or at the middle of a junction whose other sides are caps. Where an end's chord's circle doesn't hold the end's corner, the end is a tip, and the line runs on to it. Elsewhere the line joins the middles of the chords, and passes through the middle of each junction triangle. Which end comes first makes no difference. A branch from a junction to an end no longer than twice the junction triangle's longest edge is a bump of the outline, or the corner of a sharp turn, and has no line: the shortest goes first, until no junction has one. At a junction the 2 branches that run on most nearly straight, each measured from the junction triangle's middle to its first point at least that triangle's longest edge away, or to its end, are one line, and the third ends there. A part that is a ring of strips has a closed line. A line that would run on along a piece of the centre line that another line has sewn ends there instead. A part's lines sew one after another, the longest first, each from its end nearest where the last one ended, a closed one from its point nearest."
rationale = "The chords of a triangulation whose triangles are about as long as the part is wide cross the part, so their middles follow its middle. Ends and junctions need rules of their own, and the small bumps of a traced outline would otherwise branch the line."
milestone = "M13"
status = "active"

[[req]]
id = "REQ-AUTO-015"
area = "auto"
level = "L2"
statement = "A running stitch that automatic digitizing makes is a triple run from 0.5 mm wide: bean stitch 1, each stitch sewn 3 times. A stroke is as wide as it is drawn. A narrow part is as wide as the largest circles that fit inside it centred on its centre line, on average along the line: twice the distance from the line's points to the part's outline and holes. Widths are compared to the micrometre."
rationale = "A running stitch sewn once is as fine as the thread, and a line drawn half a millimetre wide or wider sews bolder as a triple run."
milestone = "M13"
status = "active"
