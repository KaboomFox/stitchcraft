[[deviation]]
id = "DEV-THREAD-001"
area = "formats/pes"
summary = "PES files name each thread by a Brother entry chosen by CIEDE2000, the nearest pairs first, so a thread gets its nearest entry unless a thread nearer to it took it. pystitch, which writes Ink/Stitch's PES files, measures with an integer redmean distance, gives a tie to the later entry, and gives threads their entries in the order of a Python set. Each palette colour alone is written as itself by both. Other colours often get other entries: pure red is Vermilion here and Red there, pure blue Purple here and Ultramarine there. And where 2 threads have one nearest entry, pystitch may give it to the farther."
reason = "CIEDE2000 picks the colour people see as nearest (REQ-THREAD-001, data-model.md). The nearest pairs first keep a palette colour on its own entry, in whatever order the threads come (REQ-THREAD-002)."
requirements = ["REQ-THREAD-001", "REQ-THREAD-002"]

