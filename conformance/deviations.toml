# Intended differences from Ink/Stitch's behaviour, each with a reason and the requirement that
# motivates it. Conformance level L3 (Ink/Stitch differential, from M8) reads this file so that a
# documented deviation is reported as such instead of as a failure.
#
# [[deviation]]
# id = "DEV-FILL-TAT-001"
# area = "fill/tatami"
# summary = "Pull compensation extends rows at their ends instead of buffering the whole shape."
# reason = "Preserves holes and gaps the designer left on purpose."
# requirements = ["REQ-FILL-TAT-006"]

[[deviation]]
id = "DEV-PRM-001"
area = "params"
summary = "A value StitchCraft cannot read refuses its element (SC-E0101), and the rest of the design is sewn. Ink/Stitch sews such a value as the parameter's default, or a toggle as off, without a word: it sews 3,5 for running_stitch_length_mm as 2.5 mm stitches, and a toggle of on as off. A toggle reads yes, y, true, t and 1 as on here, as Ink/Stitch does, and only their opposites and off as off. StitchCraft reads a tab, or several spaces, between a list's values as one space, where Ink/Stitch sews a list with a tab between values as its default, and a fill's underlay angles with 2 spaces between them too. It also reads a unit right after a number, mm, in or pt after a length, a degree sign or deg after an angle and a percent sign after a percentage, where Ink/Stitch sews the default."
reason = "Guessing could sew what the designer did not ask for, and a value that changes nothing in silence is lost work (REQ-PRM-002). On means on wherever else it is written. A tab or a second space separates values as plainly as one space does, and a unit says plainly what a number is. Ink/Stitch's readers were read at d59c9ab (lib/elements/element.py, lib/elements/fill_stitch.py)."
requirements = ["REQ-PRM-002"]

[[deviation]]
id = "DEV-PRM-002"
area = "params"
summary = "Every number a parameter takes keeps to a range of StitchCraft's, given in the parameter's reference entry. A value outside it is clamped into it, with SC-W0102. Ink/Stitch sets a floor for most of its numbers and few ceilings, so many of these ranges are narrower than its own: repeats has no ceiling there and stops at 100 here."
reason = "A range keeps a value to what a machine can sew and the engine can work out within its budget, and the warning says when a value was changed (REQ-PRM-002). Ink/Stitch's getters were read at d59c9ab (lib/elements/stroke.py, lib/elements/satin_column/satin_column.py, lib/elements/fill_stitch.py)."
requirements = ["REQ-PRM-002"]

[[deviation]]
id = "DEV-PRM-003"
area = "params"
summary = "An optional length below 0 is read as not set, as 0 is, and SC-W0102 says so. Ink/Stitch reads it as a length and sews what that gives: with a min_jump_stitch_length_mm below 0, it ties off, jumps and ties in between every 2 groups of stitches."
reason = "A length below 0 is no length, and the warning says it was read as none (REQ-PRM-002). Ink/Stitch's getters were read at d59c9ab (lib/elements/element.py, lib/stitch_plan/stitch_plan.py)."
requirements = ["REQ-PRM-002"]
params = ["min_stitch_length_mm", "min_jump_stitch_length_mm", "max_stitch_length_mm", "end_row_spacing_mm", "fill_underlay_row_spacing_mm", "fill_underlay_max_stitch_length_mm", "zigzag_underlay_max_stitch_length_mm"]

[[deviation]]
id = "DEV-PRM-004"
area = "params"
summary = "A list takes at most 16 values and a pair 2, and no value may be longer than 4,096 bytes: more refuses the element (SC-E0101), whose message quotes the start of a long value. Ink/Stitch reads a list of any length, takes the first 2 values of a longer pair, and reads text of any length."
reason = "The limits bound the work and the memory one value can cost before any budget is charged, and no stitch pattern, pair or custom lock needs more (REQ-PRM-002). Ink/Stitch's readers were read at d59c9ab (lib/elements/element.py)."
requirements = ["REQ-PRM-002"]

[[deviation]]
id = "DEV-LCK-001"
area = "plan/locks"
summary = "Each Ink/Stitch lock id is accepted, with StitchCraft's own shapes behind the ids and the same intent. The half stitch goes forth and back twice over half the first stitch, and back_forth twice over one step, where Ink/Stitch's go out two steps and back. The drawn shapes are new. A custom lock drawn as an SVG path sews the half stitch, with SC-W0503, until M8."
reason = "Clean room: the shapes come from StitchCraft's design (docs/src/design/algorithms/locks.md), never from Ink/Stitch's lock data (ADR-0001). Each shape lies on the stitching it secures, and its stitches are at least 0.2 mm long. Machine checkpoint MC-2 (TS-04) checks that they hold."
requirements = ["REQ-LCK-002"]

[[deviation]]
id = "DEV-LCK-002"
area = "plan/locks"
summary = "Locks of steps follow the stitching round its corners, as Ink/Stitch's custom steps do. They differ in 5 places. Past the end of stitching shorter than the lock, they go straight on from the last stitch, where Ink/Stitch puts the rest of the lock on the last needle point. Where following a sharp turn would sew a stitch shorter than 0.2 mm, the lock is sewn straight along the first (or last) stitch, with SC-W0502, where Ink/Stitch follows the turn. A step shorter than 0.2 mm is lengthened to 0.2 mm, with SC-W0502, where Ink/Stitch sews it as it is. A custom step of 0 is left out, with SC-W0503, where Ink/Stitch sews a stitch in place for it. And a custom step longer than 10 m, the data model's reach, is left out with SC-W0503."
reason = "No lock stitch is shorter than 0.2 mm (REQ-LCK-002), so the needle never goes back into the hole it just left. Ink/Stitch's behaviour was read at d59c9ab (lib/stitch_plan/lock_stitch.py), docs/src/design/algorithms/locks.md."
requirements = ["REQ-LCK-004"]

[[deviation]]
id = "DEV-RUN-001"
area = "strokes/running"
summary = "Corners are joins between segments that turn by more than 30°. Ink/Stitch takes turns of 45° or more at any point of the flattened path, curves included, and skips one closer than twice the tolerance to the previous."
reason = "A needle on every sharper join keeps drawn shapes crisp, and a curve's own bend is followed within the tolerance instead (docs/src/design/algorithms/strokes.md)."
requirements = ["REQ-RUN-003", "REQ-SAT-010", "REQ-SAT-011"]

[[deviation]]
id = "DEV-RUN-002"
area = "strokes/running"
summary = "Stitches are spread evenly along the path between corners. The path is flattened within a tenth of the tolerance, and where the stitches stray from its points by more than the other nine tenths, the span is spread evenly in more of them when that takes no more stitches than splitting the stray ones, and otherwise the stray ones are split. Ink/Stitch makes each stitch as long as the whole tolerance allows at the points of its path, measured straight, and divides what is left evenly again after each one. A small circle can take one stitch more than Ink/Stitch's: TS-03's circles 6 mm across take 14 and 10 at 0.1 and 0.2 mm."
reason = "Equal stitches between corners with no short leftover, and the tolerance met where the path needs it. The stitches keep within the tolerance of the drawn path between the flattened points too, where Ink/Stitch's keep within it at its points. A small circle is sewn in even stitches as long as that allows."
requirements = ["REQ-RUN-001", "REQ-RUN-002", "REQ-SAT-010", "REQ-SAT-011"]

[[deviation]]
id = "DEV-RUN-003"
area = "strokes/running"
summary = "No running stitch is shorter than the shortest stitch, measured straight: corners keep their needle before other points do, a stitch a drop makes too long is split, and lengths below twice the shortest stitch are raised (SC-W0402). A satin column's travel length is raised the same way, for the straight stitches that join its parts as for its line to the start and the end. Ink/Stitch's running stitch has no shortest stitch; its plan later drops stitches of at most 0.1 mm (its default), keeping the stitch before."
reason = "The machine's shortest stitch is a limit: honoured where the stitches are placed, it never costs a corner or leaves an over-long stitch."
requirements = ["REQ-RUN-001", "REQ-RUN-003", "REQ-SAT-004", "REQ-SAT-010", "REQ-SAT-011", "REQ-SAT-013", "REQ-SAT-014"]
params = ["running_stitch_length_mm", "center_walk_underlay_stitch_length_mm", "contour_underlay_stitch_length_mm"]

[[deviation]]
id = "DEV-RUN-004"
area = "strokes/running"
summary = "A part of a path that is a single point, or too small for the shortest stitch, is not stitched and is reported (SC-W0401). Ink/Stitch differs in 3 ways. When a stroke's first subpath is a single point, it sews the whole stroke as a line 1 CSS pixel long from that point and leaves the other subpaths out. A single point after the first is one needle point for its running stitch, and its manual stitch leaves it out without a word. A part shorter than the shortest stitch is sewn as one stitch, which its plan leaves out only if it is 0.1 mm or shorter, at its default."
reason = "No stitches the design does not draw, and nothing left out without a word. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/stroke.py: _get_paths; lib/stitches/running_stitch.py: even_running_stitch and random_running_stitch; lib/stitch_plan/color_block.py: filter_duplicate_stitches)."
requirements = ["REQ-RUN-001"]

[[deviation]]
id = "DEV-RUN-005"
area = "strokes/running"
summary = "A running stitch's random lengths are drawn from StitchCraft's generator (SplitMix64, seeded from random_seed, or from the element's id when it has none), so the values differ from Ink/Stitch's for the same seed. They are placed otherwise too. StitchCraft draws a stitch's length and its span's phase from 2 numbers, starts a phase only where a span starts, and scales each span's stitches to end on its corner. Ink/Stitch draws one number for both a stitch's length and its phase, starts a new phase after each stitch the tolerance shortened as well, and leaves what is left before a corner as the last stitch. Both key each span's draws by its place in its subpath; StitchCraft's keys hold the subpath's place in the path too, where Ink/Stitch's start again in each subpath, so subpaths drawn alike sew alike there."
reason = "Every random value in StitchCraft comes from one fully specified generator, the same on every platform and never changed by a dependency (docs/src/design/determinism.md), as for satin columns (DEV-SAT-002) and fills (DEV-FILL-004). Scaling leaves no short leftover before a corner (DEV-RUN-002), and keying by the subpath keeps lines drawn alike from lining their needle points up, which the random phase is there to prevent. Ink/Stitch's random length was read at d59c9ab (lib/stitches/running_stitch.py: stitch_curve_randomly and random_running_stitch; lib/utils/prng.py)."
requirements = ["REQ-RUN-007"]
params = ["random_seed"]

[[deviation]]
id = "DEV-RUN-006"
area = "strokes/manual"
summary = "No hand-placed stitch is shorter than the shortest stitch. A node closer than that to the needle point before it is left out (SC-W0403), and a stitch longer than max_stitch_length_mm is split into no more parts than keep each at the shortest stitch or longer (SC-W0404). Ink/Stitch splits such a stitch into the fewest equal parts no longer than max_stitch_length_mm, however short they are, and its plan later leaves out stitches of at most 0.1 mm (its default), without a word."
reason = "The machine's shortest stitch is a limit: a shorter stitch hammers one spot and can break the thread (REQ-RUN-008), and a stitch kept longer for it is named. Ink/Stitch's manual stitch was read at d59c9ab (lib/elements/stroke.py: apply_max_stitch_length; lib/stitch_plan/color_block.py: filter_duplicate_stitches)."
requirements = ["REQ-RUN-006", "REQ-RUN-008"]
params = ["max_stitch_length_mm"]

[[deviation]]
id = "DEV-RUN-007"
area = "strokes/zigzag"
summary = "A zigzag stroke spreads its needle points along the path, flattened within a tenth of a CSS pixel as Ink/Stitch flattens it. Ink/Stitch spreads them along a running stitch it sews along the path first, at half each spacing and within running_stitch_tolerance_mm of it. At the default spacing that running stitch's stitches are 0.2 mm chords of the path's curves, and the needle points differ by hundredths of a millimetre. A part whose length lies close to a rounding boundary of its count of zigs and zags may have one zig and zag more or fewer."
reason = "StitchCraft's running stitch is placed otherwise (DEV-RUN-001 to DEV-RUN-004) and raises lengths below twice the shortest stitch, so it sews no running stitch of 0.2 mm stitches. That running stitch follows the path, and the path is the line it stands for. Ink/Stitch's zigzag stroke was read at d59c9ab (lib/elements/stroke.py, lib/stitches/running_stitch.py)."
requirements = ["REQ-RUN-009"]

[[deviation]]
id = "DEV-FIN-001"
area = "plan/finalize"
summary = "StitchCraft fits every stitch to the machine: it leaves out needle points less than their element's shortest stitch from the one before, never less than the machine's (0.3 mm on the Brother), keeping the ends of each run of stitches and its lock points unless a stitch to one would fall short, and splits stitches longer than the machine's longest. Ink/Stitch drops stitches no longer than the element's own shortest stitch, else 0.1 mm, and splits nothing. Along an edge square to them, a tatami fill's rows nearer each other than the shortest stitch hand over in a stitch too short, so the next row's first needle point is left out and a sliver at its start shows: a bar 5 mm wide at 0.25 mm on the Brother is 97 % covered. Along an edge at 45°, their ends lie 0.35 mm apart, and the handovers stay."
reason = "The machine profile says what the machine sews well; a stitch outside it hammers one hole, snags, or is refused (docs/src/design/engine-pipeline.md › Finalize)."
requirements = ["REQ-FIN-001", "REQ-FILL-TAT-004"]
params = ["min_stitch_length_mm"]

[[deviation]]
id = "DEV-SAT-001"
area = "satin"
summary = "A rung that crosses a rail more than once, or runs along a rail for a while, is left out (SC-W0207). Ink/Stitch leaves a rung out only when it meets the two rails at more than 2 points in all, and uses one that crosses one rail twice and misses the other, or runs along a rail, at one of its crossings. A subpath that does not move is left out as a point before rails are told from rungs (SC-W0205), where Ink/Stitch counts a line of zero length among the subpaths. A column drawn as one line is closed when that line is closed with Z, where Ink/Stitch takes the path's last command, so a move-to drawn after a closed line leaves it open there."
reason = "Which of its crossings such a rung means is not clear, so StitchCraft does not guess, and the warning names the rung. A line of zero length is neither a rail nor a rung, and a move-to alone draws nothing. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/satin_column.py, lib/elements/element.py)."
requirements = ["REQ-SAT-005"]

[[deviation]]
id = "DEV-SAT-002"
area = "satin"
summary = "Random satin widths, spacing and splits are drawn from StitchCraft's generator (SplitMix64, seeded from random_seed, or from the element's id when it has none), so the values differ from Ink/Stitch's for the same seed. The ranges are Ink/Stitch's, and so is when a width or a spacing is drawn. Ink/Stitch draws each stitch's splits from a generator of the stitch's own, where StitchCraft draws them from the element's, in the order the stitches are sewn."
reason = "Every random value in StitchCraft comes from one fully specified generator, the same on every platform and never changed by a dependency (docs/src/design/determinism.md). Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/satin_processor.py)."
requirements = ["REQ-SAT-007"]
params = ["random_seed"]

[[deviation]]
id = "DEV-SAT-003"
area = "satin"
summary = "With a random split phase, a split within the element's shortest stitch of a stitch's end is left out, and the element's shortest stitch is never shorter than the machine's (0.3 mm on the Brother). Ink/Stitch uses the element's own shortest stitch or the document's."
reason = "The machine's shortest stitch is a limit (DEV-FIN-001). A split nearer an end would sew a stitch the machine does not sew well, which finalizing would leave out anyway. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/split_points.py)."
requirements = ["REQ-SAT-003"]

[[deviation]]
id = "DEV-SAT-004"
area = "satin"
summary = "The centre walk underlay keeps within center_walk_underlay_stitch_tolerance_mm of its line, and follows points that far apart. Ink/Stitch declares that parameter but uses running_stitch_tolerance_mm in its place, the tolerance of the satin's travel to its start and end. Both are 0.2 mm unless a file sets them."
reason = "A setting does what its name says, and a file that sets neither sews the same in both programs. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/satin_column.py)."
requirements = ["REQ-SAT-010"]

[[deviation]]
id = "DEV-SAT-005"
area = "satin"
summary = "A satin column's travel, and a tatami fill's, take the first of the lengths running_stitch_length_mm gives. Ink/Stitch reads a satin's or a fill's value as one number, and sews a value of several with 2.5 mm, the default."
reason = "The key is declared once, as the running stitch's list of lengths, and a stroke turned into a satin column keeps its value, as does a path with a fill and a stroke. Its first length is the one the stroke started with. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/satin_column.py, lib/elements/fill_stitch.py)."
requirements = ["REQ-SAT-004", "REQ-FILL-TAT-005"]
params = ["running_stitch_length_mm"]

[[deviation]]
id = "DEV-SAT-006"
area = "satin"
summary = "A satin column's and a tatami fill's running_stitch_tolerance_mm defaults to 0.2 mm, the value Ink/Stitch sews when a file sets none. Ink/Stitch's settings window shows 0.1 mm."
reason = "The key is declared once, as the running stitch's, and its default is what both sew for a file without it. Ink/Stitch declares 0.1 mm but reads a missing value as 0.2 mm, read at d59c9ab (lib/elements/satin_column/satin_column.py, lib/elements/fill_stitch.py)."
requirements = ["REQ-SAT-013", "REQ-SAT-014", "REQ-FILL-TAT-001"]

[[deviation]]
id = "DEV-SAT-007"
area = "satin"
summary = "A satin column drawn as one path keeps the 2 rails made from its line as its rails, and each rung made pairs the points where it crosses them. Where 2 parts of the line join, the rung pairs the first points of the second part's rails. Ink/Stitch hands the rails and rungs back to its satin column as subpaths, which tells rails from rungs again by where they meet and how long they are, and adds a rung across the gap where parts join, 1.2 times as long, pairing where it crosses the rails. With exactly 2 rungs, or with rungs that cross each other, its rule falls back to the 2 longest lines. On a column shorter than its rungs those are 2 rungs. A line that crosses itself can also make a rung meet more lines than a rail does. Ink/Stitch also keeps the first part of a line cut in half when its offset vanishes to one side, with the rail it has, where StitchCraft leaves that part out with SC-W0213, as it leaves out later ones."
reason = "The rails made are known, so they need no guessing, and a column is never sewn between a rail and a rung. Where 2 parts meet on a straight stretch, the gap rung crosses the rails at those first points, and both sew alike. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/satin_column.py, lib/elements/utils/stroke_to_satin.py). The case req_sat_017_the_rails_made_stay_the_rails (crates/stitchcraft-engine/tests/satin_centre_line.rs) draws the lines Ink/Stitch would make for a dash 3.3 mm long and 5 mm wide, and its rule for drawn columns takes the 2 rungs as the rails."
requirements = ["REQ-SAT-016", "REQ-SAT-017"]

[[deviation]]
id = "DEV-SAT-008"
area = "satin"
summary = "A satin column whose needle points all lie within its element's shortest stitch of its first is not sewn, and SC-W0215 says so. Ink/Stitch sews it: its plan drops only stitches no longer than the element's shortest stitch, else the document's, 0.1 mm unless one is set."
reason = "Every stitch of such a column is shorter than the machine sews well, and a stroke that small is left out the same way (DEV-RUN-004). Ink/Stitch's behaviour was read at d59c9ab (lib/stitch_plan/color_block.py, lib/elements/satin_column/satin_column.py)."
requirements = ["REQ-SAT-018"]

[[deviation]]
id = "DEV-SAT-009"
area = "satin"
summary = "Of a satin column whose 2 rails are rings, each ending where it starts, the second rail starts at its node nearest the first rail's first node before the rails are turned. Without rungs, its nodes start there too, and each ring's start counts once at each end of its nodes, though a ring closed with Z after a segment back to its start lists it twice. Ink/Stitch takes each ring's own start and warns that a closed rail has no definite start. It sews 2 rings that start apart with stitches across the column, from the start of one to a place part of the way round the other."
reason = "A ring's start is the drawing program's choice, which the designer neither sees nor sets. VectorCraft's Make Compound Path, from 0.10.0, turns the front of 2 rings round, which starts it at what was its last node. The round patch of the VectorCraft tutorial, drawn by VectorCraft 0.12.0, sewed 292 stitches longer than 12 mm. Started together, its rings sew the same PES file as those of the patch drawn by VectorCraft 0.7.0, which started together as drawn. Rings that start together sew as they do in Ink/Stitch. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/rails.py, lib/elements/satin_column/satin_column.py, lib/elements/satin_column/validation_models.py)."
requirements = ["REQ-SAT-019"]

[[deviation]]
id = "DEV-SAT-010"
area = "satin"
summary = "Where a part of a satin column lies along the end's cut but for rounding, as a stitch across does wherever pull compensation widens or narrows it, StitchCraft cuts it as sides along one line meet, an end within 1e-5 CSS pixels of the other counting as on it: a widened stitch at the cut's first rail point, and a narrowed one at its own start. Ink/Stitch snaps only the cut to that grid, and cuts the part where its geometry library finds their nearest points, which for 2 lines that meet only by rounding depends on the rounding."
reason = "A stitch widened by pull compensation lies along the cut, so whether and where they cross is decided by the last bits of their coordinates. StitchCraft's cut wandered so before: a column turned by 0.37° with 0.5 mm of pull compensation was cut at its second rail point, and turned by 5.37° two thirds of the way across a stitch. Ink/Stitch's behaviour was read at 6555892 (lib/elements/satin_column/satin_column.py, split_linestring_at_end_point)."
requirements = ["REQ-SAT-014"]

[[deviation]]
id = "DEV-FILL-001"
area = "fill"
summary = "A fill's region follows its fill rule. Ink/Stitch takes the subpath of the largest area as the outline and every other subpath as a hole, whatever the fill rule, and repairs a shape that is not valid. The repair merges the subpaths' lines, a stretch drawn twice into one, and fills the faces they bound by how deeply they nest, which fills every face beside the outside. Where the nonzero rule fills a part inside that the subpaths wind round twice the same way, such as a ring drawn inside another the same way round, or the overlap of 2 shapes drawn the same way round, StitchCraft fills it (SC-I0306) and Ink/Stitch leaves it empty. Where the fill rule leaves a part beside the outside empty, which subpaths running along each other bound, such as a notch drawn as a hole along the outline or a subpath drawn twice, StitchCraft leaves it empty (SC-I0313) and Ink/Stitch fills it."
reason = "A fill sews the area the drawing shows, as an SVG renderer paints it (REQ-FILL-001). The information names each fill that differs. The even-odd rule makes the first kind sew alike in both, and an outline drawn round the empty part the second. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/fill_stitch.py), and its repair observed through shapely 2.2.0 (GEOS 3.14.1): a 10 mm square with a 5 mm notch drawn as a hole in its corner covers 100 mm², where the even-odd rule leaves 75 mm²."
requirements = ["REQ-FILL-001"]

[[deviation]]
id = "DEV-FILL-002"
area = "fill"
summary = "A subpath of fewer than 3 distinct points bounds nothing and is left out of the fill's region. Ink/Stitch makes a subpath of fewer than 3 points, as it flattens them, a triangle with 2 sides of 1 CSS pixel at its first point, which cuts a hole that small where it lies inside the fill."
reason = "A fill sews the area the drawing shows (REQ-FILL-001), and an SVG renderer paints nothing for such a subpath. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/fill_stitch.py)."
requirements = ["REQ-FILL-001"]

[[deviation]]
id = "DEV-FILL-003"
area = "fill/tatami"
summary = "With end_row_spacing_mm, the step from row to row changes from the row spacing to the end spacing over the part's height, measured from the first row, and stays at the end spacing beyond it. Ink/Stitch carries the change on past the height, which reaches the rows within a row spacing of the part's far side when the first row lies before the part. With an end spacing smaller than the row spacing, over a part a few rows tall, the steps then shrink towards 0 and the rows pile up short of the far side without end."
reason = "Every fill's rows end, and a fading fill keeps the density it fades to. Elsewhere the rows lie where Ink/Stitch lays them. Ink/Stitch's behaviour was read at d59c9ab (lib/stitches/fill.py), and its step formula, worked through for a part 1 px tall with rows 1 px apart shrinking to 0.1 px and its first row 0.5 px before it, stacks rows towards 1.11 px for ever."
requirements = ["REQ-FILL-TAT-002"]

[[deviation]]
id = "DEV-FILL-004"
area = "fill/tatami"
summary = "A tatami fill's random stitch lengths are drawn from StitchCraft's generator (SplitMix64, seeded from random_seed, or from the element's id when it has none), in the order its row segments are sewn, so the values differ from Ink/Stitch's for the same seed. The ranges are Ink/Stitch's: the first point a share of the longest stitch from the segment's start, and each next one a stitch on, longer or shorter by up to the jitter."
reason = "Ink/Stitch draws from a generator of each segment's own, keyed by the segment's place in the sewing order (lib/stitches/tatami_fill.py, lib/stitches/running_stitch.py at d59c9ab). StitchCraft's generator is its own, for every platform alike (docs/src/design/determinism.md), as for satin columns (DEV-SAT-002)."
requirements = ["REQ-FILL-TAT-003"]
params = ["random_seed"]

[[deviation]]
id = "DEV-FILL-005"
area = "fill/tatami"
summary = "A tatami fill's route can differ from Ink/Stitch's where the 2 double different stretches of a ring. Each ring's nodes are numbered from its start, and every other stretch between them is doubled from the first. StitchCraft's rings start where the drawing starts them, and Ink/Stitch's where GEOS's overlay starts them. When the 2 starts lie an odd number of nodes apart, the other half of the stretches is doubled, and the walk through the graph takes another route. Every row is still sewn once, back and forth. Where a fill's outlines start, and the order of its parts, which StitchCraft keeps as drawn and Ink/Stitch takes from the same overlay, also decide where a fill ends before another fill whose area holds an outline's start (REQ-GEN-003)."
reason = "Ink/Stitch's rings come out of GEOS's set_precision, read at d59c9ab (lib/elements/fill_stitch.py), and probing shapely 2.2.0 with random polygons found no simple rule for where it starts them: not the drawn start, and not one fixed corner. StitchCraft's region keeps the drawing's start (REQ-FILL-001), and the routing is Ink/Stitch's from there (lib/stitches/tatami_fill.py)."
requirements = ["REQ-FILL-TAT-001", "REQ-GEN-003"]

[[deviation]]
id = "DEV-FILL-006"
area = "fill/tatami"
summary = "Where a tatami fill's graph has nodes of odd degree, StitchCraft pairs them so that the needle's way between pairs is shortest in all and joins each pair with an edge, and the needle travels that way in running stitches. Ink/Stitch adds paths between them with its graph library, counted in edges, and a row on such a path is sewn again as a row. Between 2 rings StitchCraft's needle travels under the rows, as Ink/Stitch's travels from the start to the end (REQ-FILL-TAT-005), and with underpath off along rings and rows, the shortest way, where Ink/Stitch's, travelling along the outline only, sews the rows on its way from the start to the end as rows. A start or end nearest a ring no row reaches is taken to the nearest ring a row reaches, where Ink/Stitch joins it with straight lines sewn as rows."
reason = "No row is sewn twice (REQ-FILL-TAT-001): a second row on top of the first thickens the fill in a stripe. Ink/Stitch's behaviour was read at d59c9ab (lib/stitches/tatami_fill.py: graph_make_valid, find_stitch_path, insert_node), and networkx's eulerize, which it calls, at its documented API."
requirements = ["REQ-FILL-TAT-001"]

[[deviation]]
id = "DEV-FILL-007"
area = "fill/tatami"
summary = "Travel under a tatami fill's rows follows Ink/Stitch's lines and costs, and its way can differ in 4 details. Where 2 ways cost the same, StitchCraft's search goes on from the lower-numbered of 2 nodes as near, where Ink/Stitch's graph library goes on from the one it queued first, so the 2 can take different ways. The rings the costs measure from are simplified within 0.5 mm by StitchCraft's own rule, which keeps the first of 2 points as far from a line. Before the way is smoothed it is cut into points 10 px apart by StitchCraft's running stitch, which puts a point on each corner of the way, where Ink/Stitch's evenly spaced points may cut a corner by up to 4 px. Where no line joins 2 points, as for a hole too small for any line to reach, the needle runs along the rings and rows, where Ink/Stitch goes straight."
reason = "The search, the simplification and the running stitch are StitchCraft's own, the same on every platform (docs/src/design/determinism.md), and the lines and their costs are Ink/Stitch's. Ink/Stitch travels between 2 rings only from the fill's start to its end, before any row is sewn, but StitchCraft also travels between rings to pair nodes (DEV-FILL-006), after rows are sewn, where a straight way would cross them and show. Ink/Stitch's behaviour was read at d59c9ab (lib/stitches/tatami_fill.py: build_travel_graph, process_travel_edges, build_travel_edges, travel; lib/utils/smoothing.py; lib/utils/clamp_path.py; lib/stitches/running_stitch.py), and networkx's shortest_path at its documented API."
requirements = ["REQ-FILL-TAT-005"]

[[deviation]]
id = "DEV-FILL-008"
area = "fill/tatami"
summary = "Where fill_underlay_inset_mm, or a negative expand_mm, cuts a part into pieces, the pieces are sewn in order of their point of least x, and of least y among pieces level with each other, each with its least x within a nanometre of the one before. GEOS gives them in the order it walks its graph, which Ink/Stitch sews them in. Of 2,000 random polygons grown or shrunk, 85 gave 2 or more pieces, and 81 of those came in the same order; the 4 others had a sliver among their pieces. For pieces level at their least x, GEOS's order turns on where the ring's points start: 2 squares one above the other, shrunk apart, give the lower first when the ring is listed from the bottom and the upper first when it is listed from the top, and 310 of 400 random such shapes, listed from random points, gave the lower first. Each piece's top rows start at the point nearest the needle after the piece before, where Ink/Stitch starts every piece's top rows nearest the needle as it was before the first."
reason = "The order of least x is GEOS's in all but those few cases, and lowest first is the order GEOS gives most often for pieces level at their least x, without walking a graph as GEOS walks its own (conformance/oracle/buffer.py). Starting each piece where the last ended keeps the needle's way between pieces short, where Ink/Stitch's needle goes back to near the first piece's start (lib/elements/fill_stitch.py at d59c9ab, to_stitch_groups)."
requirements = ["REQ-FILL-TAT-012"]
params = ["expand_mm", "fill_underlay_inset_mm"]

[[deviation]]
id = "DEV-FILL-009"
area = "fill/tatami"
summary = "A fill's pull compensation lengthens each top row at its ends, and the part keeps its holes and its pieces as drawn. Ink/Stitch rebuilds the part round the lengthened rows instead: each is widened by half the row spacing and 0.01 px with round ends, the widened rows are joined, and the outline is smoothed. Its rows then reach past the compensation by up to half a row spacing, less what the smoothing takes off. A hole of less than a row spacing squared, or one the widened rows close over, is filled. Where the widened rows fall into pieces, only the largest is kept, so a part whose rows a neck too thin for a row divides loses all but its largest side."
reason = "Pull compensation makes up for the thread pulling the fabric in along each row, so it belongs at the rows' ends; the holes, gaps and pieces are the designer's (lib/stitches/tatami_fill.py at d59c9ab, adjust_shape_for_pull_compensation; ensure_polygon in lib/utils/geometry.py; smooth_path in lib/utils/smoothing.py)."
requirements = ["REQ-FILL-TAT-006"]
params = ["pull_compensation_mm", "pull_compensation_percent"]

[[deviation]]
id = "DEV-FILL-010"
area = "fill/tatami"
summary = "Each gap-fill row is the next row of the grid past the stretch's last row, the stretch of its segment beside the gap-fill row before it, or the last row for the first, so it stops at the part's edge, and the rows stop where the part ends. Ink/Stitch repeats the last row, moved a spacing further each time and keeping its length, so a repeat can run outside the part; its spacing is the distance between the last 2 rows, where the grid's rows follow the end row spacing. The hops between gap-fill rows and the way back are running stitches kept inside the part as travel is, where Ink/Stitch stitches them as rows, straight."
reason = "Rows outside the part sew where the design has none (REQ-FILL-TAT-007). Ink/Stitch's gap fill: lib/stitches/tatami_fill.py at d59c9ab, fill_gaps and fill_gap."
requirements = ["REQ-FILL-TAT-007"]
params = ["gap_fill_rows"]

[[deviation]]
id = "DEV-FILL-011"
area = "fill/tatami"
summary = "With underpath off, or in a part the gratings of lines miss, the needle travels between 2 points of one ring the shorter way round it, by length, and on a tie the way that does not pass the ring's start. Ink/Stitch's travel along the outline counts nodes instead: its graph has a node every CSS pixel along the outline's sides, and at their corners and the rows' ends, and its edges carry no length, so the way with fewer nodes is taken. That is about the shorter way, but a way past many short sides, as round a curve drawn in short pieces, has more nodes for its length, and the way with fewer nodes can be the longer."
reason = "The shorter way sews the least thread for the same travel, and counting nodes is how Ink/Stitch's graph is built, not a choice about sewing. Ink/Stitch's travel was read at d59c9ab (lib/stitches/tatami_fill.py: build_travel_graph, add_boundary_travel_nodes, travel), and networkx's shortest_path, which weighs an edge without a weight as 1, at its documented API."
