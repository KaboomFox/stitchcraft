summary = "Each clone applies its own settings and copies its source's commands wherever it is drawn. Ink/Stitch resolves the clones in a clone's source first, each in its own place, and then applies only their angle settings: there a clone sews though its clone setting is off, its trim, stop and shortest stitch and jump don't apply, and the commands it copies stay where it moves them, not where the clone round it moves their shapes. It also copies a command whose connector is a child of the root, not in a group, to its old place. And it gives everything a clone sews the clone's shortest stitch and jump, the design's when the clone sets none, where StitchCraft keeps the source's."
reason = "A clone sews as its source sews, with the settings it sets itself, and a clone of a clone as a clone of that, moved again (REQ-SVG-012). Ink/Stitch at d59c9ab, run as a black box (ADR-0001, decision 6), sewed an inner clone whose clone setting is off inside another, started a clone of a clone at the start command its inner clone moved, left a command written at the root where its source is, and jumped after a clone of a line whose shortest jump of 20 mm sews the same move on. It resolves clones in lib/elements/clone.py and sets every stitch group of a clone to the clone's shortest stitch and jump in lib/elements/element.py (embroider), where it keeps their trims and stops."
requirements = ["REQ-SVG-012"]
