# Intended differences from Ink/Stitch's behaviour, each with a reason and the requirement that
# motivates it. Conformance level L3 (Ink/Stitch differential, from M8) reads this file so that a
# documented deviation is reported as such instead of as a failure.
#
# [[deviation]]
# id = "DEV-FILL-TAT-001"
# area = "fill/tatami"
# summary = "Pull compensation extends rows at their ends instead of buffering the whole shape."
# reason = "Preserves holes and gaps the designer left on purpose."
# requirements = ["REQ-FILL-TAT-006"]

[[deviation]]
id = "DEV-LCK-001"
area = "plan/locks"
summary = "Each Ink/Stitch lock id is accepted, with StitchCraft's own shapes behind the ids and the same intent. The half stitch goes forth and back twice over half the first stitch, and back_forth twice over one step, where Ink/Stitch's go out two steps and back. The drawn shapes are new. A custom lock drawn as an SVG path sews the half stitch, with SC-W0503, until M8."
reason = "Clean room: the shapes come from StitchCraft's design (docs/src/design/algorithms/locks.md), never from Ink/Stitch's lock data (ADR-0001). Each shape lies on the stitching it secures, and its stitches are at least 0.2 mm long. Machine checkpoint MC-2 (TS-04) checks that they hold."
requirements = ["REQ-LCK-002"]

[[deviation]]
id = "DEV-LCK-002"
area = "plan/locks"
summary = "Locks of steps follow the stitching round its corners, as Ink/Stitch's custom steps do. They differ in 2 places. Past the end of stitching shorter than the lock, they go straight on from the last stitch, where Ink/Stitch puts the rest of the lock on the last needle point. Where following a sharp turn would sew a stitch shorter than 0.2 mm, the lock is sewn straight along the first (or last) stitch, with SC-W0502, where Ink/Stitch follows the turn."
reason = "No lock stitch is shorter than 0.2 mm (REQ-LCK-002), so the needle never goes back into the hole it just left. Ink/Stitch's behaviour was read at d59c9ab (lib/stitch_plan/lock_stitch.py), docs/src/design/algorithms/locks.md."
requirements = ["REQ-LCK-004"]

[[deviation]]
id = "DEV-RUN-001"
area = "strokes/running"
summary = "Corners are joins between segments that turn by more than 30°. Ink/Stitch takes turns of 45° or more at any point of the flattened path, curves included, and skips one closer than twice the tolerance to the previous."
reason = "A needle on every sharper join keeps drawn shapes crisp, and a curve's own bend is followed within the tolerance instead (docs/src/design/algorithms/strokes.md)."
requirements = ["REQ-RUN-003", "REQ-SAT-010", "REQ-SAT-011"]

[[deviation]]
id = "DEV-RUN-002"
area = "strokes/running"
summary = "Stitches are spread evenly along the path between corners, then split where they stray beyond the tolerance. Ink/Stitch makes each stitch as long as the tolerance allows, measured straight, and divides what is left evenly again after each one."
reason = "Equal stitches between corners with no short leftover, and the tolerance met exactly where the path needs it."
requirements = ["REQ-RUN-001", "REQ-RUN-002", "REQ-SAT-010", "REQ-SAT-011"]

[[deviation]]
id = "DEV-RUN-003"
area = "strokes/running"
summary = "No running stitch is shorter than the shortest stitch, measured straight: corners keep their needle before other points do, a stitch a drop makes too long is split, and lengths below twice the shortest stitch are raised (SC-W0402). Ink/Stitch's running stitch has no shortest stitch; its plan later drops stitches of at most 0.1 mm (its default), keeping the stitch before."
reason = "The machine's shortest stitch is a limit: honoured where the stitches are placed, it never costs a corner or leaves an over-long stitch."
requirements = ["REQ-RUN-001", "REQ-RUN-003", "REQ-SAT-010", "REQ-SAT-011"]

[[deviation]]
id = "DEV-RUN-004"
area = "strokes/running"
summary = "A part of a path that is a single point, or too small for the shortest stitch, is not stitched and is reported (SC-W0401). Ink/Stitch stitches a single-point path as a short line."
reason = "No stitches the design does not draw, and nothing left out without a word."
requirements = ["REQ-RUN-001"]

[[deviation]]
id = "DEV-FIN-001"
area = "plan/finalize"
summary = "StitchCraft fits every stitch to the machine: it leaves out needle points less than their element's shortest stitch from the one before, never less than the machine's (0.3 mm on the Brother), keeping the ends of each run of stitches, and splits stitches longer than the machine's longest. Ink/Stitch drops stitches no longer than the element's own shortest stitch, else 0.1 mm, and splits nothing."
reason = "The machine profile says what the machine sews well; a stitch outside it hammers one hole, snags, or is refused (docs/src/design/engine-pipeline.md › Finalize)."
requirements = ["REQ-FIN-001"]

[[deviation]]
id = "DEV-SAT-001"
area = "satin"
summary = "A rung that crosses a rail more than once, or runs along a rail for a while, is left out (SC-W0207). Ink/Stitch leaves a rung out only when it meets the two rails at more than 2 points in all, and uses one that crosses one rail twice and misses the other, or runs along a rail, at one of its crossings. A subpath that does not move is left out as a point before rails are told from rungs (SC-W0205), where Ink/Stitch counts a line of zero length among the subpaths."
reason = "Which of its crossings such a rung means is not clear, so StitchCraft does not guess, and the warning names the rung. A line of zero length is neither a rail nor a rung. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/satin_column.py)."
requirements = ["REQ-SAT-005"]

[[deviation]]
id = "DEV-SAT-002"
area = "satin"
summary = "Random satin widths, spacing and splits are drawn from StitchCraft's generator (SplitMix64, seeded from the element's id and random_seed), so the values differ from Ink/Stitch's for the same seed. The ranges are Ink/Stitch's, and so is when a width or a spacing is drawn. Ink/Stitch draws each stitch's splits from a generator of the stitch's own, where StitchCraft draws them from the element's, in the order the stitches are sewn."
reason = "Every random value in StitchCraft comes from one fully specified generator, the same on every platform and never changed by a dependency (docs/src/design/determinism.md). Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/satin_processor.py)."
requirements = ["REQ-SAT-007"]

[[deviation]]
id = "DEV-SAT-003"
area = "satin"
summary = "With a random split phase, a split within the element's shortest stitch of a stitch's end is left out, and the element's shortest stitch is never shorter than the machine's (0.3 mm on the Brother). Ink/Stitch uses the element's own shortest stitch or the document's."
reason = "The machine's shortest stitch is a limit (DEV-FIN-001). A split nearer an end would sew a stitch the machine does not sew well, which finalizing would leave out anyway. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/split_points.py)."
requirements = ["REQ-SAT-003"]

[[deviation]]
id = "DEV-SAT-004"
area = "satin"
summary = "The centre walk underlay keeps within center_walk_underlay_stitch_tolerance_mm of its line, and follows points that far apart. Ink/Stitch declares that parameter but uses running_stitch_tolerance_mm in its place, the tolerance of the satin's travel to its start and end. Both are 0.2 mm unless a file sets them."
reason = "A setting does what its name says, and a file that sets neither sews the same in both programs. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/satin_column.py)."
requirements = ["REQ-SAT-010"]

[[deviation]]
id = "DEV-SAT-005"
area = "satin"
summary = "A satin column's travel takes the first of the lengths running_stitch_length_mm gives. Ink/Stitch reads a satin's value as one number, and sews a value of several with 2.5 mm, the default."
reason = "The key is declared once, as the running stitch's list of lengths, and a stroke turned into a satin column keeps its value. Its first length is the one the stroke started with. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/satin_column.py)."
requirements = ["REQ-SAT-004"]

[[deviation]]
id = "DEV-SAT-006"
area = "satin"
summary = "A satin column's running_stitch_tolerance_mm defaults to 0.2 mm, the value Ink/Stitch sews when a file sets none. Ink/Stitch's settings window shows 0.1 mm."
reason = "The key is declared once, as the running stitch's, and its default is what both sew for a file without it. Ink/Stitch declares 0.1 mm but reads a missing value as 0.2 mm, read at d59c9ab (lib/elements/satin_column/satin_column.py)."
requirements = ["REQ-SAT-013", "REQ-SAT-014"]

[[deviation]]
id = "DEV-SAT-007"
area = "satin"
summary = "A satin column drawn as one path keeps the 2 rails made from its line as its rails, and each rung made pairs the points where it crosses them. Where 2 parts of the line join, the rung pairs the first points of the second part's rails. Ink/Stitch hands the rails and rungs back to its satin column as subpaths, which tells rails from rungs again by where they meet and how long they are, and adds a rung across the gap where parts join, 1.2 times as long, pairing where it crosses the rails. With 2 rungs or more on a column shorter than its rungs, it takes 2 rungs as the rails, and a line that crosses itself can make a rung meet more lines than a rail does. Ink/Stitch also keeps the first part of a line cut in half when its offset vanishes to one side, with the rail it has, where StitchCraft leaves that part out with SC-W0213, as it leaves out later ones."
reason = "The rails made are known, so they need no guessing, and a column is never sewn between a rail and a rung. Where 2 parts meet on a straight stretch, the gap rung crosses the rails at those first points, and both sew alike. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/satin_column/satin_column.py, lib/elements/utils/stroke_to_satin.py). The case req_sat_017_the_rails_made_stay_the_rails (crates/stitchcraft-engine/tests/satin_centre_line.rs) draws the lines Ink/Stitch would make for a dash 3.3 mm long and 5 mm wide, and its rule for drawn columns takes the 2 rungs as the rails."
requirements = ["REQ-SAT-016", "REQ-SAT-017"]

[[deviation]]
id = "DEV-FILL-001"
area = "fill"
summary = "A fill's region follows its fill rule. Ink/Stitch takes the subpath of the largest area as the outline and every other subpath as a hole, whatever the fill rule, and repairs a shape that is not valid by the even-odd rule. Where the nonzero rule fills a part that the subpaths wind round twice the same way, such as a ring drawn inside another the same way round, or the overlap of 2 shapes drawn the same way round, StitchCraft fills it (SC-I0306) and Ink/Stitch leaves it empty."
reason = "A fill sews the area the drawing shows, as an SVG renderer paints it (REQ-FILL-001). The information names each fill that differs, and its fill rule set to even-odd makes it sew alike in both. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/fill_stitch.py)."
requirements = ["REQ-FILL-001"]

[[deviation]]
id = "DEV-FILL-002"
area = "fill"
summary = "A subpath of fewer than 3 distinct points bounds nothing and is left out of the fill's region. Ink/Stitch makes a subpath of fewer than 3 points, as it flattens them, a triangle with 2 sides of 1 CSS pixel at its first point, which cuts a hole that small where it lies inside the fill."
reason = "A fill sews the area the drawing shows (REQ-FILL-001), and an SVG renderer paints nothing for such a subpath. Ink/Stitch's behaviour was read at d59c9ab (lib/elements/fill_stitch.py)."
requirements = ["REQ-FILL-001"]

[[deviation]]
id = "DEV-FILL-003"
area = "fill/tatami"
summary = "With end_row_spacing_mm, the step from row to row changes from the row spacing to the end spacing over the part's height, measured from the first row, and stays at the end spacing beyond it. Ink/Stitch carries the change on past the height, which reaches the rows within a row spacing of the part's far side when the first row lies before the part. With an end spacing smaller than the row spacing, over a part a few rows tall, the steps then shrink towards 0 and the rows pile up short of the far side without end."
reason = "Every fill's rows end, and a fading fill keeps the density it fades to. Elsewhere the rows lie where Ink/Stitch lays them. Ink/Stitch's behaviour was read at d59c9ab (lib/stitches/fill.py), and its step formula, worked through for a part 1 px tall with rows 1 px apart shrinking to 0.1 px and its first row 0.5 px before it, stacks rows towards 1.11 px for ever."
requirements = ["REQ-FILL-TAT-002"]

[[deviation]]
id = "DEV-FILL-004"
area = "fill/tatami"
summary = "A tatami fill's random stitch lengths are drawn from StitchCraft's generator (SplitMix64, seeded from the element's id and random_seed), in the order its row segments are sewn, so the values differ from Ink/Stitch's for the same seed. The ranges are Ink/Stitch's: the first point a share of the longest stitch from the segment's start, and each next one a stitch on, longer or shorter by up to the jitter."
reason = "Ink/Stitch draws from a generator of each segment's own, keyed by the segment's place in the sewing order (lib/stitches/tatami_fill.py, lib/stitches/running_stitch.py at d59c9ab). StitchCraft's generator is its own, for every platform alike (docs/src/design/determinism.md), as for satin columns (DEV-SAT-002)."
requirements = ["REQ-FILL-TAT-003"]

[[deviation]]
id = "DEV-SVG-001"
area = "svg"
summary = "A stroke-width in percent, em or ex is read as a viewer reads it: a percentage of the viewport's diagonal over √2, an em as 16 user units and an ex as 8. A stroke-linejoin keyword is read in any case. Ink/Stitch reads such a width as 0, which sews a satin column drawn as one path as a stroke, and reads a join that is not written in lower case as unset."
reason = "The SVG reader takes the drawing as a viewer shows it (docs/src/design/svg-input.md), and a column is then as wide as its stroke looks. Ink/Stitch converts lengths with inkex, which has no factor for %, em or ex and gives 0 for them (inkex 1.4.1, inkex/units.py), and compares the join with lower-case names (lib/svg/styles.py at d59c9ab)."
requirements = ["REQ-SVG-004"]
