# Ink/Stitch parameters (facts only) — snapshot of inkstitch/inkstitch@d59c9ab.
# Source of docs/src/design/inkstitch-compat-contract.md (`cargo xtask docs`).
# Do not add descriptions: they are GPL text. StitchCraft's help text lives in its registry.
# `applies_to` lists stitch types, or the values of the setting that shows the parameter (a lock shape,
# a split method). `default` is the value Ink/Stitch's settings window shows. A row has a `fallback` where
# Ink/Stitch's code sews another value for a file that sets none, and the registry's default is compared
# with that. A row has `read_by` where stitch types the window does not show it for read it as they sew:
# every fill method but legacy fill and cross stitch sews the tatami fill's underlay, which reads `angle`
# (its default angle is 90° from it), `running_stitch_length_mm`, `running_stitch_tolerance_mm` and
# `staggers`, and `row_spacing_mm` and `max_stitch_length_mm` where its own are not set (lib/elements/
# fill_stitch.py at d59c9ab: to_stitch_groups, do_underlay, fill_underlay_angle,
# fill_underlay_row_spacing, fill_underlay_max_stitch_length), and a method's own sewing reads what its
# `do_<method>` function takes from the element, as the circular fill reads `skip_last`, and what the
# functions it hands the element to take, as the tartan fill reads it too. `phase` and `milestone`
# are StitchCraft's plan for it, both `—` when it has none. Checked
# field by field against that commit's declarations and getters with
# `python3 -I conformance/inkstitch/check_params.py PATH/TO/INKSTITCH`; run it again when moving to a
# newer commit.

