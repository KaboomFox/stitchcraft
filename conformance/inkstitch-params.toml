# Ink/Stitch's commands (`lib/commands.py`): a <use> of the symbol `inkstitch_<name>`. `tied_to` is where
# one applies: the object a connector ties it to, every layer it is in, or the whole document. What
# StitchCraft does with each comes from its SVG adapter (`stitchcraft_svg::inkstitch::COMMANDS`).

[[command]]
name = "starting_point"
tied_to = "object"

[[command]]
name = "ending_point"
tied_to = "object"

[[command]]
name = "target_point"
tied_to = "object"

[[command]]
name = "autoroute_start"
tied_to = "object"

[[command]]
name = "autoroute_end"
tied_to = "object"

[[command]]
name = "stop"
tied_to = "object"

[[command]]
name = "trim"
tied_to = "object"

[[command]]
name = "ignore_object"
tied_to = "object"

[[command]]
name = "satin_cut_point"
tied_to = "object"

[[command]]
name = "ignore_layer"
tied_to = "layer"

[[command]]
name = "origin"
tied_to = "document"

[[command]]
name = "stop_position"
tied_to = "document"

