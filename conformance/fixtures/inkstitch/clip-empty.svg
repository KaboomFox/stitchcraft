<?xml version="1.0" encoding="UTF-8"?>
<!-- An empty clip path on a red square, which a viewer hides, and a blue square below it. Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <metadata><inkstitch:inkstitch_svg_version>4</inkstitch:inkstitch_svg_version></metadata>
  <defs><clipPath id="nothing"/></defs>
  <rect id="hidden" x="10" y="10" width="30" height="30" fill="#ed171f" clip-path="url(#nothing)"/>
  <rect id="shown" x="10" y="50" width="30" height="30" fill="#0a55a3"/>
</svg>
