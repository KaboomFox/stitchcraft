<?xml version="1.0" encoding="UTF-8"?>
<!-- A red bar 60 x 10 mm filled at its default angle, and a clone of it turned 45 degrees right about the bar's
     middle and moved below it. The clone's rows turn with it, along its long sides as the bar's lie along its
     own. Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <metadata>
    <inkstitch:inkstitch_svg_version>4</inkstitch:inkstitch_svg_version>
  </metadata>
  <rect id="bar" x="20" y="10" width="60" height="10" fill="#ed171f"/>
  <use id="turned" xlink:href="#bar" transform="translate(0 50) rotate(45 50 15)"/>
</svg>
