<?xml version="1.0" encoding="UTF-8"?>
<!-- A satin column clipped to its left half, which both programs sew whole, and a red square below it. Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <metadata><inkstitch:inkstitch_svg_version>4</inkstitch:inkstitch_svg_version></metadata>
  <defs><clipPath id="half"><rect x="0" y="0" width="30" height="100"/></clipPath></defs>
  <path id="column" fill="none" stroke="#0a55a3" stroke-width="0.2" d="M 10,20 L 50,20 M 10,26 L 50,26"
        inkstitch:satin_column="true" clip-path="url(#half)"/>
  <rect id="square" x="10" y="40" width="20" height="20" fill="#ed171f"/>
</svg>
