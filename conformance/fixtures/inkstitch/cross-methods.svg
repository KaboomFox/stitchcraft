<?xml version="1.0" encoding="UTF-8"?>
<!-- Cross stitch fills of the other methods, each trimmed after. In the first row, each full cross's flipped variant on the canvas's 3 mm grid: upright crosses on a square 9 mm wide, dense upright crosses on one grown by 0.1 mm, double crosses of 2 threads on an L, and Smyrna crosses of 2 threads on a rectangle. In the second row, turned grids: simple crosses on a square under the canvas's grid turned 20° about the point its offset of 1 and 0.5 mm names, flipped simple crosses on a square turned 45° with its grid from its own corner, and upright crosses on a rectangle turned -15° so too. In the third row, half crosses of 3 threads: round a square hole, flipped along a band whose cells meet only at their corners, on a part whose thin middle leaves 2 pieces of cells, and on a square turned 30° with its grid. Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="80mm" viewBox="0 0 100 80">
  <metadata><inkstitch:inkstitch_svg_version>4</inkstitch:inkstitch_svg_version></metadata>
  <path id="upright-flipped" d="M 10,10 H 19 V 19 H 10 Z" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_stitch_method="upright_cross_flipped" inkstitch:trim_after="true"/>
  <path id="dense-flipped" d="M 25,10 H 34 V 19 H 25 Z" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_stitch_method="dense_upright_cross_flipped" inkstitch:expand_mm="0.1"
        inkstitch:trim_after="true"/>
  <path id="double-flipped" d="M 40,10 H 43 V 16 H 49 V 19 H 40 Z" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_stitch_method="double_cross_flipped" inkstitch:cross_thread_count="2"
        inkstitch:trim_after="true"/>
  <path id="smyrna-flipped" d="M 55,10 H 64 V 16 H 55 Z" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_stitch_method="smyrna_cross_flipped" inkstitch:cross_thread_count="2"
        inkstitch:trim_after="true"/>
  <path id="turned-canvas" d="M 10,30 H 22 V 42 H 10 Z" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_rotation="20" inkstitch:cross_offset_mm="1 0.5" inkstitch:trim_after="true"/>
  <path id="turned-own" d="M 0,0 H 12 V 12 H 0 Z" transform="translate(40,30) rotate(45)" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_stitch_method="simple_cross_flipped" inkstitch:cross_rotation="45"
        inkstitch:canvas_grid_origin="false" inkstitch:trim_after="true"/>
  <path id="turned-upright" d="M 0,0 H 12 V 9 H 0 Z" transform="translate(62,32) rotate(-15)" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_stitch_method="upright_cross" inkstitch:cross_rotation="-15"
        inkstitch:canvas_grid_origin="false" inkstitch:trim_after="true"/>
  <path id="half-ring" d="M 10,55 H 22 V 67 H 10 Z M 13,58 V 64 H 19 V 58 Z" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_stitch_method="half_cross" inkstitch:cross_thread_count="3"
        inkstitch:trim_after="true"/>
  <path id="half-band" d="M 28.5,55 H 31.5 L 40.5,64 H 37.5 Z" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_stitch_method="half_cross_flipped" inkstitch:cross_thread_count="3"
        inkstitch:trim_after="true"/>
  <path id="half-pieces" d="M 50,55 H 56 V 58 H 62 V 55 H 68 V 61 H 62 V 59 H 56 V 61 H 50 Z" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_stitch_method="half_cross" inkstitch:cross_thread_count="3"
        inkstitch:trim_after="true"/>
  <path id="half-turned" d="M 0,0 H 9 V 9 H 0 Z" transform="translate(80,55) rotate(30)" fill="#ed171f"
        inkstitch:fill_method="cross_stitch" inkstitch:cross_stitch_method="half_cross" inkstitch:cross_rotation="30"
        inkstitch:canvas_grid_origin="false" inkstitch:cross_thread_count="3"/>
</svg>
