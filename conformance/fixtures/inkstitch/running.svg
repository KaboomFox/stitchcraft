<?xml version="1.0" encoding="UTF-8"?>
<!-- A black line along a wave, sewn as a running stitch at the defaults. Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <metadata><inkstitch:inkstitch_svg_version>4</inkstitch:inkstitch_svg_version></metadata>
  <path id="wave" fill="none" stroke="#000000" stroke-width="0.2"
        d="M 10,50 C 20,30 30,30 40,50 C 50,70 60,70 70,50"/>
</svg>
