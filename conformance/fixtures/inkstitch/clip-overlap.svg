<?xml version="1.0" encoding="UTF-8"?>
<!-- A clip path of 2 squares that overlap, on a red square that covers both: a viewer shows both squares, their overlap too. Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <metadata><inkstitch:inkstitch_svg_version>4</inkstitch:inkstitch_svg_version></metadata>
  <defs><clipPath id="two"><rect x="10" y="10" width="30" height="30"/><rect x="25" y="25" width="30" height="30"/></clipPath></defs>
  <rect id="square" x="0" y="0" width="70" height="70" fill="#ed171f" clip-path="url(#two)"/>
</svg>
