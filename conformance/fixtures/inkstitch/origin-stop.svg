<?xml version="1.0" encoding="UTF-8"?>
<!-- Three red discs of one thread, the first 2 stopped after by Ink/Stitch's stop commands, each tied to its
     disc by a connector. Ink/Stitch's origin command lies below the discs, in a layer that is moved and a
     group that is scaled, and its stop_position command to their right, in a hidden layer. The symbols'
     drawings are placeholders. Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <metadata><inkstitch:inkstitch_svg_version>4</inkstitch:inkstitch_svg_version></metadata>
  <defs>
    <symbol id="inkstitch_stop"><circle r="2" fill="#808080"/></symbol>
    <symbol id="inkstitch_origin"><circle r="2" fill="#808080"/></symbol>
    <symbol id="inkstitch_stop_position"><circle r="2" fill="#808080"/></symbol>
  </defs>
  <g id="discs" inkscape:groupmode="layer" inkscape:label="Discs">
    <circle id="first" cx="20" cy="20" r="8" fill="#ed171f"/>
    <g id="command_group1">
      <path id="command_connector1" d="M 30,35 25,25" style="fill:none;stroke:#000000;stroke-opacity:0.5"
            inkscape:connection-start="#use1" inkscape:connection-end="#first" inkscape:connector-type="polyline"/>
      <use id="use1" xlink:href="#inkstitch_stop" x="30" y="35"/>
    </g>
    <circle id="second" cx="50" cy="20" r="8" fill="#ed171f"/>
    <g id="command_group2">
      <path id="command_connector2" d="M 60,35 55,25" style="fill:none;stroke:#000000;stroke-opacity:0.5"
            inkscape:connection-start="#use2" inkscape:connection-end="#second" inkscape:connector-type="polyline"/>
      <use id="use2" xlink:href="#inkstitch_stop" x="60" y="35"/>
    </g>
    <circle id="third" cx="80" cy="20" r="8" fill="#ed171f"/>
  </g>
  <g id="placed" inkscape:groupmode="layer" inkscape:label="Origin" transform="translate(10,40)">
    <g id="doubled" transform="scale(2)">
      <use id="origin" xlink:href="#inkstitch_origin" x="15" y="5"/>
    </g>
  </g>
  <g id="hidden" inkscape:groupmode="layer" inkscape:label="Stop position" style="display:none">
    <use id="stop_position" xlink:href="#inkstitch_stop_position" x="90" y="45"/>
  </g>
</svg>
