<?xml version="1.0" encoding="UTF-8"?>
<!-- A blue zigzag stroke 3 mm wide in a file of version 2, with a pull compensation of 1 mm, which Ink/Stitch's update halves for each side: it sews 4 mm wide, where a zigzag stroke of a file of today's version reads no pull compensation but its own, and would sew 3 mm wide. Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <metadata><inkstitch:inkstitch_svg_version>2</inkstitch:inkstitch_svg_version></metadata>
  <path id="zigzag" fill="none" stroke="#0b3d91" stroke-width="3" d="M 10,20 L 80,20 C 90,20 90,50 80,50 L 40,50"
        inkstitch:stroke_method="zigzag_stitch" inkstitch:pull_compensation_mm="1"/>
</svg>
