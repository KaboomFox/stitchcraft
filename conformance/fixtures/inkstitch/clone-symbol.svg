<?xml version="1.0" encoding="UTF-8"?>
<!-- A symbol whose viewBox, 0 0 20 10, holds a red bar 20 x 10, shown by a clone 80 mm wide: a viewer, and
     StitchCraft, scale it 4 times, to 80 x 40 mm. Ink/Stitch sews the bar 20 x 10 mm at the clone's place.
     Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <metadata>
    <inkstitch:inkstitch_svg_version>4</inkstitch:inkstitch_svg_version>
  </metadata>
  <defs>
    <symbol id="bar" viewBox="0 0 20 10"><rect width="20" height="10" fill="#ed171f"/></symbol>
  </defs>
  <use id="shown" xlink:href="#bar" x="10" y="10" width="80" height="40"/>
</svg>
