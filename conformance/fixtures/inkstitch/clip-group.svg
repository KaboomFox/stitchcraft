<?xml version="1.0" encoding="UTF-8"?>
<!-- A group's clip path and a shape's own: a red square in a group clipped to x below 40, its own clip path to y below 40, sews the 30 mm square where both overlap, and a blue running stitch in the group sews its 2 pieces left of x 40. Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <metadata><inkstitch:inkstitch_svg_version>4</inkstitch:inkstitch_svg_version></metadata>
  <defs>
    <clipPath id="left" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="40" height="100"/></clipPath>
    <clipPath id="top" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="100" height="40"/></clipPath>
  </defs>
  <g id="group" clip-path="url(#left)">
    <rect id="square" x="10" y="10" width="40" height="40" fill="#ed171f" clip-path="url(#top)"/>
    <path id="line" d="M 10,60 L 50,60 L 50,70 L 10,70" fill="none" stroke="#0a55a3" stroke-width="0.3"/>
  </g>
</svg>
