<?xml version="1.0" encoding="UTF-8"?>
<!-- A closed zigzag stroke, a circle, clipped to y below 25: 2 pieces, the circle starting at its top, inside the clip. Written for StitchCraft's Ink/Stitch differential cases (conformance L3). -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:inkstitch="http://inkstitch.org/namespace"
     width="100mm" height="100mm" viewBox="0 0 100 100">
  <metadata><inkstitch:inkstitch_svg_version>4</inkstitch:inkstitch_svg_version></metadata>
  <defs><clipPath id="top"><rect x="0" y="0" width="100" height="25"/></clipPath></defs>
  <circle id="ring" cx="30" cy="30" r="20" fill="none" stroke="#0a55a3" stroke-width="3"
          inkstitch:stroke_method="zigzag_stitch" clip-path="url(#top)"/>
</svg>
