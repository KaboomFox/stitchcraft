# Mutants that change nothing a test could observe. A pull request may leave these in the lines it
# changes (`cargo xtask mutants --changed`); any other mutant there that no test notices fails it.

[[equivalent]]
file = "crates/stitchcraft-svg/src/path.rs"
mutant = "replace < with <= in arc"
line = "if large_arc && turn < FRAC_PI_2 {"
why = "a large arc turns at least half way round, so no turn reaching this test is exactly π/2"

