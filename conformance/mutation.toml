why = "a way of no length, past an open line's end, makes the cosine 0 over 0, which is not a number, and a cosine that is not a number is no corner, as no cosine is"

[[equivalent]]
file = "crates/stitchcraft-engine/src/testsheets/pictures.rs"
mutant = "replace * with / in end"
line = "let (out, on) = ((cos, -sin), (-sin * way, -cos * way));"
why = "the C's 2 ends give `way` as 1 or -1, and multiplying by either gives exactly what dividing by it does"

[[equivalent]]
file = "crates/stitchcraft-engine/src/testsheets/pictures.rs"
mutant = "replace > with >= in end"
line = "let (s, c) = sin_cos(if way > 0.0 { PI * f64::from(k) / f64::from(steps) } else { PI - PI * f64::from(k) / f64::from(steps) });"
why = "the C's 2 ends give `way` as 1 or -1, never 0, so it is more than 0 just when it is at least 0"

