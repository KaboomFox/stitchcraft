# The differences of the glyph differential (M8.6, xtask/src/conformance/fonts/excuses.rs) that the
# deviations ledger explains: each glyph of Ink/Stitch's fonts, sewn alone in Ink/Stitch and in StitchCraft.
# An excuse names the measures it excuses, and `sewn` for a glyph that one program sews and the other doesn't,
# the ledger's entry that explains them (conformance/deviations.toml), and the glyphs it holds for: those
# StitchCraft says a diagnostic of (`codes`, and `saying`, words of its message), whose elements are of a
# stitch type (`types`), all of these types (`only_types`), or set an Ink/Stitch setting to something other
# than nothing or 0 (`settings`), of a font (`fonts`), or named so (`glyphs`). An excuse without them holds for
# every glyph. Where the differential can undo the deviation in Ink/Stitch's file, the excuse holds only when
# the measure then agrees, and with `within_mm` only where each program's thread lies that near the other's.
# Otherwise the next one that holds is tried.

# Each program names a thread by its own entry of Brother's palette: checked by naming Ink/Stitch's threads
# as StitchCraft names them, where both change thread at the same colour blocks.
[[excuse]]
measures = ["threads"]
deviation = "DEV-THREAD-001"

# pystitch's jumps that go nowhere, checked by leaving them out of Ink/Stitch's file.
[[excuse]]
measures = ["trims", "jumps"]
deviation = "DEV-FMT-001"

# Stitches longer than the machine's longest, which StitchCraft splits, and needle points nearer each other
# than its shortest, which it leaves out: checked by fitting Ink/Stitch's so. Honoka's satin columns set an
# underlay of stitches 0.2 mm long, and its 服 takes 3,101 stitches in Ink/Stitch and 1,935 in StitchCraft.
[[excuse]]
measures = ["stitches"]
deviation = "DEV-FIN-001"
codes = ["SC-I0703", "SC-I0504"]

# A setting StitchCraft clamps into its range (SC-W0102) where Ink/Stitch sews it as it is: a satin
# column's random width decrease below 0, which widens it there, in Magnolia bicolor. It comes before the
# random widths, which Magnolia bicolor's satin columns have too, as the closer cause.
[[excuse]]
measures = ["size", "overlap"]
deviation = "DEV-PRM-002"
codes = ["SC-W0102"]
saying = "random_width_decrease_percent"

# Random satin widths and spacing, drawn from StitchCraft's own generator. Magnolia bicolor's !, its random
# widths set to 0 in both programs, overlaps by 0.991. Cats' b widens one rail by up to 100 %, and the widest
# point drawn differs: 25.8 mm wide here, 26.8 mm in Ink/Stitch.
[[excuse]]
measures = ["size", "overlap"]
deviation = "DEV-SAT-002"
settings = ["random_width_increase_percent", "random_width_decrease_percent", "random_zigzag_spacing_percent", "random_split_jitter_percent"]

# StitchCraft's meander tiles are its own.
[[excuse]]
measures = ["stitches", "overlap"]
deviation = "DEV-FILL-018"
types = ["meander_fill"]

# A viewBox of another shape than its page, centred by StitchCraft and not by Ink/Stitch: the fills' rows
# are laid from another point. Cooper Marif's are the only glyph files of the corpus that sew fills so.
[[excuse]]
measures = ["overlap"]
deviation = "DEV-SVG-025"
fonts = ["cooper_marif"]

# Ink/Stitch's stitch patterns, which StitchCraft doesn't apply.
[[excuse]]
measures = ["stitches", "size", "overlap"]
deviation = "DEV-SVG-026"
codes = ["SC-W0802"]
saying = "stitch pattern"

# Running stitches place their needle points otherwise along the same lines, more of them on tight curves
# (and corners, DEV-RUN-001): checked by each program's thread lying within 0.3 mm of the other's. Learning
# curve's ë and Ë sew their dots in manual stitches, whose needle points are the path's in both programs.
[[excuse]]
measures = ["stitches", "overlap"]
deviation = "DEV-RUN-002"
only_types = ["running_stitch", "manual_stitch"]
within_mm = 0.3

# Decadent Flowers Monogram's glyphs are a fill under a redwork running stitch. Sewn apart, the fill of its N
# agrees by every measure, and its redwork takes 5,876 stitches against 4,705, within 0.3 mm of each other.
[[excuse]]
measures = ["stitches"]
deviation = "DEV-RUN-002"
types = ["running_stitch"]
fonts = ["decadent_flowers_monogram"]
within_mm = 0.3

# A move-to with nothing drawn after it, where Ink/Stitch sews a needle point and StitchCraft nothing: checked
# by leaving such needle points out of Ink/Stitch's file, with the jumps and the trim that lead to them. Kum
# Tsoan relief's V ends a path with one, 24 mm above the glyph, and its size is 64.4 × 91.4 mm in Ink/Stitch.
[[excuse]]
measures = ["size", "place", "trims", "jumps", "overlap"]
deviation = "DEV-SVG-011"

# The excuses below explain the glyphs that M8.6's first run of every glyph found differing, by their causes.

# A fill that StitchCraft says runs along its own edge, or that the nonzero rule fills inside twice, which
# Ink/Stitch's repair of its shape fills otherwise. Califragilistic's Ð, ò and ] leave parts empty that
# Ink/Stitch fills, and its ] sews 2,370 stitches there, with 7 trims, where StitchCraft sews 1,791 and 2.
[[excuse]]
measures = ["stitches", "trims", "jumps", "overlap"]
deviation = "DEV-FILL-001"
codes = ["SC-I0306", "SC-I0313"]

# Cross stitch glyphs of Egyptian and Jaquarda Bastarda 9 whose subpaths meet at corners that rounding
# moves 2e-15 to 7e-15 CSS pixels apart. shapely calls the shape not valid, and the repair fills a counter,
# or in the ® leaves a part empty, where no information names the fill: the drawing's own subpaths don't
# run along each other.
[[excuse]]
measures = ["stitches", "overlap"]
deviation = "DEV-FILL-001"
fonts = ["egyptian", "egyptian_small", "jaquarda_bastarda_9"]
glyphs = ["4", "Д", "Ы", "д", "₲", "₵", "◁", "®"]

# A cross stitch fill's parts that reach equally far left, after its shape is repaired and grown: Ink/Stitch
# sews the body of ǘ and ӳ before the accent, and StitchCraft after. Moved 0.1 CSS pixels right, the accent
# goes after the body in both, and both programs sew the same number of stitches.
[[excuse]]
measures = ["stitches"]
deviation = "DEV-FILL-029"
fonts = ["egyptian_small"]
glyphs = ["ǘ", "ӳ"]

# A rung that rounding leaves less than 2e-14 CSS pixels from a rail, which Ink/Stitch takes for a rail. It
# sews AGS Garamond's J across its rung, and calls the column of its Đ not stitchable, writing no file. Its
# V has such a rung too, and agrees.
[[excuse]]
measures = ["stitches", "size", "overlap", "sewn"]
deviation = "DEV-SAT-013"
fonts = ["ags_garamond_latin_grec"]
glyphs = ["J", "Đ"]

# The same in Apex simple, in both its sizes. Ink/Stitch writes no file of the x and the U, which StitchCraft
# didn't sew either before M8.6.
[[excuse]]
measures = ["stitches", "size", "overlap", "sewn"]
deviation = "DEV-SAT-013"
fonts = ["apex_simple_AGS", "apex_simple_small_AGS"]
glyphs = ["q", "x", "U"]

# Satin columns of 2 rings that start apart: Ink/Stitch sews from one ring's start across to a place part of
# the way round the other.
[[excuse]]
measures = ["stitches", "overlap"]
deviation = "DEV-SAT-009"
fonts = ["initials_XL", "alchemy"]
glyphs = [",", "🜂"]

# Travel under a tatami fill's rows, which takes another way in StitchCraft.
[[excuse]]
measures = ["stitches"]
deviation = "DEV-FILL-007"
fonts = ["alchemy"]
glyphs = ["¯"]

# Running stitch outlines whose needle points set the bounds the 2 files are aligned by: the threads lie
# within 0.3 mm of each other, a little apart. Western Light's are fills inside an outline, and its hyphen
# overlaps by 0.89 moved back 0.1 mm. Digory Doodles Bean's & and s and Roaring Twenties' ‘ have satin
# columns too.
[[excuse]]
measures = ["stitches", "overlap"]
deviation = "DEV-RUN-002"
fonts = ["western_light", "digory_doodles_bean", "roaring_twenties_KOR"]
glyphs = ["D", "J", "O", "W", "i", "p", "s", "È", "Ê", "Ð", "à", "è", "ì", "í", "ñ", "ý", "2", "8", "’", "!", "*", "-", "&", "‘"]
within_mm = 0.3

# A satin column's top stitches that start beside where its zigzag underlay left the needle, which Ink/Stitch's
# plan drops within the column's shortest stitch, 0.5 mm in Manga Impact: each tip of its & ends 0.4 mm short.
[[excuse]]
measures = ["size"]
deviation = "DEV-RUN-003"
fonts = ["manga_impact"]
glyphs = ["&"]

# Known differences: follow-up work, not yet explained by the ledger or fixed.

# Ink/Stitch's tartan herringbones, which StitchCraft sews as straight rows until M10.7 and says so
# (SC-W0324). 35 glyphs of Colorful, Emilio 20 tartan and Kum Tsoan tartan set herringbones 1.6 to 5 mm
# wide and differ in their stitches, and 5 of them in their trims and jumps too: Colorful's Œ takes 2,201
# stitches in StitchCraft and 2,862 in Ink/Stitch.
[[known]]
measures = ["stitches", "trims", "jumps"]
follow_up = "M10.7 sews tartan herringbones"
codes = ["SC-W0324"]

# Colorful's ’: its S-stitch satin column, sewn alone without the glyph's tartan, overlaps Ink/Stitch's by
# 0.575, with the same 81 stitches and size. It starts 1.7 mm from where Ink/Stitch's starts, and its needle
# points along the rails lie elsewhere. The glyph was listed until M10.6 sewed its tartan.
[[known]]
measures = ["overlap"]
follow_up = "the S-stitch satin column of Colorful's ’ starts elsewhere than Ink/Stitch's"
fonts = ["colorful"]
glyphs = ["’"]
