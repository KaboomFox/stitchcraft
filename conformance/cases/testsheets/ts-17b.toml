# TS-17B's parts so far: 6 tartan fills 40 mm square, their setts mirrored and repeated, a warp and a weft
# apart, stripes sewn as runs, a sett turned and scaled (REQ-FILL-TRT-001 to REQ-FILL-TRT-007), and a
# herringbone 3 mm wide (REQ-FILL-TRT-012 to REQ-FILL-TRT-014), each underlay in its sample's own thread and
# each colour a colour block, trimmed after. Its M10.12 parts below them: 3 linear gradient fills 40 mm
# square, of 2 stops and of 3, one of them transparent, each at a slant (REQ-FILL-GRD-001 to
# REQ-FILL-GRD-006), each underlay in its first colour's block. From M10.9, a leaf whose guided fill copies
# an S-shaped guide over its underlay (REQ-FILL-GDD-002 to REQ-FILL-GDD-007), trimmed after. The sheet draws
# only as the engine sews it without a word; the diagnostics here are the hoop's, of which there are none.
# The invariants (REQ-PLAN-…) run on the sheet's plan; the golden file is the bytes MC-12 sews.
