[package]
name = "stitchcraft-vectorcraft"
description = "StitchCraft adapter for VectorCraft documents and plug-in objects"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
stitchcraft-core = { workspace = true }
stitchcraft-params = { workspace = true }
stitchcraft-plan = { workspace = true }
stitchcraft-engine = { workspace = true }
serde = { workspace = true }
# `raw_value`: coordinates are read from their text, exactly (`src/wire.rs`), and what a filter hands back
# unchanged is written back as its text (`src/filter.rs`).
serde_json = { workspace = true, features = ["raw_value"] }
flate2 = { workspace = true }
