[package]
name = "stitchcraft-testkit"
description = "StitchCraft test support: fixtures, property-test strategies, metrics and invariant checks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
stitchcraft-core = { workspace = true }
stitchcraft-params = { workspace = true }
stitchcraft-plan = { workspace = true }
stitchcraft-engine = { workspace = true }
# The fuzz bodies (`fuzz.rs`) drive the readers, the writers, the renderer and the SVG and VectorCraft
# readers; flate2 compresses what the VectorCraft reader is given.
stitchcraft-formats = { workspace = true }
stitchcraft-render = { workspace = true }
stitchcraft-svg = { workspace = true }
stitchcraft-vectorcraft = { workspace = true }
flate2 = { workspace = true }
proptest = { workspace = true }
