# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/). Run in CI.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Advisories accepted, each with why. Each says a crate is unmaintained, which version 2 denies, and doesn't
# describe a flaw. Only the window probe uses these crates (compat/vc-window), through the xa11y it pins,
# and the probe isn't released.
ignore = [
    # zbus 6 took these crates in, and xa11y 0.15.2 uses zbus 5. Look again when xa11y moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant, unmaintained since zbus 6 took it in; only the window probe's xa11y uses it" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, unmaintained since zbus 6 took it in; only the window probe's xa11y uses it" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, unmaintained since zbus 6 took it in; only the window probe's xa11y uses it" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: licences we accept but do not use yet are fine.
unused-allowed-license = "allow"
# Permissive licences only. GPL, AGPL and LGPL are not on this list, so they are denied
# (docs/src/design/adr/0001-license-and-clean-room.md).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# The fuzz targets' workspace (fuzz/), checked too: libFuzzer's runtime is LLVM's, under the permissive
# NCSA licence as well as MIT OR Apache-2.0. Only it may use that licence.
exceptions = [
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# No randomness from the OS in what ships (docs/src/design/determinism.md). A random number generator
# comes only with proptest, for the property tests, and the OS's entropy only through it, its temporary
# files and the job server of the C build that compiles libFuzzer for the fuzz targets.
deny = [
    { crate = "rand", wrappers = ["proptest"] },
    { crate = "getrandom", wrappers = ["rand_core", "tempfile", "jobserver"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
